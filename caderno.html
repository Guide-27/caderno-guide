<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estudo de Layout — Guide Arquitetura</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --black:#0a0a0a; --dark:#111111; --card:#161616; --card2:#1c1c1c;
    --gold:#C9A227; --gold-light:#e2b93b; --gold-dim:rgba(201,162,39,0.10);
    --gold-mid:rgba(201,162,39,0.28); --gold-glow:rgba(201,162,39,0.06);
    --white:#f5f4f0; --off:#e8e6df; --muted:#7a7870; --muted2:#555450;
    --border:rgba(201,162,39,0.15); --border2:rgba(201,162,39,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--black);color:var(--white);font-family:'Outfit',sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 15% 10%,rgba(201,162,39,0.055) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 85% 90%,rgba(201,162,39,0.04) 0%,transparent 55%),radial-gradient(ellipse 40% 40% at 50% 50%,rgba(201,162,39,0.02) 0%,transparent 70%);pointer-events:none;z-index:0;}
  body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");background-size:200px 200px;pointer-events:none;z-index:0;opacity:0.6;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,transparent 0%,var(--gold) 15%,var(--gold) 85%,transparent 100%);z-index:100;opacity:0.4;}
  .top-bar{position:fixed;top:0;left:0;right:0;height:60px;background:rgba(10,10,10,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 48px;z-index:200;}
  .top-bar-logo{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold);font-weight:600;letter-spacing:0.05em;}
  .top-bar-doc{font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;font-weight:400;}
  .doc{max-width:960px;margin:0 auto;padding:120px 56px 100px;position:relative;z-index:1;}

  /* CAPA */
  .capa{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:100px 0 80px;border-bottom:1px solid var(--border);margin-bottom:80px;position:relative;}
  .capa-bg-orb{position:absolute;top:-100px;right:-150px;width:600px;height:600px;background:radial-gradient(circle,rgba(201,162,39,0.07) 0%,transparent 65%);pointer-events:none;}
  .capa-eyebrow{font-size:11px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:32px;display:flex;align-items:center;gap:16px;font-weight:500;}
  .capa-eyebrow::after{content:'';display:block;width:48px;height:1px;background:linear-gradient(to right,var(--gold),transparent);}
  .capa-titulo{font-family:'Cormorant Garamond',serif;font-size:clamp(64px,10vw,110px);font-weight:300;line-height:0.92;letter-spacing:-0.02em;color:var(--white);margin-bottom:8px;}
  .capa-titulo span{color:var(--gold);font-style:italic;}
  .capa-subtitulo{font-family:'Outfit',sans-serif;font-size:clamp(14px,2vw,18px);font-weight:300;color:var(--muted);margin-bottom:60px;letter-spacing:0.08em;text-transform:uppercase;}
  .capa-meta{display:flex;gap:48px;padding-top:40px;border-top:1px solid var(--border);flex-wrap:wrap;}
  .meta-item{display:flex;flex-direction:column;gap:6px;}
  .meta-label{font-size:9px;letter-spacing:0.18em;color:var(--muted2);text-transform:uppercase;font-weight:500;}
  .meta-val{font-size:14px;font-weight:400;color:var(--white);letter-spacing:0.01em;}

  /* ETAPAS */
  .etapas-section{margin-bottom:80px;}
  .section-label{font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin-bottom:40px;display:flex;align-items:center;gap:16px;font-weight:500;}
  .section-label::before{content:'';display:block;width:20px;height:1px;background:var(--gold);}
  .etapas-track{display:flex;align-items:flex-start;position:relative;}
  .etapas-track::before{content:'';position:absolute;top:20px;left:20px;right:20px;height:1px;background:linear-gradient(to right,var(--gold),var(--border) 40%,var(--border));}
  .etapa{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;z-index:1;}
  .etapa-num{width:40px;height:40px;border-radius:50%;background:var(--gold);color:var(--black);font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 20px rgba(201,162,39,0.35);}
  .etapa:not(:first-child) .etapa-num{background:var(--card);border:1px solid var(--border);color:var(--muted);box-shadow:none;font-size:16px;}
  .etapa-nome{font-size:10px;letter-spacing:0.06em;color:var(--muted);text-align:center;text-transform:uppercase;line-height:1.5;max-width:90px;font-weight:400;}
  .etapa:first-child .etapa-nome{color:var(--gold);}

  /* TEXTO */
  .sec-header{margin-bottom:40px;}
  .sec-title{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,5vw,56px);font-weight:300;line-height:1.1;color:var(--white);margin-bottom:16px;}
  .sec-title em{color:var(--gold);font-style:italic;}
  .sec-lead{font-size:16px;color:var(--muted);line-height:1.7;max-width:560px;}
  .text-block{font-size:15px;color:var(--off);line-height:1.8;margin-bottom:20px;max-width:680px;}
  section{margin-bottom:80px;}
  .divisor{height:1px;background:linear-gradient(to right,transparent,var(--border) 20%,var(--border) 80%,transparent);margin:80px 0;}

  /* PONTOS DE ATENÇÃO */
  .pontos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  .ponto-card{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:24px;transition:border-color 0.2s;}
  .ponto-card:hover{border-color:var(--border);}
  .ponto-icon{width:32px;height:32px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--border);color:var(--gold);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;margin-bottom:14px;letter-spacing:0.05em;}
  .ponto-titulo{font-size:13px;font-weight:500;color:var(--white);margin-bottom:8px;letter-spacing:0.03em;}
  .ponto-texto{font-size:13px;color:var(--muted);line-height:1.6;}

  /* AMBIENTES */
  .ambiente-header{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border2);}
  .ambiente-num{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:var(--gold);opacity:0.4;line-height:1;min-width:60px;}
  .ambiente-titulo{font-size:20px;font-weight:400;color:var(--white);letter-spacing:0.02em;}
  .ambiente-sub{font-size:11px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-top:4px;}
  .ambiente-bloco{margin-bottom:64px;}

  /* GRID PLANTAS */
  .plantas-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px;}
  .refs-label{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px;font-weight:500;}
  .plantas-refs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}

  /* UPLOAD */
  .img-placeholder{background:var(--card2);border:1px dashed var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all 0.2s;min-height:160px;padding:20px;position:relative;overflow:hidden;}
  .img-placeholder:hover{border-color:var(--gold);background:var(--gold-glow);}
  .img-placeholder input[type=file]{display:none;}
  .img-placeholder-icon{font-size:24px;opacity:0.3;}
  .img-placeholder span{font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;text-align:center;}
  .img-placeholder img.uploaded{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:9px;}
  .img-placeholder .upload-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;border-radius:9px;}
  .img-placeholder:hover .upload-overlay{opacity:1;}
  .upload-overlay span{font-size:11px;color:var(--white);letter-spacing:0.1em;text-transform:uppercase;}
  .uploading-indicator{position:absolute;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;border-radius:9px;}
  .uploading-indicator span{font-size:12px;color:var(--gold);}

  /* OPÇÕES */
  .opcoes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:48px;}
  .opcao-card{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:20px;transition:border-color 0.2s;}
  .opcao-card:hover{border-color:var(--border);}
  .opcao-num{font-size:10px;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-weight:500;}
  .opcao-lista{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .opcao-lista li{font-size:13px;color:var(--off);padding-left:16px;position:relative;line-height:1.5;}
  .opcao-lista li::before{content:'–';position:absolute;left:0;color:var(--gold);opacity:0.5;}

  /* SUGESTÃO FINAL */
  .sugestao-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px;margin-bottom:48px;}
  .sugestao-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
  .sugestao-badge{background:var(--gold);color:var(--black);font-size:10px;font-weight:500;letter-spacing:0.15em;text-transform:uppercase;padding:6px 16px;border-radius:20px;}
  .sugestao-titulo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--white);}
  .sugestao-img-area{background:var(--card2);border:1px dashed var(--border);border-radius:10px;min-height:300px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;transition:all 0.2s;}
  .sugestao-img-area:hover{border-color:var(--gold);}
  .sugestao-img-area input[type=file]{display:none;}
  .sugestao-img-area img.uploaded{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:9px;}

  /* RODAPÉ */
  footer{border-top:1px solid var(--border);padding:48px 0 0;margin-top:80px;display:flex;align-items:center;justify-content:space-between;}
  .rodape-logo{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold);font-weight:600;letter-spacing:0.05em;}
  .rodape-tag{font-size:11px;color:var(--muted2);letter-spacing:0.12em;text-transform:uppercase;}

  /* LOADING STATE */
  .page-loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  .page-loading p{font-size:14px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}

  .toast{position:fixed;bottom:32px;right:32px;z-index:999;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 20px;font-size:13px;color:var(--white);transform:translateY(20px);opacity:0;transition:all 0.3s;max-width:300px;}
  .toast.show{transform:translateY(0);opacity:1;}

  @media(max-width:768px){
    .doc{padding:90px 24px 60px;}
    .top-bar{padding:0 24px;}
    .plantas-grid{grid-template-columns:1fr;}
    .opcoes-grid{grid-template-columns:1fr 1fr;}
    .pontos-grid{grid-template-columns:1fr;}
    .capa-meta{gap:24px;}
  }
</style>
</head>
<body>

<div class="sidebar"></div>

<div class="top-bar">
  <span class="top-bar-logo">Guide</span>
  <span class="top-bar-doc" id="top-doc-label">Estudo de Layout</span>
</div>

<main class="doc" id="app">
  <div class="page-loading">
    <p>Carregando caderno...</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://fkbvwcppbjlodtnjrmbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0IUgFI-iKEfi_w0uuLFjzA_OiFsQoQ2';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show';
  setTimeout(() => el.className = 'toast', 3000);
}

function getProjetoId() {
  return new URLSearchParams(location.search).get('id');
}

// UPLOAD DE IMAGEM REAL NO SUPABASE
async function uploadImagem(file, pasta) {
  const ext = file.name.split('.').pop();
  const nome = `${pasta}/${Date.now()}.${ext}`;
  const { data, error } = await db.storage.from('imagens').upload(nome, file, { upsert: true });
  if (error) throw error;
  const { data: urlData } = db.storage.from('imagens').getPublicUrl(nome);
  return urlData.publicUrl;
}

// Cria slot de imagem com upload real
function criarSlotImagem(tipo, ambienteId, urlExistente = null, label = 'Imagem') {
  const div = document.createElement('div');
  div.className = 'img-placeholder';
  if (tipo === 'planta') div.style.minHeight = '220px';

  const icon = document.createElement('div');
  icon.className = 'img-placeholder-icon';
  icon.textContent = '⬜';

  const span = document.createElement('span');
  span.textContent = label;

  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';

  div.appendChild(icon);
  div.appendChild(span);
  div.appendChild(input);

  // Se já tem imagem salva, exibe
  if (urlExistente) {
    exibirImagem(div, urlExistente);
  }

  div.addEventListener('click', () => input.click());

  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;

    // Mostra indicador de upload
    const ind = document.createElement('div');
    ind.className = 'uploading-indicator';
    ind.innerHTML = '<span>Enviando...</span>';
    div.appendChild(ind);

    try {
      const pasta = `ambiente-${ambienteId}/${tipo}`;
      const url = await uploadImagem(file, pasta);

      // Salva no banco
      await db.from('imagens').insert([{ ambiente_id: ambienteId, tipo, url, nome: file.name }]);

      exibirImagem(div, url);
      toast('Imagem salva com sucesso!');
    } catch (e) {
      toast('Erro ao enviar imagem. Tente novamente.');
      console.error(e);
    } finally {
      ind.remove();
    }
  });

  return div;
}

function exibirImagem(div, url) {
  div.querySelectorAll(':not(input):not(img.uploaded):not(.upload-overlay)').forEach(el => el.style.display = 'none');
  let img = div.querySelector('img.uploaded');
  if (!img) {
    img = document.createElement('img');
    img.className = 'uploaded';
    div.appendChild(img);
  }
  img.src = url;
  div.style.border = '1px solid rgba(201,162,39,0.3)';

  let overlay = div.querySelector('.upload-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.className = 'upload-overlay';
    overlay.innerHTML = '<span>Trocar imagem</span>';
    div.appendChild(overlay);
  }
}

// Renderiza um ambiente completo
async function renderAmbiente(amb, imagens) {
  const bloco = document.createElement('div');
  bloco.className = 'ambiente-bloco';

  const header = document.createElement('div');
  header.className = 'ambiente-header';
  header.innerHTML = `
    <div class="ambiente-num">${String(amb.ordem + 1).padStart(2,'0')}</div>
    <div class="ambiente-info">
      <h3 class="ambiente-titulo">${amb.nome}</h3>
      <div class="ambiente-sub">Estudo de alternativas</div>
    </div>
  `;
  bloco.appendChild(header);

  // Grid de plantas
  const grid = document.createElement('div');
  grid.className = 'plantas-grid';

  // Planta do ambiente
  const colPlanta = document.createElement('div');
  const imgPlanta = imagens.find(i => i.ambiente_id === amb.id && i.tipo === 'planta');
  colPlanta.appendChild(criarSlotImagem('planta', amb.id, imgPlanta?.url, 'Planta do Ambiente'));
  grid.appendChild(colPlanta);

  // Referências
  const colRefs = document.createElement('div');
  const refsLabel = document.createElement('div');
  refsLabel.className = 'refs-label';
  refsLabel.textContent = 'Imagens de Referência';
  colRefs.appendChild(refsLabel);

  const refsGrid = document.createElement('div');
  refsGrid.className = 'plantas-refs';
  const refs = imagens.filter(i => i.ambiente_id === amb.id && i.tipo === 'referencia');
  const totalRefs = 3;
  for (let r = 0; r < totalRefs; r++) {
    refsGrid.appendChild(criarSlotImagem('referencia', amb.id, refs[r]?.url, `Referência ${r+1}`));
  }
  colRefs.appendChild(refsGrid);
  grid.appendChild(colRefs);
  bloco.appendChild(grid);

  // Opções de layout
  const opcLabel = document.createElement('div');
  opcLabel.className = 'section-label';
  opcLabel.textContent = 'Opções de layout';
  bloco.appendChild(opcLabel);

  const opcGrid = document.createElement('div');
  opcGrid.className = 'opcoes-grid';
  for (let o = 0; o < 3; o++) {
    const card = document.createElement('div');
    card.className = 'opcao-card';
    card.innerHTML = `
      <div class="opcao-num">Opção ${String(o+1).padStart(2,'0')}</div>
      <ul class="opcao-lista">
        <li contenteditable="true" data-amb="${amb.id}" data-opc="${o}" data-item="0">Característica 1</li>
        <li contenteditable="true" data-amb="${amb.id}" data-opc="${o}" data-item="1">Característica 2</li>
        <li contenteditable="true" data-amb="${amb.id}" data-opc="${o}" data-item="2">Característica 3</li>
      </ul>
    `;
    opcGrid.appendChild(card);
  }
  bloco.appendChild(opcGrid);

  return bloco;
}

async function init() {
  const id = getProjetoId();
  if (!id) {
    document.getElementById('app').innerHTML = '<div class="page-loading"><p>Projeto não encontrado.</p></div>';
    return;
  }

  // Busca projeto
  const { data: projeto, error } = await db.from('projetos').select('*').eq('id', id).single();
  if (error || !projeto) {
    document.getElementById('app').innerHTML = '<div class="page-loading"><p>Projeto não encontrado.</p></div>';
    return;
  }

  // Busca ambientes e imagens
  const { data: ambientes } = await db.from('ambientes').select('*').eq('projeto_id', id).order('ordem');
  const ambIds = ambientes.map(a => a.id);
  const { data: imagens } = ambIds.length
    ? await db.from('imagens').select('*').in('ambiente_id', ambIds)
    : { data: [] };

  document.getElementById('top-doc-label').textContent = `Caderno · ${projeto.nome_cliente}`;

  const dataFmt = new Date(projeto.criado_em).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });

  const app = document.getElementById('app');
  app.innerHTML = '';

  // CAPA
  const capa = document.createElement('section');
  capa.className = 'capa';
  capa.innerHTML = `
    <div class="capa-bg-orb"></div>
    <div class="capa-eyebrow">Guide Arquitetura</div>
    <h1 class="capa-titulo">Estudo de<br><span>Layout</span></h1>
    <p class="capa-subtitulo">Definição de Espaços e Opções</p>
    <div class="capa-meta">
      <div class="meta-item"><span class="meta-label">Etapa</span><span class="meta-val">01 — Definição de Layout</span></div>
      <div class="meta-item"><span class="meta-label">Cliente</span><span class="meta-val">${projeto.nome_cliente}</span></div>
      <div class="meta-item"><span class="meta-label">Imóvel</span><span class="meta-val">${projeto.endereco || '—'}</span></div>
      <div class="meta-item"><span class="meta-label">Data</span><span class="meta-val">${dataFmt}</span></div>
    </div>
  `;
  app.appendChild(capa);

  // ETAPAS
  const etapasSection = document.createElement('section');
  etapasSection.className = 'etapas-section';
  etapasSection.innerHTML = `
    <div class="section-label">Processo Guide</div>
    <div class="etapas-track">
      <div class="etapa"><div class="etapa-num">1</div><div class="etapa-nome">Definição de Layout</div></div>
      <div class="etapa"><div class="etapa-num">2</div><div class="etapa-nome">Definição do Conceito</div></div>
      <div class="etapa"><div class="etapa-num">3</div><div class="etapa-nome">Imagens Finais</div></div>
      <div class="etapa"><div class="etapa-num">4</div><div class="etapa-nome">Guia da Reforma</div></div>
    </div>
  `;
  app.appendChild(etapasSection);

  app.appendChild(Object.assign(document.createElement('div'), {className:'divisor'}));

  // TEXTO EDUCATIVO
  const textoSection = document.createElement('section');
  textoSection.innerHTML = `
    <div class="sec-header">
      <h2 class="sec-title">O layout é o <em>primeiro passo</em><br>do projeto.</h2>
    </div>
    <div class="text-block">Aqui, mostramos seu apartamento visto de cima, como se o teto fosse retirado para enxergarmos a disposição dos móveis e dos espaços.</div>
    <div class="text-block">O objetivo é visualizar onde cada móvel ficará, se a circulação é confortável e se os espaços se conectam bem entre si.</div>
    <div class="text-block">Esse desenho é chamado de <strong style="color:var(--white);font-weight:500">planta baixa</strong> e serve para você entender como cada ambiente será organizado.</div>
    <div class="text-block">Antes de escolhermos cores, acabamentos ou modelos de móveis, precisamos garantir que a disposição do espaço funcione bem para você.</div>
  `;
  app.appendChild(textoSection);

  app.appendChild(Object.assign(document.createElement('div'), {className:'divisor'}));

  // PONTOS DE ATENÇÃO
  const pontosSection = document.createElement('section');
  pontosSection.innerHTML = `
    <div class="sec-header">
      <h2 class="sec-title">Pontos de <em>atenção</em><br>na análise</h2>
      <p class="sec-lead">Na hora de analisar as opções de layout, vale prestar atenção nestes aspectos:</p>
    </div>
    <div class="pontos-grid">
      <div class="ponto-card"><div class="ponto-icon">A</div><div class="ponto-titulo">Espaço de circulação</div><div class="ponto-texto">Verifique se há passagem confortável entre os móveis para o uso diário.</div></div>
      <div class="ponto-card"><div class="ponto-icon">B</div><div class="ponto-titulo">Praticidade no dia a dia</div><div class="ponto-texto">Pense na sua rotina e se a disposição facilita as tarefas cotidianas.</div></div>
      <div class="ponto-card"><div class="ponto-icon">C</div><div class="ponto-titulo">Vivência dos espaços</div><div class="ponto-texto">Imagine-se usando cada ambiente — recebendo visitas, relaxando, trabalhando.</div></div>
      <div class="ponto-card"><div class="ponto-icon">D</div><div class="ponto-titulo">Conforto e bem-estar</div><div class="ponto-texto">Qual das opções transmite mais aconchego e atende melhor ao seu estilo de vida?</div></div>
    </div>
  `;
  app.appendChild(pontosSection);

  app.appendChild(Object.assign(document.createElement('div'), {className:'divisor'}));

  // AMBIENTES
  const opcSection = document.createElement('section');
  const opcHeader = document.createElement('div');
  opcHeader.className = 'sec-header';
  opcHeader.innerHTML = `<div class="section-label">Estudo de alternativas</div><h2 class="sec-title">Opções do<br>seu <em>Layout</em></h2>`;
  opcSection.appendChild(opcHeader);

  for (const amb of ambientes) {
    const blocoEl = await renderAmbiente(amb, imagens || []);
    opcSection.appendChild(blocoEl);
  }
  app.appendChild(opcSection);

  app.appendChild(Object.assign(document.createElement('div'), {className:'divisor'}));

  // SUGESTÃO FINAL
  const sugSection = document.createElement('section');
  sugSection.innerHTML = `
    <div class="sec-header">
      <div class="section-label">Recomendação Guide</div>
      <h2 class="sec-title">A nossa <em>sugestão</em><br>para o seu projeto</h2>
      <p class="sec-lead">Com base na análise dos ambientes e no seu perfil, recomendamos o seguinte layout para o apartamento completo.</p>
    </div>
  `;
  const sugBox = document.createElement('div');
  sugBox.className = 'sugestao-box';
  sugBox.innerHTML = `
    <div class="sugestao-header">
      <span class="sugestao-badge">Sugestão Guide</span>
      <span class="sugestao-titulo">Layout Recomendado</span>
    </div>
  `;
  const sugImg = document.createElement('div');
  sugImg.className = 'sugestao-img-area';
  sugImg.innerHTML = `<div style="text-align:center;color:var(--muted)"><div style="font-size:32px;margin-bottom:8px">🏠</div><span style="font-size:12px;letter-spacing:0.1em;text-transform:uppercase">Planta completa do apartamento</span></div>`;
  const sugInput = document.createElement('input');
  sugInput.type = 'file';
  sugInput.accept = 'image/*';
  sugImg.appendChild(sugInput);
  sugImg.addEventListener('click', () => sugInput.click());
  sugInput.addEventListener('change', async () => {
    const file = sugInput.files[0];
    if (!file) return;
    try {
      const url = await uploadImagem(file, `projeto-${id}/sugestao`);
      let img = sugImg.querySelector('img.uploaded');
      if (!img) { img = document.createElement('img'); img.className = 'uploaded'; sugImg.appendChild(img); }
      img.src = url;
      sugImg.querySelector('div').style.display = 'none';
      toast('Planta final salva!');
    } catch(e) { toast('Erro ao enviar imagem.'); }
  });
  sugBox.appendChild(sugImg);
  sugSection.appendChild(sugBox);
  app.appendChild(sugSection);

  // RODAPÉ
  const footer = document.createElement('footer');
  footer.innerHTML = `<span class="rodape-logo">Guide</span><span class="rodape-tag">Arquitetura que transforma no seu ritmo</span>`;
  app.appendChild(footer);
}

init();
</script>
</body>
</html>
