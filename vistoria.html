<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vistoria da unidade — Guide Arquitetura</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Sora:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black:#08080a; --dark:#111113; --card:#15151a; --card2:#1a1a20;
  --gold:#C9A227; --gold-light:#e2b93b; --gold-dim:rgba(201,162,39,0.08); --gold-mid:rgba(201,162,39,0.22);
  --white:#f5f4f0; --off:#e0ddd6; --muted:#969488; --muted2:#4a4845;
  --border:rgba(201,162,39,0.14); --border2:rgba(255,255,255,0.06);
  --green:#50C878; --green-dim:rgba(80,200,120,0.10); --green-mid:rgba(80,200,120,0.30);
  --alerta:#E8853A; --alerta-dim:rgba(232,133,58,0.12); --alerta-mid:rgba(232,133,58,0.4);
  --red:#DC5A5A; --red-dim:rgba(220,90,90,0.10);
  --glass:rgba(255,255,255,0.055); --glass2:rgba(255,255,255,0.035);
  --fs-2xs:10px; --fs-xs:11.5px; --fs-sm:12.5px; --fs-base:14px; --fs-md:16px; --fs-lg:19px; --fs-xl:22px; --fs-2xl:26px;
  --r-sm:12px; --r-md:16px; --r-lg:24px; --r-xl:28px; --r-pill:999px;
}
* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:var(--black); color:var(--off); font-family:'Outfit',sans-serif; font-weight:300; -webkit-font-smoothing:antialiased; }
h1,h2,h3,.titulo,.categoria-nome,.bloco-titulo,.sub-rotulo,.estrela-q,.info-modal-titulo { font-family:'Sora',sans-serif; }
svg.lucide { display:inline-block; vertical-align:-3px; stroke-width:1.8; width:18px; height:18px; }
svg.lucide.ic-sm { width:14px; height:14px; } svg.lucide.ic-md { width:18px; height:18px; }
svg.lucide.ic-lg { width:22px; height:22px; } svg.lucide.ic-xl { width:28px; height:28px; }

/* mesmo fundo do painel principal (imagem fluida + véu escuro) */
.bg-gradient { position:fixed; inset:0; z-index:0; background:url('/assets/bg-fluid.jpg') center/cover no-repeat; background-color:#0c0b09; }
.bg-breath { position:fixed; inset:0; z-index:0; background:rgba(8,8,10,0.50); }
.noise { position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0.025; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); background-size:200px; }

/* TOP BAR */
.top-bar { position:fixed; top:16px; left:16px; right:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; z-index:300;
  background:var(--glass); backdrop-filter:blur(32px) saturate(160%); -webkit-backdrop-filter:blur(32px) saturate(160%);
  border:1px solid rgba(255,255,255,0.1); border-radius:var(--r-pill); padding:8px 10px 8px 20px; min-height:56px; }
.top-logo img { height:30px; display:block; }
.top-titulo { font-family:'Sora',sans-serif; font-weight:600; font-size:var(--fs-sm); color:var(--white); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.btn-voltar { display:inline-flex; align-items:center; gap:7px; background:transparent; border:1px solid var(--border2); border-radius:var(--r-pill); padding:9px 16px; color:var(--muted); font-family:'Outfit',sans-serif; font-size:var(--fs-sm); cursor:pointer; transition:all .2s; text-decoration:none; }
.btn-voltar:hover { color:var(--gold); border-color:var(--gold-mid); }

.main { max-width:860px; margin:0 auto; padding:96px 20px 100px; position:relative; z-index:2; }

/* HEADER */
.pagina-eyebrow { font-size:var(--fs-2xs); font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin-bottom:12px; display:flex; align-items:center; gap:7px; }
.pagina-titulo { font-family:'Sora',sans-serif; font-weight:700; font-size:var(--fs-2xl); color:var(--white); line-height:1.15; margin-bottom:8px; }
.pagina-sub { font-size:var(--fs-base); color:var(--muted); line-height:1.6; margin-bottom:24px; max-width:640px; }

/* TOOLBAR PDF */
.toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:26px; }
.btn-pdf { display:inline-flex; align-items:center; gap:8px; background:var(--glass2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:11px 16px; color:var(--off); font-family:'Outfit',sans-serif; font-size:var(--fs-sm); font-weight:500; cursor:pointer; transition:all .2s; }
.btn-pdf:hover { border-color:var(--gold-mid); background:var(--gold-dim); color:var(--gold-light); }
.btn-pdf svg { color:var(--gold); }

/* BLOCO RECOLHÍVEL (guia / o que levar) — vidro sem contorno, sombra suave no hover */
.bloco { background:var(--glass2); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%); border:1px solid transparent; border-radius:var(--r-lg); margin-bottom:16px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,0.18); transition:background .25s, box-shadow .25s; }
.bloco:hover { background:rgba(255,255,255,0.05); box-shadow:0 12px 40px rgba(0,0,0,0.28); }
.bloco-toggle { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; background:transparent; border:none; cursor:pointer; padding:18px 20px; text-align:left; font-family:'Outfit',sans-serif; color:var(--white); transition:background .2s; }
.bloco-toggle:hover { background:rgba(255,255,255,0.03); }
.bloco-toggle-txt { display:flex; align-items:center; gap:10px; }
.bloco-toggle-txt .bti { width:34px; height:34px; border-radius:var(--r-sm); background:var(--gold-dim); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--gold); flex-shrink:0; }
.bloco-titulo { font-weight:600; font-size:var(--fs-md); color:var(--white); }
.bloco-toggle > svg.lucide { color:var(--gold); transition:transform .3s; flex-shrink:0; }
.bloco-toggle.aberto > svg.lucide { transform:rotate(180deg); }
.bloco-corpo { max-height:0; overflow:hidden; opacity:0; transition:max-height .5s cubic-bezier(.22,.9,.32,1), opacity .35s; }
.bloco-corpo.aberto { max-height:4000px; opacity:1; }
.bloco-corpo-inner { padding:0 20px 22px; }
.bloco-corpo-inner p { font-size:var(--fs-sm); color:var(--off); line-height:1.75; margin-bottom:14px; }
.bloco-corpo-inner p:last-child { margin-bottom:0; }

/* O QUE LEVAR — lista */
.levar-lista { display:flex; flex-direction:column; gap:12px; }
.levar-item { display:flex; gap:12px; }
.levar-item-icone { width:32px; height:32px; border-radius:var(--r-sm); background:var(--glass2); border:1px solid var(--border2); display:flex; align-items:center; justify-content:center; color:var(--gold); flex-shrink:0; }
.levar-item-nome { font-family:'Sora',sans-serif; font-weight:600; font-size:var(--fs-sm); color:var(--white); margin-bottom:3px; }
.levar-item-porque { font-size:var(--fs-sm); color:var(--muted); line-height:1.55; }

/* CHECKLIST */
.checklist-titulo { font-family:'Sora',sans-serif; font-weight:700; font-size:var(--fs-xl); color:var(--white); margin:32px 0 6px; }
.checklist-desc { font-size:var(--fs-sm); color:var(--muted); line-height:1.6; margin-bottom:20px; }
.categoria { background:var(--glass2); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%); border:1px solid transparent; border-radius:var(--r-lg); margin-bottom:16px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,0.18); }
.categoria-head { display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border2); }
.categoria-icone { width:38px; height:38px; border-radius:var(--r-sm); background:var(--gold-dim); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--gold); flex-shrink:0; }
.categoria-nome { font-weight:600; font-size:var(--fs-md); color:var(--white); flex:1; }
.categoria-progresso { font-size:var(--fs-2xs); color:var(--muted); text-transform:uppercase; letter-spacing:.05em; background:var(--glass2); border:1px solid var(--border2); border-radius:var(--r-pill); padding:4px 11px; white-space:nowrap; }
.categoria-progresso.completa { color:var(--green); border-color:var(--green-mid); background:var(--green-dim); }
.categoria-corpo { padding:6px 18px 14px; }

.subitem { padding:16px 0; border-bottom:1px solid var(--border2); }
.subitem:last-child { border-bottom:none; }
.sub-topo { display:flex; align-items:flex-start; gap:8px; margin-bottom:12px; }
.sub-rotulo { font-weight:500; font-size:var(--fs-base); color:var(--off); flex:1; line-height:1.4; }
/* botão de instrução — pílula clara e maior, para leitura intuitiva */
.sub-info-btn { display:inline-flex; align-items:center; gap:6px; background:var(--gold-dim); border:1px solid var(--gold-mid); border-radius:var(--r-pill); padding:6px 13px; color:var(--gold-light); font-family:'Outfit',sans-serif; font-size:var(--fs-xs); cursor:pointer; flex-shrink:0; transition:all .2s; }
.sub-info-btn:hover { background:rgba(201,162,39,0.16); border-color:var(--gold); color:var(--gold-light); }
.sub-info-btn svg { width:16px; height:16px; }

/* controle de status 3 estados */
.status-seg { display:inline-flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.status-btn { display:inline-flex; align-items:center; gap:6px; background:var(--glass2); border:1px solid var(--border2); border-radius:var(--r-pill); padding:7px 13px; color:var(--muted); font-family:'Outfit',sans-serif; font-size:var(--fs-xs); cursor:pointer; transition:all .18s; }
.status-btn:hover { border-color:rgba(255,255,255,0.2); }
.status-btn.sel[data-status="ok"] { color:var(--green); border-color:var(--green-mid); background:var(--green-dim); }
.status-btn.sel[data-status="pendencia"] { color:var(--alerta); border-color:var(--alerta-mid); background:var(--alerta-dim); }
.status-btn.sel[data-status="na"] { color:var(--off); border-color:rgba(255,255,255,0.25); background:rgba(255,255,255,0.06); }

/* observação + fotos */
.sub-obs { display:block; width:100%; background:var(--glass2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:9px 12px; color:var(--off); font-family:'Outfit',sans-serif; font-size:var(--fs-sm); line-height:1.5; resize:vertical; min-height:44px; margin-bottom:10px; }
.sub-obs:focus { outline:none; border-color:var(--gold-mid); }
.sub-obs::placeholder { color:var(--muted2); }
.sub-fotos { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.sub-foto-thumb { position:relative; width:56px; height:56px; border-radius:var(--r-sm); overflow:hidden; border:1px solid var(--border2); }
.sub-foto-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.sub-foto-del { position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(8,8,10,0.8); border:none; color:var(--off); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.sub-foto-add { display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px dashed var(--border2); border-radius:var(--r-sm); padding:8px 12px; color:var(--muted); font-family:'Outfit',sans-serif; font-size:var(--fs-xs); cursor:pointer; transition:all .2s; }
.sub-foto-add:hover { border-color:var(--gold-mid); color:var(--gold-light); }
.sub-foto-add svg { color:var(--gold); }

/* resolução (modo revistoria) */
.resolucao-seg { display:inline-flex; gap:6px; margin-bottom:10px; }
.resolucao-btn { display:inline-flex; align-items:center; gap:6px; background:var(--glass2); border:1px solid var(--border2); border-radius:var(--r-pill); padding:7px 14px; color:var(--muted); font-family:'Outfit',sans-serif; font-size:var(--fs-xs); cursor:pointer; transition:all .18s; }
.resolucao-btn.sel[data-res="resolvido"] { color:var(--green); border-color:var(--green-mid); background:var(--green-dim); }
.resolucao-btn.sel[data-res="nao_resolvido"] { color:var(--red); border-color:rgba(220,90,90,0.4); background:var(--red-dim); }

/* adicionar subitem personalizado */
.add-sub-btn { display:inline-flex; align-items:center; gap:7px; background:transparent; border:1px dashed var(--border2); border-radius:var(--r-pill); padding:9px 15px; margin-top:8px; color:var(--gold); font-family:'Outfit',sans-serif; font-size:var(--fs-xs); font-weight:500; cursor:pointer; transition:all .2s; }
.add-sub-btn:hover { border-color:var(--gold-mid); background:var(--gold-dim); border-style:solid; }
.sub-titulo-input { flex:1; background:transparent; border:none; border-bottom:1px dashed var(--border2); font-family:'Sora',sans-serif; font-weight:500; font-size:var(--fs-base); color:var(--off); padding:2px 0; }
.sub-titulo-input:focus { outline:none; border-color:var(--gold-mid); color:var(--white); }
.sub-titulo-input::placeholder { color:var(--muted); font-weight:400; }
.sub-del { background:transparent; border:none; color:var(--muted); cursor:pointer; padding:4px; border-radius:var(--r-sm); flex-shrink:0; transition:color .2s; }
.sub-del:hover { color:var(--red); }

/* CABEÇALHO — dados da vistoria */
.cabecalho { background:var(--glass2); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%); border:1px solid transparent; border-radius:var(--r-lg); padding:20px; margin-bottom:16px; box-shadow:0 8px 30px rgba(0,0,0,0.18); }
.cabecalho-titulo { font-family:'Sora',sans-serif; font-weight:600; font-size:var(--fs-md); color:var(--white); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.cabecalho-titulo svg { color:var(--gold); }
.cab-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:560px) { .cab-grid { grid-template-columns:1fr; } }
.cab-campo { display:flex; flex-direction:column; gap:5px; }
.cab-campo.cab-wide { grid-column:1 / -1; }
.cab-campo span { font-size:var(--fs-2xs); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.cab-campo input { background:var(--card2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:10px 12px; color:var(--white); font-family:'Outfit',sans-serif; font-size:var(--fs-sm); }
.cab-campo input:focus { outline:none; border-color:var(--gold-mid); }
.cab-campo input::placeholder { color:var(--muted2); }

/* O QUE LEVAR — check de controle */
.levar-item { align-items:center; }
.levar-check { width:32px; height:32px; border-radius:50%; border:1.5px solid var(--muted2); background:transparent; color:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:all .2s; }
.levar-check:hover { border-color:var(--gold-mid); }
.levar-check.on { background:var(--green); border-color:var(--green); color:var(--black); }
.levar-item.feito .levar-item-nome { color:var(--muted); text-decoration:line-through; }

/* FOTO com legenda */
.sub-fotos { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; }
.foto-card { display:flex; flex-direction:column; gap:5px; width:88px; }
.foto-card .sub-foto-thumb { width:88px; height:88px; }
.foto-legenda { width:88px; background:var(--card2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:5px 7px; color:var(--off); font-family:'Outfit',sans-serif; font-size:var(--fs-2xs); }
.foto-legenda:focus { outline:none; border-color:var(--gold-mid); }
.foto-legenda::placeholder { color:var(--muted2); }

/* PENDÊNCIA — ambientes com a não conformidade */
.ambientes { margin-top:4px; padding:14px; border-radius:var(--r-md); background:var(--alerta-dim); border:1px solid var(--alerta-mid); }
.ambientes-instr { font-size:var(--fs-xs); color:var(--alerta); line-height:1.5; margin-bottom:14px; display:flex; align-items:flex-start; gap:6px; }
.ambientes-instr svg { flex-shrink:0; margin-top:2px; }
.ambiente { background:var(--glass2); border-radius:var(--r-sm); padding:12px; margin-bottom:10px; }
.ambiente-topo { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.ambiente-nome { flex:1; background:var(--card2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:9px 12px; color:var(--white); font-family:'Outfit',sans-serif; font-size:var(--fs-sm); }
.ambiente-nome:focus { outline:none; border-color:var(--gold-mid); }
.ambiente-nome::placeholder { color:var(--muted2); }
.ambiente-del { background:transparent; border:none; color:var(--muted); cursor:pointer; padding:4px; flex-shrink:0; transition:color .2s; }
.ambiente-del:hover { color:var(--red); }
.amb-add-btn { display:inline-flex; align-items:center; gap:7px; background:transparent; border:1px dashed var(--alerta-mid); border-radius:var(--r-pill); padding:8px 14px; color:var(--alerta); font-family:'Outfit',sans-serif; font-size:var(--fs-xs); font-weight:500; cursor:pointer; transition:all .2s; }
.amb-add-btn:hover { background:var(--alerta-dim); border-style:solid; }

/* AVALIAÇÃO ESTRELAS */
.avaliacao { background:var(--glass2); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%); border:1px solid transparent; border-radius:var(--r-lg); padding:22px; margin:28px 0 16px; box-shadow:0 8px 30px rgba(0,0,0,0.18); }
.avaliacao-titulo { font-family:'Sora',sans-serif; font-weight:700; font-size:var(--fs-lg); color:var(--white); margin-bottom:6px; display:flex; align-items:center; gap:8px; }
.avaliacao-titulo svg { color:var(--gold); }
.avaliacao-desc { font-size:var(--fs-sm); color:var(--muted); line-height:1.6; margin-bottom:20px; }
.estrela-item { padding:14px 0; border-bottom:1px solid var(--border2); }
.estrela-item:last-child { border-bottom:none; }
.estrela-q { font-weight:500; font-size:var(--fs-sm); color:var(--off); margin-bottom:10px; }
.estrela-row { display:inline-flex; gap:6px; }
.estrela { background:transparent; border:none; cursor:pointer; color:var(--muted2); padding:0; transition:transform .15s, color .2s; }
.estrela:hover { transform:scale(1.15); }
.estrela.on { color:var(--gold); }
.estrela svg { width:26px; height:26px; fill:currentColor; }

/* NOTA GERAL */
.nota-geral { background:var(--glass2); backdrop-filter:blur(18px) saturate(140%); -webkit-backdrop-filter:blur(18px) saturate(140%); border:1px solid transparent; border-radius:var(--r-lg); padding:22px; margin-bottom:16px; box-shadow:0 8px 30px rgba(0,0,0,0.18); }
.nota-geral-titulo { font-family:'Sora',sans-serif; font-weight:600; font-size:var(--fs-md); color:var(--white); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.nota-geral-titulo svg { color:var(--gold); }
.nota-geral textarea { width:100%; background:var(--card2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:12px 14px; color:var(--off); font-family:'Outfit',sans-serif; font-size:var(--fs-sm); line-height:1.6; resize:vertical; min-height:90px; }
.nota-geral textarea:focus { outline:none; border-color:var(--gold-mid); }

/* INTEGRAÇÕES */
.integra { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:28px; }
@media (max-width:640px) { .integra { grid-template-columns:1fr; } }
.integra-card { background:linear-gradient(160deg,rgba(201,162,39,0.09),var(--glass2) 70%); border:1px solid var(--gold-mid); border-radius:var(--r-lg); padding:20px; text-align:center; }
.integra-icone { width:48px; height:48px; border-radius:50%; background:var(--gold-dim); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; color:var(--gold); }
.integra-titulo { font-family:'Sora',sans-serif; font-weight:600; font-size:var(--fs-base); color:var(--white); margin-bottom:8px; }
.integra-texto { font-size:var(--fs-xs); color:var(--muted); line-height:1.6; margin-bottom:16px; }
.integra-btn { display:inline-flex; align-items:center; gap:7px; background:var(--gold); color:var(--black); border:none; border-radius:var(--r-sm); padding:10px 16px; font-family:'Outfit',sans-serif; font-size:var(--fs-sm); font-weight:600; cursor:pointer; transition:transform .2s, box-shadow .2s; text-decoration:none; }
.integra-btn:hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(201,162,39,0.24); }

/* MODAL INFO */
.info-modal-overlay { position:fixed; inset:0; z-index:900; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(8,8,10,0.6); backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .25s; }
.info-modal-overlay.vis { opacity:1; pointer-events:auto; }
.info-modal-card { max-width:480px; width:100%; background:rgba(20,20,24,0.98); border:1px solid var(--gold-mid); border-radius:var(--r-xl); padding:28px; box-shadow:0 30px 80px rgba(0,0,0,0.55); transform:translateY(10px) scale(.98); transition:transform .25s; max-height:80vh; overflow-y:auto; }
.info-modal-overlay.vis .info-modal-card { transform:translateY(0) scale(1); }
.info-modal-head { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.info-modal-icone { width:38px; height:38px; border-radius:var(--r-sm); background:var(--gold-dim); display:flex; align-items:center; justify-content:center; color:var(--gold); flex-shrink:0; }
.info-modal-titulo { font-weight:600; font-size:var(--fs-md); color:var(--white); flex:1; }
.info-modal-close { background:transparent; border:1px solid var(--border2); color:var(--muted); border-radius:50%; width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all .2s; }
.info-modal-close:hover { color:var(--gold); border-color:var(--gold); }
.info-modal-texto { font-size:var(--fs-sm); color:var(--off); line-height:1.75; }

/* TOAST + loading */
.toast { position:fixed; bottom:20px; left:20px; background:rgba(20,20,24,0.96); backdrop-filter:blur(12px); border:1px solid var(--border); border-radius:var(--r-sm); padding:13px 18px; font-size:var(--fs-sm); color:var(--off); z-index:1000; opacity:0; pointer-events:none; transition:opacity .3s; display:flex; align-items:center; gap:8px; }
.toast.vis { opacity:1; }
.toast svg { color:var(--gold); }
.loading { text-align:center; padding:80px 20px; color:var(--muted); }
.spinner { display:inline-block; width:24px; height:24px; border:2px solid var(--border2); border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:12px; }
@keyframes spin { to { transform:rotate(360deg); } }
.vazio-msg { text-align:center; padding:40px 20px; color:var(--muted); font-size:var(--fs-sm); line-height:1.7; }

/* área offscreen para gerar PDF */
#pdf-stage { position:fixed; left:-9999px; top:0; width:794px; background:#fff; }
</style>

  'Vá sem pressa. Cada coisa que você apontar agora, a construtora corrige antes de você assumir o imóvel. Depois de assinar, resolver vira responsabilidade sua. Respire fundo e confira tudo com carinho — este guia é para você não esquecer de nada.',

  { id:'paredes', nome:'Paredes, tetos e forros', icon:'layers', subitens:[

    { id:'paredes-pintura', rotulo:'Pintura — falhas e acabamento', instrucao:'Não olhe só de frente. Incline-se e olhe a superfície num ângulo raso, com a luz da janela ou a lanterna do celular rasante à parede — assim aparecem ondulações, bolhas, escorridos e retoques invisíveis de frente. Passe a mão para sentir textura irregular.' },

    { id:'portas-prumo', rotulo:'Prumo e fechamento das portas', instrucao:'Abra e feche cada porta devagar: deve deslizar sem raspar, sem ranger e sem bater no batente. Solte a porta no meio do movimento — ela não pode abrir ou fechar sozinha (sinal de porta torta ou fora de prumo). Teste fechadura, maçaneta e chave.' },

    { id:'portas-esquadria', rotulo:'Encaixe da esquadria na parede', instrucao:'Verifique se a esquadria foi bem encaixada na parede, sem vãos, frestas ou espaços entre o caixilho e a alvenaria. Confira a borracha de vedação em volta.' },
    { id:'portas-estanqueidade', rotulo:'Estanqueidade das janelas', instrucao:'Jogue água no peitoril da janela, principalmente nos cantos. Confira se a água corre para fora (caimento correto) ou se acumula em alguma região, entra para dentro ou gera mancha de umidade na parte interna da parede.' },

let projeto = null, usuarioAtual = null;

function getItem(id) { return estado.itens[id] || {}; }
function setItem(id, patch) { estado.itens[id] = { ...getItem(id), ...patch }; agendarSalvar(); }
function custom(id) { return estado.personalizados.find(p => p.id === id); }
function ehItemCustom(id) { return estado.personalizados.some(p => p.id === id); }
// foto pode ser string (legado) ou {url, legenda}
function normFotos(arr) { return (arr || []).map(f => typeof f === 'string' ? { url: f, legenda: '' } : f); }

// ─────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────
async function inicializar() {
  if (!sb) { document.getElementById('main').innerHTML = '<div class="vazio-msg">Erro de conexão. Recarregue a página.</div>'; return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = '/login'; return; }
  usuarioAtual = data.session.user;

  const { data: proj } = await sb.from('projetos').select('*').eq('email', usuarioAtual.email).single();
  if (!proj) { document.getElementById('main').innerHTML = '<div class="vazio-msg">Não encontramos seu projeto. Fale com a Guide.</div>'; return; }
  projeto = proj;

  try {
    const { data: v } = await sb.from('vistorias').select('*').eq('projeto_id', projeto.id).maybeSingle();
    if (v) estado = { cabecalho: v.cabecalho || {}, levar: v.levar || {}, itens: v.itens || {}, personalizados: v.personalizados || [], avaliacoes: v.avaliacoes || {}, nota_geral: v.nota_geral || '' };
  } catch (e) { console.warn('Tabela vistorias ainda não existe? Rode a migração.', e); }

  // pré-preenche o cabeçalho com o que já sabemos do projeto (sem sobrescrever o que o cliente digitou)
  if (!estado.cabecalho.proprietario && projeto.nome_cliente) estado.cabecalho.proprietario = projeto.nome_cliente;
  if (!estado.cabecalho.endereco && projeto.endereco) estado.cabecalho.endereco = projeto.endereco;

  document.getElementById('top-titulo').textContent = MODO_REVISTORIA ? 'Revistoria' : 'Vistoria da unidade';
  render();
}

// ─────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────
function render() {
  document.getElementById('main').innerHTML = MODO_REVISTORIA ? renderRevistoria() : renderVistoria();
  ligarEventos();
  icons();
}

function renderVistoria() {
  return `
    <div class="pagina-eyebrow">${ic('clipboard-check','ic-sm')} Rumo às chaves</div>
    <div class="pagina-titulo">Checklist de vistoria</div>
    <div class="pagina-sub">Confira o seu apartamento item por item, no seu ritmo. Marque o que está certo, aponte as pendências, anote e fotografe — tudo fica salvo aqui.</div>

    <div class="toolbar">
      <button class="btn-pdf" id="pdf-pre">${ic('file-down','ic-sm')} PDF pré-vistoria (para levar)</button>
      <button class="btn-pdf" id="pdf-resultado">${ic('file-check-2','ic-sm')} PDF de resultado (para a construtora)</button>
    </div>

    ${renderCabecalho()}
    ${renderBlocoGuia()}
    ${renderBlocoLevar()}

    <div class="checklist-titulo">Checklist prático</div>
    <div class="checklist-desc">Para cada item: marque o status, toque no ${ic('info','ic-sm')} para ver como conferir, e registre observação e foto quando precisar.</div>
    ${CHECKLIST.map(renderCategoria).join('')}

    ${renderAvaliacao()}
    ${renderNotaGeral()}
    ${renderIntegracoes()}
  `;
}

function renderCabecalho() {
  const c = estado.cabecalho || {};
  const v = k => esc(c[k] != null ? c[k] : '');
  return `
    <div class="cabecalho">
      <div class="cabecalho-titulo">${ic('clipboard-list','ic-sm')} Dados da vistoria</div>
      <div class="cab-grid">
        <label class="cab-campo"><span>Data</span><input type="date" data-cab="data" value="${v('data')}"></label>
        <label class="cab-campo"><span>Horário</span><input type="time" data-cab="hora" value="${v('hora')}"></label>
        <label class="cab-campo"><span>Nº do apartamento</span><input type="text" data-cab="apto" placeholder="Ex.: 142" value="${v('apto')}"></label>
        <label class="cab-campo cab-wide"><span>Endereço</span><input type="text" data-cab="endereco" placeholder="Endereço do empreendimento" value="${v('endereco')}"></label>
        <label class="cab-campo"><span>Proprietário</span><input type="text" data-cab="proprietario" placeholder="Seu nome" value="${v('proprietario')}"></label>
        <label class="cab-campo"><span>Acompanhante da construtora</span><input type="text" data-cab="acompanhante" placeholder="Nome de quem acompanhou" value="${v('acompanhante')}"></label>
      </div>
    </div>`;
}

function renderBlocoGuia() {
  return `
    <div class="bloco">

        ${ic('chevron-down','ic-sm')}
      </button>
      <div class="bloco-corpo" id="bloco-guia"><div class="bloco-corpo-inner">${GUIA_TEXTO.map(p => `<p>${p}</p>`).join('')}</div></div>
    </div>`;
}

function progressoCategoria(cat) {
  const fixos = cat.subitens.map(s => s.id);
  const custom = estado.personalizados.filter(p => p.categoria === cat.id);
  const total = fixos.length + custom.length;
  let feitos = fixos.filter(id => getItem(id).status).length;
  feitos += custom.filter(p => p.status).length;
  return { feitos, total };
}

function renderCategoria(cat) {
  const { feitos, total } = progressoCategoria(cat);
  const completa = total > 0 && feitos === total;
  const custom = estado.personalizados.filter(p => p.categoria === cat.id);
  return `
    <div class="categoria">
      <div class="categoria-head">
        <div class="categoria-icone">${ic(cat.icon,'ic-md')}</div>
        <div class="categoria-nome">${cat.nome}</div>
        <div class="categoria-progresso ${completa ? 'completa' : ''}" data-prog="${cat.id}">${feitos} de ${total} verificados</div>
      </div>
      <div class="categoria-corpo">
        ${cat.nota ? `<div class="checklist-desc" style="margin:8px 0 4px;">${ic('info','ic-sm')} ${cat.nota}</div>` : ''}
        ${cat.subitens.map(s => renderSubitem(s, false)).join('')}
        ${custom.map(p => renderSubitem(p, true)).join('')}
        <button class="add-sub-btn" data-add-cat="${cat.id}">${ic('plus','ic-sm')} Adicionar item</button>
      </div>
    </div>`;
}

function renderStatusSeg(id, statusAtual) {

}

// fotos por "slot" — 'sub:<id>' (foto geral do item) ou 'amb:<subId>:<ambId>' (foto de um ambiente).
// Câmera do celular abre direto (capture="environment"); cada foto tem legenda.
function renderFotosSlot(slot, fotos) {
  return `<div class="sub-fotos" data-fotos="${slot}">
    ${(fotos||[]).map((f, i) => `
      <div class="foto-card">
        <div class="sub-foto-thumb"><img src="${f.url}"><button class="sub-foto-del" data-del-foto="${i}" data-slot="${slot}">${ic('x','ic-sm')}</button></div>
        <input type="text" class="foto-legenda" data-legenda="${i}" data-slot="${slot}" placeholder="Legenda..." value="${esc(f.legenda||'')}">
      </div>`).join('')}

}

// ao marcar PENDÊNCIA: campos por ambiente onde o defeito aparece, cada um com foto (distante + próxima) e legenda
function renderAmbientes(subId, ambientes) {
  return `<div class="ambientes" data-ambientes="${subId}">
    <div class="ambientes-instr">${ic('map-pin','ic-sm')} Informe abaixo cada ambiente onde encontrou essa não conformidade e adicione uma foto distante e uma aproximada do defeito.</div>
    ${(ambientes||[]).map(a => `
      <div class="ambiente" data-amb="${a.id}">

function renderSubitem(s, ehCustom) {
  const it = ehCustom ? s : getItem(s.id);
  const status = it.status || null;
  const obs = it.obs || '';
  const rotulo = ehCustom
    ? `<input type="text" class="sub-titulo-input" data-titulo="${s.id}" placeholder="Nome do item..." value="${esc(s.titulo)}">`
    : `<span class="sub-rotulo">${s.rotulo}</span>`;
  const infoBtn = (!ehCustom && s.instrucao) ? `<button class="sub-info-btn" data-info="${s.id}">${ic('info','ic-sm')} Como conferir</button>` : '';
  const delBtn = ehCustom ? `<button class="sub-del" data-del-sub="${s.id}" aria-label="Remover item">${ic('trash-2','ic-sm')}</button>` : '';
  const bloco = status === 'pendencia'
    ? renderAmbientes(s.id, it.ambientes || [])
    : renderFotosSlot('sub:' + s.id, normFotos(it.fotos));
  return `
    <div class="subitem" data-subitem="${s.id}">
      <div class="sub-topo">${rotulo}${infoBtn}${delBtn}</div>
      ${renderStatusSeg(s.id, status)}
      <textarea class="sub-obs" data-obs="${s.id}" placeholder="Observação (opcional)...">${esc(obs)}</textarea>
      ${bloco}
    </div>`;
}

// ── MODO REVISTORIA ──
function renderRevistoria() {
  const pendencias = [];
  CHECKLIST.forEach(cat => cat.subitens.forEach(s => {
    if (getItem(s.id).status === 'pendencia') pendencias.push({ ...s, categoria: cat.nome, ehCustom: false });
  }));
  estado.personalizados.forEach(p => { if (p.status === 'pendencia') pendencias.push({ ...p, rotulo: p.titulo, categoria: nomeCat(p.categoria), ehCustom: true }); });

  const corpo = pendencias.length ? pendencias.map(renderRevistoriaItem).join('') : `
    <div class="vazio-msg">${ic('check-circle-2','ic-lg')}<br><br>Nenhuma pendência foi registrada na sua vistoria.<br>Se ainda não fez a vistoria, comece por ela primeiro.</div>`;

  return `
    <div class="pagina-eyebrow">${ic('repeat','ic-sm')} Rumo às chaves</div>
    <div class="pagina-titulo">Revistoria — conferência de retorno</div>
    <div class="pagina-sub">Aqui estão apenas os pontos que você marcou como pendência na vistoria. Confira, um a um, se foram realmente resolvidos.</div>
    ${pendencias.length ? `<div class="toolbar"><button class="btn-pdf" id="pdf-revistoria">${ic('file-check-2','ic-sm')} PDF de status das pendências</button></div>` : ''}
    ${corpo}
  `;
}
function nomeCat(catId) { const c = CHECKLIST.find(x => x.id === catId); return c ? c.nome : 'Personalizado'; }

    <div class="categoria">
      <div class="categoria-head">
        <div class="categoria-icone" style="color:var(--alerta);background:var(--alerta-dim);border-color:var(--alerta-mid)">${ic('alert-triangle','ic-md')}</div>

// ─────────────────────────────────────────────────────────────
// EVENTOS
// ─────────────────────────────────────────────────────────────
function ligarEventos() {
  const main = document.getElementById('main');

  // cabeçalho
  main.querySelectorAll('[data-cab]').forEach(inp => inp.addEventListener('change', () => { estado.cabecalho[inp.dataset.cab] = inp.value; agendarSalvar(); }));

  // blocos recolhíveis
  main.querySelectorAll('.bloco-toggle').forEach(btn => btn.addEventListener('click', () => {
    const corpo = document.getElementById('bloco-' + btn.dataset.bloco);
    const abrindo = !corpo.classList.contains('aberto');
    corpo.classList.toggle('aberto', abrindo);
    btn.classList.toggle('aberto', abrindo);
  }));

  // "o que levar" — check de controle
  main.querySelectorAll('[data-levar-check]').forEach(btn => btn.addEventListener('click', () => {
    const i = btn.dataset.levarCheck;
    if (estado.levar[i]) delete estado.levar[i]; else estado.levar[i] = true;
    agendarSalvar(); render();
  }));

  // status — re-renderiza (abre/fecha o bloco de ambientes quando vira pendência)
  main.querySelectorAll('.status-btn').forEach(btn => btn.addEventListener('click', () => {
    const sub = btn.dataset.sub, novo = btn.dataset.status;
    aplicarStatus(sub, itemStatus(sub) === novo ? null : novo);
    render();
  }));

  // observação
  main.querySelectorAll('.sub-obs').forEach(t => t.addEventListener('change', () => aplicarObs(t.dataset.obs, t.value)));

  // item personalizado: título / remover / adicionar
  main.querySelectorAll('.sub-titulo-input').forEach(inp => inp.addEventListener('change', () => { const p = custom(inp.dataset.titulo); if (p) { p.titulo = inp.value.trim(); agendarSalvar(); } }));
  main.querySelectorAll('[data-del-sub]').forEach(btn => btn.addEventListener('click', () => { estado.personalizados = estado.personalizados.filter(x => x.id !== btn.dataset.delSub); agendarSalvar(); render(); }));
  main.querySelectorAll('[data-add-cat]').forEach(btn => btn.addEventListener('click', () => { estado.personalizados.push({ id: 'c-' + Math.random().toString(36).slice(2,9), categoria: btn.dataset.addCat, titulo: '', status: null, obs: '', fotos: [], ambientes: [] }); agendarSalvar(); render(); }));

  // info modal
  main.querySelectorAll('[data-info]').forEach(btn => btn.addEventListener('click', () => abrirInfo(btn.dataset.info)));

  // fotos por slot + legenda + excluir
  main.querySelectorAll('[data-foto-input]').forEach(inp => inp.addEventListener('change', () => enviarFoto(inp)));
  main.querySelectorAll('[data-del-foto]').forEach(btn => btn.addEventListener('click', () => removerFoto(btn.dataset.slot, +btn.dataset.delFoto)));
  main.querySelectorAll('.foto-legenda').forEach(inp => inp.addEventListener('change', () => { const arr = fotosDoSlot(inp.dataset.slot); const f = arr[+inp.dataset.legenda]; if (f) { f.legenda = inp.value.trim(); agendarSalvar(); } }));

  // ambientes (pendência)
  main.querySelectorAll('[data-amb-nome]').forEach(inp => inp.addEventListener('change', () => { const a = ambienteRef(inp.dataset.sub, inp.dataset.ambNome); if (a) { a.nome = inp.value.trim(); agendarSalvar(); } }));
  main.querySelectorAll('[data-amb-del]').forEach(btn => btn.addEventListener('click', () => { removerAmbiente(btn.dataset.sub, btn.dataset.ambDel); render(); }));
  main.querySelectorAll('[data-amb-add]').forEach(btn => btn.addEventListener('click', () => { adicionarAmbiente(btn.dataset.ambAdd); render(); }));

  // estrelas
  main.querySelectorAll('[data-estrela]').forEach(row => row.querySelectorAll('.estrela').forEach(st => st.addEventListener('click', () => {
    const grupo = row.dataset.estrela, nota = +st.dataset.nota;
    estado.avaliacoes[grupo] = (estado.avaliacoes[grupo] === nota) ? 0 : nota;
    row.querySelectorAll('.estrela').forEach(b => b.classList.toggle('on', +b.dataset.nota <= (estado.avaliacoes[grupo]||0)));
    agendarSalvar();
  })));

  // nota geral
  const nota = document.getElementById('nota-geral-input');
  if (nota) nota.addEventListener('change', () => { estado.nota_geral = nota.value; agendarSalvar(); });

  // resolução (revistoria)
  main.querySelectorAll('.resolucao-btn').forEach(btn => btn.addEventListener('click', () => {
    const sub = btn.dataset.sub, novo = btn.dataset.res;
    const jaSel = document.querySelector(`.resolucao-btn.sel[data-sub="${sub}"]`)?.dataset.res === novo;
    const val = jaSel ? null : novo;
    aplicarResolucao(sub, val);
    document.querySelectorAll(`.resolucao-btn[data-sub="${sub}"]`).forEach(b => b.classList.toggle('sel', !jaSel && b.dataset.res === novo));
  }));

  // PDFs
  const p1 = document.getElementById('pdf-pre'); if (p1) p1.addEventListener('click', () => gerarPDF('pre'));
  const p2 = document.getElementById('pdf-resultado'); if (p2) p2.addEventListener('click', () => gerarPDF('resultado'));
  const p3 = document.getElementById('pdf-revistoria'); if (p3) p3.addEventListener('click', () => gerarPDF('revistoria'));

  // comunidade (placeholder — módulo dedicado depois)
  const bc = document.getElementById('btn-comunidade');
  if (bc) bc.addEventListener('click', () => toast('Compartilhamento na Comunidade em breve — seus dados já ficam prontos para isso.'));
}

function itemStatus(id) { return ehItemCustom(id) ? (custom(id) || {}).status : getItem(id).status; }
function itemRef(id) { return ehItemCustom(id) ? custom(id) : (estado.itens[id] = estado.itens[id] || {}); }

function aplicarStatus(id, val) {
  const it = itemRef(id);
  it.status = val;
  if (val === 'pendencia' && (!it.ambientes || !it.ambientes.length)) it.ambientes = [novoAmbiente()];
  agendarSalvar();
}
function aplicarObs(id, val) { itemRef(id).obs = val.trim(); agendarSalvar(); }
function aplicarResolucao(id, val) { itemRef(id).resolucao = val; agendarSalvar(); }

// ── ambientes ──
function novoAmbiente() { return { id: 'a-' + Math.random().toString(36).slice(2,8), nome: '', fotos: [] }; }
function adicionarAmbiente(subId) { const it = itemRef(subId); it.ambientes = it.ambientes || []; it.ambientes.push(novoAmbiente()); agendarSalvar(); }
function removerAmbiente(subId, ambId) { const it = itemRef(subId); it.ambientes = (it.ambientes || []).filter(a => a.id !== ambId); agendarSalvar(); }
function ambienteRef(subId, ambId) { const it = itemRef(subId); it.ambientes = it.ambientes || []; return it.ambientes.find(a => a.id === ambId); }

// ── fotos por slot ('sub:<id>' ou 'amb:<subId>:<ambId>') ──
function fotosDoSlot(slot) {
  if (slot.startsWith('sub:')) { const it = itemRef(slot.slice(4)); it.fotos = normFotos(it.fotos); return it.fotos; }
  const p = slot.split(':'); // amb:subId:ambId
  let a = ambienteRef(p[1], p[2]);
  if (!a) { a = novoAmbiente(); a.id = p[2]; itemRef(p[1]).ambientes.push(a); }
  a.fotos = normFotos(a.fotos); return a.fotos;
}

// ── info modal ──
function abrirInfo(id) {
  const s = SUBITEM_MAP[id]; if (!s) return;
  document.getElementById('info-modal-titulo').textContent = s.rotulo;
  document.getElementById('info-modal-texto').textContent = s.instrucao;
  document.getElementById('info-modal').classList.add('vis');
}
document.getElementById('info-modal-close').addEventListener('click', () => document.getElementById('info-modal').classList.remove('vis'));
document.getElementById('info-modal').addEventListener('click', e => { if (e.target.id === 'info-modal') e.currentTarget.classList.remove('vis'); });

// ── upload / remoção de foto (com legenda), câmera direta no celular ──
async function enviarFoto(input) {
  const file = input.files[0]; if (!file) return;
  const slot = input.dataset.fotoInput;
  toast('Enviando foto...');
  const seguro = file.name.replace(/[^\w.\-]/g, '_');
  const path = `vistoria/${projeto.id}/${slot.replace(/:/g,'_')}/${Date.now()}_${seguro}`;
  const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type });
  if (upErr) { toast('Não foi possível enviar a foto.'); console.error(upErr); return; }
  const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);
  fotosDoSlot(slot).push({ url: urlData.publicUrl, legenda: '' });
  agendarSalvar(); render();
  toast('Foto anexada — adicione uma legenda.');
}
function removerFoto(slot, idx) { const arr = fotosDoSlot(slot); arr.splice(idx, 1); agendarSalvar(); render(); }

// ─────────────────────────────────────────────────────────────
// SALVAR
// ─────────────────────────────────────────────────────────────
function agendarSalvar() { clearTimeout(salvarTimer); salvarTimer = setTimeout(salvar, 700); }
async function salvar() {
  const payload = {
    projeto_id: projeto.id,
    cabecalho: estado.cabecalho,
    levar: estado.levar,
    itens: estado.itens,
    personalizados: estado.personalizados,
    avaliacoes: estado.avaliacoes,
    nota_geral: estado.nota_geral || null,
    atualizado_em: new Date().toISOString(),
  };
  const { error } = await sb.from('vistorias').upsert(payload, { onConflict: 'projeto_id' });
  if (error) { toast('Não foi possível salvar agora.'); console.error(error); return; }
  toast('Salvo.');
}

// ── PRÉ-VISTORIA (para levar) ──
function pdfBlocksPre() {
  const blocks = [];
  blocks.push(pdfHeaderBlock('Checklist de vistoria — para levar'));
  blocks.push(pdfSecTitulo('Guia da vistoria') + GUIA_TEXTO.map(p => `<p style="font-size:11px;color:#333;line-height:1.6;margin:0 0 8px;">${p}</p>`).join(''));
  blocks.push(pdfSecTitulo('O que levar') + LEVAR.map(l => `<div style="font-size:11px;color:#333;line-height:1.5;margin-bottom:6px;">☐ <b>${l.nome}.</b> ${l.porque}</div>`).join(''));
  CHECKLIST.forEach(cat => {
    const linhas = cat.subitens.map(s => `
      <div style="border:1px solid #e6e0cf;border-radius:6px;padding:9px 11px;margin-bottom:7px;">
        <div style="font-size:12px;color:#1a1a1a;font-weight:600;margin-bottom:5px;">${s.rotulo}</div>
        <div style="font-size:10px;color:#555;margin-bottom:6px;">☐ Conforme &nbsp;&nbsp; ☐ Pendência &nbsp;&nbsp; ☐ Não se aplica</div>
        <div style="font-size:9px;color:#9a8a3a;text-transform:uppercase;letter-spacing:.05em;">Observação / ambientes com pendência</div>
        <div style="border-bottom:1px solid #ccc;height:16px;"></div>
        <div style="border-bottom:1px solid #ccc;height:16px;margin-top:6px;"></div>
      </div>`).join('');
    blocks.push(pdfSecTitulo(cat.nome) + (cat.nota ? `<div style="font-size:10px;color:#999;margin-bottom:8px;">${cat.nota}</div>` : '') + linhas);
  });
  return blocks;
}

// ── RESULTADO (preenchido, para a construtora) ──
function pdfItemHtml(rotulo, it) {
  const cor = STATUS_COR[it.status] || '#555';
  let b = `<div style="border:1px solid #e6e0cf;border-radius:6px;padding:10px 12px;margin-bottom:8px;">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:${(it.obs || (it.ambientes||[]).length || (it.fotos||[]).length) ? '6px' : '0'};">
      <span style="font-size:9px;font-weight:700;color:#fff;background:${cor};border-radius:4px;padding:2px 7px;">${STATUS_LABEL[it.status]||''}</span>
      <span style="font-size:12px;color:#1a1a1a;font-weight:600;">${rotulo}</span>
    </div>`;
  if (it.obs) b += `<div style="font-size:11px;color:#444;line-height:1.5;margin-bottom:6px;">${esc(it.obs)}</div>`;
  const fotoHtml = fotos => (fotos||[]).map(f => {
    const o = typeof f === 'string' ? { url:f, legenda:'' } : f;
    return `<div style="width:104px;"><img src="${o.url}" crossorigin="anonymous" style="width:104px;height:104px;object-fit:cover;border-radius:5px;border:1px solid #ddd;display:block;"><div style="font-size:9px;color:#666;margin-top:3px;line-height:1.3;">${esc(o.legenda||'')}</div></div>`;
  }).join('');
  (it.ambientes || []).forEach(a => {
    b += `<div style="margin:6px 0 0;padding:8px 10px;background:#fbf6ec;border:1px solid #eadfc2;border-radius:5px;">
      <div style="font-size:10px;color:#9a6a1e;font-weight:600;margin-bottom:${(a.fotos||[]).length?'6px':'0'};">◦ Ambiente: ${esc(a.nome) || '—'}</div>
      ${(a.fotos||[]).length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;">${fotoHtml(a.fotos)}</div>` : ''}
    </div>`;
  });
  if ((it.fotos||[]).length) b += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">${fotoHtml(it.fotos)}</div>`;
  b += `</div>`;
  return b;
}
function pdfBlocksResultado() {
  const blocks = [pdfHeaderBlock('Resultado da vistoria — registro formal')];
  CHECKLIST.forEach(cat => {
    const fixos = cat.subitens.filter(s => getItem(s.id).status);
    const cst = estado.personalizados.filter(p => p.categoria === cat.id && p.status);
    if (!fixos.length && !cst.length) return;
    let corpo = pdfSecTitulo(cat.nome);
    fixos.forEach(s => corpo += pdfItemHtml(s.rotulo, getItem(s.id)));
    cst.forEach(p => corpo += pdfItemHtml(p.titulo || 'Item personalizado', p));
    blocks.push(corpo);
  });
  const avs = STARS.filter(st => estado.avaliacoes[st.id]);
  if (avs.length) blocks.push(pdfSecTitulo('Avaliação da entrega') + avs.map(st => `<div style="font-size:11px;color:#222;margin-bottom:5px;">${st.q} <b style="color:${GOLD}">${'★'.repeat(estado.avaliacoes[st.id])}${'☆'.repeat(5-estado.avaliacoes[st.id])}</b></div>`).join(''));
  if (estado.nota_geral) blocks.push(pdfSecTitulo('Nota geral') + `<p style="font-size:11px;color:#333;line-height:1.6;">${esc(estado.nota_geral)}</p>`);
  if (blocks.length === 1) blocks.push(`<div style="font-size:12px;color:#666;">Nenhum item preenchido ainda.</div>`);
  return blocks;
}

// ── REVISTORIA (status das pendências) ──
function pdfBlocksRevistoria() {
  const blocks = [pdfHeaderBlock('Revistoria — status das pendências')];
  const item = (rotulo, categoria, it) => {
    const cor = it.resolucao === 'resolvido' ? '#2e8b57' : it.resolucao === 'nao_resolvido' ? '#c0392b' : '#999';
    const rl = it.resolucao === 'resolvido' ? 'RESOLVIDO' : it.resolucao === 'nao_resolvido' ? 'NÃO RESOLVIDO' : 'NÃO CONFERIDO';
    return `<div style="border:1px solid #e6e0cf;border-radius:6px;padding:10px 12px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:9px;font-weight:700;color:#fff;background:${cor};border-radius:4px;padding:2px 7px;">${rl}</span>
        <span style="font-size:12px;color:#1a1a1a;font-weight:600;">${rotulo}</span>
        <span style="font-size:10px;color:#999;">${categoria}</span>
      </div>${it.obs ? `<div style="font-size:11px;color:#444;margin-top:5px;">Anotado na vistoria: ${esc(it.obs)}</div>` : ''}</div>`;
  };
  let corpo = '';
  CHECKLIST.forEach(cat => cat.subitens.forEach(s => { const it = getItem(s.id); if (it.status === 'pendencia') corpo += item(s.rotulo, cat.nome, it); }));
  estado.personalizados.forEach(p => { if (p.status === 'pendencia') corpo += item(p.titulo || 'Item', nomeCat(p.categoria), p); });
  blocks.push(corpo || `<div style="font-size:12px;color:#666;">Nenhuma pendência registrada.</div>`);
  return blocks;
}

async function gerarPDF(modo) {
  if (!window.jspdf || !window.html2canvas) { toast('Gerador de PDF ainda carregando, tente de novo.'); return; }
  toast('Gerando PDF...');
  const blocks = modo === 'pre' ? pdfBlocksPre() : modo === 'resultado' ? pdfBlocksResultado() : pdfBlocksRevistoria();
  const stage = document.getElementById('pdf-stage');
  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();
    const margin = 12, cw = pw - margin * 2;
    let y = margin;
    for (const html of blocks) {
      stage.innerHTML = pdfWrap(html);
      const canvas = await html2canvas(stage.firstElementChild, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
      let imgH = canvas.height * cw / canvas.width;
      const img = canvas.toDataURL('image/jpeg', 0.9);
      // bloco maior que a página inteira: fatia-o em páginas
      if (imgH > ph - margin * 2) {
        let sy = 0; const pageImgPx = (ph - margin * 2) * canvas.width / cw;
        while (sy < canvas.height) {
          const sliceH = Math.min(pageImgPx, canvas.height - sy);
          const csl = document.createElement('canvas'); csl.width = canvas.width; csl.height = sliceH;
          csl.getContext('2d').drawImage(canvas, 0, sy, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
          const slH = sliceH * cw / canvas.width;
          if (y + slH > ph - margin && y > margin) { pdf.addPage(); y = margin; }
          pdf.addImage(csl.toDataURL('image/jpeg', 0.9), 'JPEG', margin, y, cw, slH);
          y += slH + 3; sy += sliceH;
        }
      } else {
        if (y + imgH > ph - margin && y > margin) { pdf.addPage(); y = margin; }
        pdf.addImage(img, 'JPEG', margin, y, cw, imgH);
        y += imgH + 4;
      }
    }
    const nome = modo === 'pre' ? 'vistoria-pre' : modo === 'resultado' ? 'vistoria-resultado' : 'revistoria-status';
    pdf.save(`guide-${nome}.pdf`);
    toast('PDF gerado.');
  } catch (e) { console.error(e); toast('Não foi possível gerar o PDF agora.'); }
  finally { stage.innerHTML = ''; }
}

// ─────────────────────────────────────────────────────────────
function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = ic('check') + `<span>${msg}</span>`; icons();
  t.classList.add('vis'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('vis'), 3200);
}
