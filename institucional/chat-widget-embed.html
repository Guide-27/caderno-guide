<!-- ═══════════════════════════════════════════════════════════════════════
     CHAT DA GUIDE — EXEMPLO PARA ADICIONAR EM OUTRA PÁGINA DO SITE
     ═══════════════════════════════════════════════════════════════════════

     O chat JÁ ESTÁ nas páginas públicas principais: index.html, sobre.html e
     contratar.html. Este arquivo é só um MODELO, caso você queira ligar o chat
     numa página nova do site no futuro.

     Como usar numa página nova:
       1. No <head>, inclua o CSS:          <link rel="stylesheet" href="/chat-widget.css">
       2. Antes de </body>, inclua os scripts e o init abaixo.
       3. Se a página JÁ carrega o supabase-js e já tem um `sb`, NÃO carregue o
          supabase de novo — só chame GuideChat.init({ sb, origem:'institucional', bubble:true }).

     Atenção à versão do supabase-js: o login anônimo do visitante (sem conta,
     sem senha) só existe a partir da versão 2.43. Por isso usamos @2 (última
     2.x). Nas páginas que ainda estavam em 2.39.7, já atualizamos para @2.

     Pré-requisitos (uma vez só, no Supabase):
       • Rodar supabase-migration-chat.sql.
       • Authentication → ligar "Allow anonymous sign-ins".
     ═══════════════════════════════════════════════════════════════════════ -->

<!-- 1) No <head> da página -->
<link rel="stylesheet" href="/chat-widget.css">

<!-- 2) Antes de </body> -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/chat-widget.js"></script>
<script>

  // sessão de login de arquiteto/cliente no mesmo domínio. Não reutilize o `sb`
  // da página para isto.
  const SUPABASE_URL = 'https://fkbvwcppbjlodtnjrmbw.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrYnZ3Y3BwYmpsb2R0bmpybWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MDk2OTAsImV4cCI6MjA5NTM4NTY5MH0.yjO-PxGPgQrV6dVYK8OjkaaKQWfaVbTrpnl_1qCSjB8';
  const sbChat = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {

</script>
