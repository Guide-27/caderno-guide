function renderFaseItem(f, numAtual, videos) {
  const txt = FASES_TEXTO[f.id];
  const concluida = f.num < numAtual;
  const atual = f.num === numAtual;
  const liberada = f.num <= numAtual;
  const cls = 'fase-item' + (concluida ? ' concluida' : '') + (atual ? ' atual' : '');
  const status = concluida ? 'Concluído' : (atual ? 'Em andamento' : 'Em breve');
  const acolhimento = concluida ? txt.concluida : (atual ? txt.atual : txt.futura);
  const dataConcluida = f.tsField ? projeto[f.tsField] : null;
  const prazoArquiteto = (projeto.prazos_etapas || {})[f.id];
  let prazoHtml, prazoCls = 'fase-prazo';
  if (concluida && dataConcluida) {
    prazoHtml = `${ic('calendar-check', 'ic-sm')} Concluído em ${formatarData(dataConcluida)}`;
  } else if (prazoArquiteto) {
    prazoHtml = `${ic('calendar', 'ic-sm')} Prazo previsto: ${formatarData(prazoArquiteto)}`;
  } else {
    prazoCls += ' preparando';
    prazoHtml = `${ic('calendar', 'ic-sm')} Estamos preparando este conteúdo com todo o cuidado para você.`;
  }
  const video = videos[f.id] ? `<div class="video-wrap"><iframe src="${videos[f.id]}" allowfullscreen></iframe></div>` : '';
  return `
    <div class="${cls}">
      <div class="fase-icone">${ic(f.icon, 'ic-lg')}</div>
      <div class="fase-corpo">
        <div class="fase-nome-linha"><span class="fase-nome">${f.nome}</span><span class="fase-status-tag">${status}</span></div>
        <div class="fase-explicacao">${txt.explicacao}</div>
        ${acolhimento ? `<div class="fase-acolhimento">${acolhimento}</div>` : ''}
        <div class="${prazoCls}">${prazoHtml}</div>
        ${video}
        ${liberada ? `<div class="fase-btn"><a href="${f.url}"><button class="card-cta">Abrir caderno ${ic('arrow-right')}</button></a></div>` : ''}
      </div>
    </div>
  `;
}

// parse dos moradores/pets a partir das chaves planas mb-N-*  (pet tem espécie/porte/raça)
function parseMembros(dados) {
  const membros = {};
  Object.keys(dados).forEach(k => {
    const m = k.match(/^mb-(\d+)-(.+)$/);
    if (m) { (membros[m[1]] = membros[m[1]] || {})[m[2]] = dados[k]; }
  });
  const humanos = [], pets = [];
  Object.keys(membros).sort((a, b) => (+a) - (+b)).forEach(id => {
    const mb = membros[id];
    const ehPet = !!(mb.especie || mb.porte || mb.raca);
    if (ehPet) pets.push({ id, key: 'mb-' + id, tipo: 'pet', nome: (mb.nome || '').trim(), especie: mb.especie || '' });
    else humanos.push({ id, key: 'mb-' + id, tipo: 'humano', nome: (mb.nome || '').trim(), relacao: mb.relacao || '', primeiro: humanos.length === 0 });
  });
  return { humanos, pets };
}

// monta a lista curada de promessas (front = promessa / verso = o cuidado que a originou)
function montarPromessas(dados) {
  const out = [];
  const push = (campo, valor) => {
    const def = PROMESSAS[campo]; if (!def) return;
    let item;
    if (campo === 'paleta') {
      const pal = PALETAS[valor];
      if (pal) item = { p: `${pal.nome} — as cores que vão te representar.`, v: `Você escolheu a paleta ${pal.nome}. Ela conduz a atmosfera de cada ambiente.` };
    } else if (def.valores && def.valores[valor]) {
      item = def.valores[valor];
    }
    if (!item) item = def.fallback;
    if (item) out.push({ icon: def.icon, p: item.p, v: item.v });
  };
  // ordem de impacto emocional
  comoLista(dados['nao-quer']).slice(0, 3).forEach(v => push('nao-quer', v));
  comoLista(dados['sensacao']).slice(0, 2).forEach(v => push('sensacao', v));
  comoLista(dados['estilo']).slice(0, 1).forEach(v => push('estilo', v));
  comoLista(dados['paleta']).slice(0, 1).forEach(v => push('paleta', v));
  if ((dados['objetos-coração'] || '').toString().trim()) push('objetos-coração');
  if ((dados['reutilizar-desc'] || '').toString().trim()) push('reutilizar-desc');
  // família (com interpolação)
  const { humanos, pets } = parseMembros(dados);
  const petNome = (pets.find(p => p.nome) || {}).nome;
  if (pets.length) {
    const d = PROMESSAS_FAMILIA.pet;
    const alvo = petNome ? `o ${petNome}` : (pets[0].especie ? `o seu ${pets[0].especie.toLowerCase()}` : 'o seu pet');
    const alvoCap = alvo.charAt(0).toUpperCase() + alvo.slice(1);
    out.push({ icon: d.icon, p: d.p.replace('{pet}', alvo), v: d.v.replace('{petCap}', alvoCap).replace('{pet}', alvo) });
  }
  if (humanos.length >= 2) {
    const d = PROMESSAS_FAMILIA.moradores;
    out.push({ icon: d.icon, p: d.p.replace('{moradores}', humanos.length), v: d.v.replace('{moradores}', humanos.length) });
  }
  return out;
}

// 3.2 — moodboard: flat-lay editorial (referência: amostras de material fotografadas sobre
// fundo neutro, levemente sobrepostas, rotação mínima). Vegetação/mobiliário como acentos atrás.
function montarMoodboard(dados, completo) {
  const refs = (dados._uploads && dados._uploads['refs-prev']) || [];
  const paletaKeys = comoLista(dados['paleta']);
  const cores = [];
  paletaKeys.forEach(k => { if (PALETAS[k]) cores.push(...PALETAS[k].cores); });
  const estilos = comoLista(dados['estilo']);
  const texKeys = [];
  estilos.forEach(e => (TEXTURAS_POR_ESTILO[e] || []).forEach(t => { if (!texKeys.includes(t)) texKeys.push(t); }));

  if (!completo && !refs.length && !cores.length && !texKeys.length) return placeholderMoodboard();

  // cluster compacto e centrado, poucas peças maiores, rotação mínima (clean, não "quadro de avisos")
  const POS = [
    { l: 6,  t: 4,  r: -2, z: 4,  w: 30 }, { l: 37, t: 0,  r: 2,  z: 6,  w: 27 },
    { l: 63, t: 7,  r: -3, z: 5,  w: 27 }, { l: 15, t: 33, r: 3,  z: 8,  w: 29 },
    { l: 43, t: 30, r: -2, z: 10, w: 31 }, { l: 71, t: 35, r: 3,  z: 7,  w: 25 },
    { l: 25, t: 62, r: -3, z: 7,  w: 27 }, { l: 53, t: 64, r: 2,  z: 7,  w: 27 },
  ];
  let i = 0;
  const pecas = [];
  const posStyle = () => { const p = POS[i % POS.length]; i++; return `left:${p.l}%;top:${p.t}%;width:${p.w}%;z-index:${p.z};transform:rotate(${p.r}deg);`; };

  refs.slice(0, 3).forEach(r => pecas.push(`<div class="mb-peca mb-foto" style="${posStyle()}"><img src="${r.url}" alt=""></div>`));
  cores.slice(0, 3).forEach(c => pecas.push(`<div class="mb-peca mb-cor" style="${posStyle()}"><span style="background:${c}"></span></div>`));
  texKeys.slice(0, 2).forEach(k => { const t = TEXTURAS[k]; if (t) pecas.push(`<div class="mb-peca mb-tex" style="${posStyle()}" title="${t.nome}"><span style="background:${t.css}"></span></div>`); });

  // vegetação e mobiliário: acentos ilustrativos maiores, nas bordas, sem "passe-partout"
  const ACENTOS = [{ l: -6, t: 8, r: -6, z: 2, w: 26 }, { l: 80, t: 46, r: 8, z: 2, w: 24 }];
  let j = 0;
  MOODBOARD_COMPONENTES.filter(f => f.startsWith('movel') || f.startsWith('planta')).slice(0, 2).forEach(f => {
    const p = ACENTOS[j % ACENTOS.length]; j++;
    pecas.push(`<div class="mb-peca mb-comp" style="left:${p.l}%;top:${p.t}%;width:${p.w}%;z-index:${p.z};transform:rotate(${p.r}deg);"><img src="/assets/o-que-voce-sonhou/moodboard/${f}" alt="" onerror="this.parentElement.remove()"></div>`);
  });

  return `<div class="moodboard-palco"><div class="moodboard-fundo"></div>${pecas.join('')}</div>`;
}

// 3.4 — "Quem divide esse sonho com você": JOGO DOS PALPITES (dado próprio do card, não do briefing)
// registro do palpite (antes) e confirmação (depois que a fase Imagens é liberada).
function palpiteDe(key) { return palpites.find(p => p.personagem_key === key) || {}; }

function montarPalpites(dados) {
  const { humanos, pets } = parseMembros(dados);
  const personagens = [...humanos, ...pets];
  if (!personagens.length) return '';
  const imagensLiberada = (projeto.etapa_atual || 1) >= 3; // fase Imagens = etapa 3

  const cartao = (m) => {
    const ehPet = m.tipo === 'pet';
    const primeiro = m.primeiro;
    const nome = ehPet ? (m.nome || m.especie || 'seu pet') : (primeiro ? (m.nome || 'Você') : (m.nome || m.relacao || 'Morador'));
    const papelCls = ehPet ? 'pet' : (primeiro ? 'voce' : 'humano');
    const icone = ehPet ? 'paw-print' : (primeiro ? 'user-round' : 'user');
    const reg = palpiteDe(m.key);
    const nomeQuestao = primeiro ? (m.nome || 'você') : nome;

    const perguntaAntes = ehPet
      ? 'Qual você acha que vai ser o ambiente preferido do seu pet?'
      : `Qual ambiente ${nomeQuestao} acha que será seu favorito?`;
    const perguntaDepois = ehPet
      ? 'E aí, qual foi mesmo o cantinho preferido dele?'
      : `Agora que já viram as imagens, qual foi mesmo o ambiente favorito ${primeiro ? 'seu' : 'do(a) ' + nome}?`;

    // revelação lado a lado quando ambos preenchidos
    const revelacao = (reg.palpite && reg.confirmacao)
      ? `<div class="palpite-revelacao">${ic('sparkles','ic-sm')} Palpite: <b>"${reg.palpite}"</b> · Na real: <b>"${reg.confirmacao}"</b></div>`
      : '';

    const obsPet = ehPet ? `<div class="palpite-obs">${ic('info','ic-sm')} Ah, mas esse só dá pra descobrir depois de tudo pronto. Mas volte aqui e registre se o seu palpite deu certo!</div>` : '';

    const campoDepois = imagensLiberada
      ? `<label class="palpite-campo">
           <span class="palpite-label">${perguntaDepois}</span>
           <input type="text" class="palpite-input" data-key="${m.key}" data-nome="${nome}" data-tipo="${m.tipo}" data-campo="confirmacao" placeholder="O ambiente favorito de verdade..." value="${(reg.confirmacao || '').replace(/"/g,'&quot;')}">
         </label>`
      : `<div class="palpite-travado">${ic('lock','ic-sm')} A confirmação abre quando as imagens do projeto forem liberadas. Guarde seu palpite!</div>`;

    return `
      <div class="palpite-card">
        <div class="palpite-topo">
          <div class="pers-avatar ${papelCls}">${ic(icone,'ic-md')}</div>
          <div class="pers-nome">${nome}</div>
        </div>
        ${obsPet}
        <label class="palpite-campo">
          <span class="palpite-label">${perguntaAntes}</span>
          <input type="text" class="palpite-input" data-key="${m.key}" data-nome="${nome}" data-tipo="${m.tipo}" data-campo="palpite" placeholder="Ex.: a varanda, a cozinha, o home office..." value="${(reg.palpite || '').replace(/"/g,'&quot;')}">
        </label>
        ${campoDepois}
        ${revelacao}
      </div>
    `;
  };

  return `
    <div class="traj-bloco-titulo">${ic('users','ic-sm')} Quem divide esse sonho com você</div>
    <div class="palpite-instrucao">Registre seu palpite: qual será o ambiente favorito de cada um? Depois do projeto pronto, volte e descubra.</div>
    <div class="palpite-lista ${personagens.length > 3 ? 'compacta' : ''}">${personagens.map(cartao).join('')}</div>
  `;
}

function expandidoSonhou() {
  const dados = bfDados();

  // ── ESTADO PRIMEIRO ACESSO ──
  if (!dados) {
    const urls = imagensSonhou(null);
    return `
      <div class="modal-eyebrow">${ic('heart')} O que você sonhou</div>
      <div class="modal-titulo">O seu sonho começa aqui</div>
      ${marqueeSonhou(urls, 'grande')}
      <p class="farol">${marcarPalavras('Aqui você vai poder ver o seu estilo, suas cores e as inspirações do seu lar reunidas num só lugar. Mas primeiro, precisamos conhecer o seu sonho.')}</p>
      <button class="btn-primario" id="sonhou-iniciar">${ic('arrow-right','ic-sm')} Começar pelo Meu Projeto</button>
    `;
  }

  // ── ESTADO PREENCHIDO / EM ANDAMENTO ──
  // "completo" = briefing efetivamente enviado. Enquanto isso não acontece, os blocos que
  // dependem de conteúdo visual (imagens/texturas/moodboard/promessas) mostram um estado
  // de espera em vez de ficarem quebrados ou vazios.
  const completo = !!(briefing && briefing.status === 'enviado');

  const banner = !completo ? `
    <p class="farol">${marcarPalavras("Para uma experiência completa neste painel, primeiramente é necessário concluir a etapa de briefing, que nos permite conhecer um pouco mais de você. Conclua a etapa de briefing no card ao lado 'Meu Projeto' e depois venha conferir.")}</p>
  ` : '';

  const promessas = completo ? montarPromessas(dados) : [];

  const blocoMoodboard = `
    <div class="traj-bloco-titulo">${ic('layout-panel-left','ic-sm')} O painel dos seus sonhos</div>
    <div class="moodboard-legenda">Um moodboard montado com as suas referências, cores, texturas e o clima do seu estilo.</div>
    ${montarMoodboard(dados, completo)}
  `;

  const blocoPromessas = completo
    ? (promessas.length ? renderPromessaCards(promessas) : '')
    : renderPromessaCards(PROMESSAS_GENERICAS) + `<div class="promessa-nota">${ic('info','ic-sm')} Venha conferir novamente após o preenchimento do briefing.</div>`;

  return `
    <div class="modal-eyebrow">${ic('heart')} O que você sonhou</div>
    <div class="modal-titulo">O sonho, guardado em detalhes</div>

    ${blocoPromessas}
    ${montarPalpites(dados)}

}

// grava a data de um marco fixo (usado pelo input de data e pelo toggle) e re-renderiza
// a lista (atualiza o toggle, o check do item e a contagem no card fechado)
async function salvarMarcoFixo(campo, valorIso) {
  const payload = { projeto_id: projeto.id, [campo]: valorIso, atualizado_em: new Date().toISOString() };
  const { data, error } = await sb.from('marcos_pos_chaves').upsert(payload, { onConflict: 'projeto_id' }).select().single();
  if (error) { toast('Não foi possível salvar agora.'); console.error(error); return; }
  marcos = data;
  toast(valorIso ? 'Marco concluído!' : 'Marco desmarcado.');
  renderBento();
  document.getElementById('modal-inner').innerHTML = `<button class="modal-close" onclick="fecharExpandido()">${ic('x')}</button>` + expandidoChaves();
  ligarChaves();
  icons();
}

function ligarChaves() {
  // marcos fixos — cada mudança de data re-renderiza (atualiza o toggle e a contagem)
  document.querySelectorAll('#modal-inner .marco-data-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const valor = inp.value ? new Date(inp.value).toISOString() : null;
      salvarMarcoFixo(inp.dataset.campo, valor);
    });
  });

  // toggle capsule ao lado do nome — clique alterna concluído/pendente (grava hoje / limpa)
  document.querySelectorAll('#modal-inner .marco-toggle[data-campo]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ativo = btn.classList.contains('ativo');
      salvarMarcoFixo(btn.dataset.campo, ativo ? null : new Date().toISOString());
    });
    ativarTiltToggle(btn);
  });

  // instrução detalhada de cada marco fixo (accordion "+")
  ligarAccordionsGenericos();

  // marcos personalizados — salvam sem re-render (evita perder o que está sendo digitado
  // em outros campos); o "+" duplica o mesmo template para o cliente adicionar mais um
  document.querySelectorAll('#modal-inner .marco-custom').forEach(ligarMarcoCustomCard);
  const btnAdd = document.getElementById('btn-add-marco');
  if (btnAdd) {
    btnAdd.addEventListener('click', () => {
      const wrapper = document.createElement('div');
      wrapper.innerHTML = renderMarcoCustom(null).trim();
      const novoEl = wrapper.firstElementChild;
      btnAdd.parentElement.insertBefore(novoEl, btnAdd);
      ligarMarcoCustomCard(novoEl);
      icons();
    });
  }
}

function ligarMarcoCustomCard(card) {
  const salvar = () => salvarMarcoPersonalizado(card);
  card.querySelector('.marco-custom-titulo').addEventListener('change', salvar);
  card.querySelector('.marco-custom-desc').addEventListener('change', salvar);
  card.querySelector('.marco-custom-data').addEventListener('change', salvar);
  card.querySelector('.marco-custom-del').addEventListener('click', () => excluirMarcoPersonalizado(card));

  // toggle capsule — clique marca hoje / limpa a data, e já salva
  const toggle = card.querySelector('.marco-toggle');
  const dataInput = card.querySelector('.marco-custom-data');
  toggle.addEventListener('click', () => {
    const ativo = toggle.classList.contains('ativo');
    dataInput.value = ativo ? '' : new Date().toISOString().slice(0, 10);
    toggle.classList.toggle('ativo', !ativo);
    toggle.setAttribute('aria-pressed', String(!ativo));
    card.classList.toggle('feito', !ativo);
    salvarMarcoPersonalizado(card);
  });
  ativarTiltToggle(toggle);
}

// inclinação 3D sutil ao passar o mouse sobre o toggle — o JS só mede a posição do mouse,
// quem inclina e suaviza é a transição CSS do próprio .marco-toggle
function ativarTiltToggle(el) {
  if (!el || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const forca = 14; // graus — acima de 15 já exagera
  el.addEventListener('mousemove', (ev) => {
    const r = el.getBoundingClientRect();
    const x = (ev.clientX - r.left) / r.width - .5;
    const y = (ev.clientY - r.top) / r.height - .5;
    el.style.transform = `perspective(700px) rotateY(${x * forca}deg) rotateX(${-y * forca}deg) translateZ(12px)`;
  });
  el.addEventListener('mouseleave', () => { el.style.transform = ''; });
}

async function salvarMarcoPersonalizado(card) {
  const idAtual = card.dataset.marcoId;
  const titulo = card.querySelector('.marco-custom-titulo').value.trim();
  const descricao = card.querySelector('.marco-custom-desc').value.trim();
  const dataInput = card.querySelector('.marco-custom-data').value;
  const dataIso = dataInput ? new Date(dataInput).toISOString() : null;
  if (!titulo && !descricao && !dataIso) return; // nada pra salvar ainda

  const ehNovo = idAtual.startsWith('novo-');
  if (ehNovo) {
    const { data, error } = await sb.from('marcos_personalizados').insert({ projeto_id: projeto.id, titulo, descricao, data: dataIso }).select().single();
    if (error) { toast('Não foi possível salvar este marco agora.'); console.error(error); return; }
    card.dataset.marcoId = data.id;
    marcosPersonalizados.push(data);
    toast('Marco adicionado.');
  } else {
    const { error } = await sb.from('marcos_personalizados').update({ titulo, descricao, data: dataIso }).eq('id', idAtual);
    if (error) { toast('Não foi possível salvar agora.'); console.error(error); return; }
    const idx = marcosPersonalizados.findIndex(m => m.id === idAtual);
    if (idx > -1) marcosPersonalizados[idx] = { ...marcosPersonalizados[idx], titulo, descricao, data: dataIso };
    toast('Marco atualizado.');
  }
  card.classList.toggle('feito', !!dataIso);
}

async function excluirMarcoPersonalizado(card) {
  const idAtual = card.dataset.marcoId;
  if (!idAtual.startsWith('novo-')) {
    const { error } = await sb.from('marcos_personalizados').delete().eq('id', idAtual);
    if (error) { toast('Não foi possível remover agora.'); console.error(error); return; }
    marcosPersonalizados = marcosPersonalizados.filter(m => m.id !== idAtual);
  }
  card.remove();
  toast('Marco removido.');
}

function ligarQuizOpcoes() {
  document.querySelectorAll('#modal-inner .quiz-opcao').forEach(b => {
    b.addEventListener('click', () => {
      if (b.disabled) return;
      const opcoes = document.querySelectorAll('#modal-inner .quiz-opcao');
      opcoes.forEach(o => o.disabled = true);
      const i = parseInt(b.dataset.i, 10);
      const q = QUIZ[quizIndex];
      const feedback = document.getElementById('quiz-feedback');
      if (i === q.correta) {
        b.classList.add('correta');
        quizAcertos++;
        feedback.textContent = 'Isso mesmo! ' + q.opcoes[q.correta] + '.';
      } else {
        b.classList.add('errada');
        opcoes[q.correta].classList.add('correta');
        feedback.textContent = 'A resposta certa é: ' + q.opcoes[q.correta] + '.';
      }
      feedback.style.display = 'block';
      setTimeout(() => {
        quizIndex++;
        document.getElementById('glossario-conteudo').innerHTML = renderQuiz();
        ligarQuizOpcoes();
        const reiniciar = document.getElementById('btn-quiz-reiniciar');
        if (reiniciar) reiniciar.addEventListener('click', () => { quizIndex = 0; quizAcertos = 0; document.getElementById('glossario-conteudo').innerHTML = renderQuiz(); ligarQuizOpcoes(); });
        icons();
      }, 1400);
    });
  });
}

  return mural.map(f => `

function ligarMural() {
  const input = document.getElementById('mural-input-arquivo');
  input.addEventListener('change', async () => {
    const file = input.files[0];
    if (!file) return;
    toast('Enviando foto...');
    const legenda = document.getElementById('mural-legenda').value.trim();
    const seguro = file.name.replace(/[^\w.\-]/g, '_');
    const path = `mural/${projeto.id}/${Date.now()}_${seguro}`;
    const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type });
    if (upErr) { toast('Não foi possível enviar a foto.'); console.error(upErr); return; }
    const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(path);
    const { data, error } = await sb.from('mural_fotos').insert({ projeto_id: projeto.id, url: urlData.publicUrl, legenda: legenda || null }).select().single();
    if (error) { toast('Não foi possível salvar a foto.'); console.error(error); return; }
    mural.unshift(data);
    document.getElementById('mural-grid').innerHTML = renderMuralGrid();
    document.getElementById('mural-legenda').value = '';
    input.value = '';
    renderBento();
    toast('Foto adicionada ao mural.');
  });
}

// EFEITOS DE REFINAMENTO
// ─────────────────────────────────────────────────────────────

function initEfeitos() {
  const suportaHover = window.matchMedia('(hover: hover)').matches;
  if (suportaHover) {
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', (e) => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--x', (e.clientX - r.left) + 'px');
        card.style.setProperty('--y', (e.clientY - r.top) + 'px');
      });
    });
    const dot = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;
    document.addEventListener('mousemove', (e) => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate(${mx}px, ${my}px) translate(-50%,-50%)`;
      const alvoInterativo = e.target.closest('.card, button, a, .humor-btn, .flip-card, .quiz-opcao');
      ring.classList.toggle('on-interactive', !!alvoInterativo);
    });
    (function loop() {
      rx += (mx - rx) * 0.15; ry += (my - ry) * 0.15;
      ring.style.transform = `translate(${rx}px, ${ry}px) translate(-50%,-50%)`;
      requestAnimationFrame(loop);
    })();
  } else {
    document.getElementById('cursor-dot').style.display = 'none';
    document.getElementById('cursor-ring').style.display = 'none';
  }
}
