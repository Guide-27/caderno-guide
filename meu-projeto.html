<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Projeto — Guide Arquitetura</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black:#08080a;
  --dark:#111113;
  --card:#15151a;
  --card2:#1a1a20;
  --gold:#C9A227;
  --gold-light:#e2b93b;
  --gold-dim:rgba(201,162,39,0.08);
  --gold-mid:rgba(201,162,39,0.22);
  --white:#f5f4f0;
  --off:#e0ddd6;
  --muted:#7a7870;
  --muted2:#4a4845;
  --border:rgba(201,162,39,0.14);
  --border2:rgba(255,255,255,0.06);
  --green:#50C878;
  --green-dim:rgba(80,200,120,0.09);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--black);
  color: var(--off);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body { background: var(--black); }

/* FUNDO ANIMADO */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
}

.noise {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 200px;
}

/* TOP BAR FLUTUANTE */
.top-bar {
  position: fixed;
  top: 24px;
  left: 28px;
  right: 28px;
  height: 60px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(32px) saturate(160%);
  -webkit-backdrop-filter: blur(32px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 28px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 18px 44px rgba(0, 0, 0, 0.45), 0 0 24px rgba(201, 162, 39, 0.04);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  z-index: 300;
}

.top-left {
  display: flex;
  align-items: center;
  gap: 9px;
}

.top-logo {
  font-family: 'Quicksand', sans-serif;
  font-size: 14px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.04em;
}

.top-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.top-cliente {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.btn-logout {
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  transition: all 0.2s;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.btn-logout:hover {
  color: var(--gold);
  border-color: var(--border);
}

/* MAIN */
.main {
  max-width: 580px;
  margin: 0 auto;
  padding: 140px 28px 120px;
  position: relative;
  z-index: 2;
}

/* HEADER */
.hub-header {
  margin-bottom: 56px;
  text-align: center;
}

.hub-saudacao {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 16px;
}

.hub-titulo {
  font-family: 'Quicksand', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}

.hub-progresso {
  font-size: 12px;
  color: var(--muted);
  margin-top: 12px;
}

/* TIMELINE */
.timeline {
  position: relative;
  padding-left: 32px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: linear-gradient(to bottom, var(--gold), var(--gold) 30%, transparent);
}

/* ETAPA CARD */
.etapa-wrap {
  margin-bottom: 32px;
  position: relative;
}

.etapa-dot {
  position: absolute;
  left: -28px;
  top: 24px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--card2);
  border: 2px solid var(--muted2);
  z-index: 10;
  transition: all 0.3s;
}

.etapa-wrap.concluida .etapa-dot {
  background: var(--green);
  border-color: var(--green);
  box-shadow: 0 0 12px rgba(80, 200, 120, 0.3);
}

.etapa-wrap.ativa .etapa-dot {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 12px rgba(201, 162, 39, 0.4);
}

.etapa-wrap.bloqueada .etapa-dot {
  background: var(--muted2);
  border-color: var(--muted2);
  opacity: 0.4;
}

.etapa-card {
  background: rgba(255, 255, 255, 0.035);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border2);
  border-radius: 18px;
  padding: 24px;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
}

.etapa-card:hover:not(.bloqueada) {
  border-color: var(--gold-mid);
  background: rgba(255, 255, 255, 0.05);
  transform: translateX(4px);
}

.etapa-card.bloqueada {
  opacity: 0.5;
  cursor: not-allowed;
}

.etapa-card.concluida {
  border-color: rgba(80, 200, 120, 0.28);
  background: rgba(80, 200, 120, 0.05);
}

.etapa-card.ativa {
  border-color: var(--gold);
  background: linear-gradient(135deg, rgba(201, 162, 39, 0.1), rgba(201, 162, 39, 0.03));
}

/* CONTEÚDO DO CARD */
.etapa-num {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.etapa-card.bloqueada .etapa-num {
  color: var(--muted2);
}

.etapa-card.concluida .etapa-num {
  color: var(--green);
}

.etapa-nome {
  font-family: 'Quicksand', sans-serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--white);
  margin-bottom: 8px;
  line-height: 1.3;
}

.etapa-card.bloqueada .etapa-nome {
  color: var(--muted);
}

.etapa-desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  margin-bottom: 16px;
}

.etapa-card.bloqueada .etapa-desc {
  color: var(--muted2);
}

/* STATUS E BOTÃO */
.etapa-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.etapa-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--gold);
  text-transform: uppercase;
}

.etapa-status.concluida {
  color: var(--green);
}

.etapa-status.bloqueada {
  color: var(--muted2);
}

.status-icon {
  display: inline-block;
  font-size: 12px;
}

.btn-acessar {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 14px;
  font-size: 10px;
  color: var(--gold);
  cursor: pointer;
  font-family: 'Outfit', sans-serif;
  transition: all 0.2s;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  font-weight: 500;
}

.btn-acessar:hover {
  border-color: var(--gold);
  background: var(--gold-dim);
}

.btn-acessar:disabled {
  border-color: var(--muted2);
  color: var(--muted2);
  cursor: not-allowed;
  opacity: 0.5;
}

/* SEPARADOR */
.timeline-sep {
  height: 1px;
  background: linear-gradient(to right, transparent, var(--border) 20%, var(--border) 80%, transparent);
  margin: 48px 0;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 24px;
  background: rgba(20, 20, 24, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 20px;
  font-size: 12px;
  color: var(--off);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.toast.vis {
  opacity: 1;
  pointer-events: auto;
}

/* CARREGANDO */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 13px;
}

.spinner {
  display: inline-block;
  width: 24px;
  height: 24px;
  border: 2px solid var(--border2);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="noise"></div>

<div class="top-bar">
  <div class="top-left">
    <div class="top-logo">Guide</div>
  </div>
  <div class="top-right">
    <div class="top-cliente" id="top-cliente"></div>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>
</div>

<div class="main">
  <div class="hub-header">
    <div class="hub-saudacao">Bem-vindo</div>
    <div class="hub-titulo">Meu Projeto</div>
    <div class="hub-progresso" id="hub-progresso"></div>
  </div>

  <div id="hub-content">
    <div class="loading">
      <div class="spinner"></div>
      <p>Carregando seu projeto...</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- SUPABASE JS CLIENT (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────

const SUPABASE_URL = 'https://fkbvwcppbjlodtnjrmbw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrYnZ3Y3BwYmpsb2R0bmpybWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MDk2OTAsImV4cCI6MjA5NTM4NTY5MH0.yjO-PxGPgQrV6dVYK8OjkaaKQWfaVbTrpnl_1qCSjB8';

let sb = null;
if (window.supabase && window.supabase.createClient) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  console.error('Biblioteca Supabase não carregou. Verifique a conexão.');
}

// DEFINIÇÃO DAS 5 ETAPAS
const ETAPAS = [
  {
    id: 'briefing',
    num: 1,
    nome: 'Briefing + Conceito',
    desc: 'Conte-nos como você imagina seu novo lar',
    url: '/briefing'
  },
  {
    id: 'layout',
    num: 2,
    nome: 'Estudo de Layout',
    desc: 'Escolha a melhor disposição dos ambientes',
    url: '/layout'
  },
  {
    id: 'imagens',
    num: 3,
    nome: 'Imagens 3D',
    desc: 'Visualize o resultado final do projeto',
    url: '/imagens'
  },
  {
    id: 'executivo',
    num: 4,
    nome: 'Guia Executivo',
    desc: 'Especificações técnicas e links de compra',
    url: '/executivo'
  },
  {
    id: 'obra',
    num: 5,
    nome: 'Acompanhamento de Obra',
    desc: 'Acompanhe o progresso da reforma',
    url: '/obra'
  }
];

// ─────────────────────────────────────────────────────────────
// FUNDO ANIMADO
// ─────────────────────────────────────────────────────────────

(function(){
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let W, H, t = 0;
  
  const orbs = [
    { x: 0.15, y: 0.2, r: 0.42, c: [201, 162, 39], a: 0.045 },
    { x: 0.85, y: 0.8, r: 0.36, c: [201, 162, 39], a: 0.032 },
    { x: 0.5, y: 0.5, r: 0.28, c: [80, 100, 200], a: 0.022 },
  ];
  
  function resize() {
    W = c.width = innerWidth;
    H = c.height = innerHeight;
  }
  
  function draw() {
    ctx.clearRect(0, 0, W, H);
    t += 0.0025;
    
    orbs.forEach((o, i) => {
      const dx = Math.sin(t * 0.7 + i * 1.3) * 0.05;
      const dy = Math.cos(t * 0.5 + i * 0.9) * 0.04;
      const x = (o.x + dx) * W;
      const y = (o.y + dy) * H;
      const r = o.r * Math.min(W, H);
      
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${o.c}, ${o.a})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    });
    
    requestAnimationFrame(draw);
  }
  
  window.addEventListener('resize', resize);
  resize();
  draw();
})();

// ─────────────────────────────────────────────────────────────
// MAIN
// ─────────────────────────────────────────────────────────────

let usuarioAtual = null;
let clienteAtual = null;
let etapaAtual = 0; // número da etapa liberada (1 a 5)

async function inicializar() {
  if (!sb) {
    mostrarErro('Erro de conexão com o servidor. Recarregue a página.');
    return;
  }
  // Check se está logado
  const { data } = await sb.auth.getSession();
  if (!data.session) {
    window.location.href = '/login';
    return;
  }
  
  usuarioAtual = data.session.user;
  document.getElementById('top-cliente').textContent = usuarioAtual.email;
  
  // Buscar dados do projeto pelo email do cliente
  try {
    const { data: projeto, error } = await supabase
      .from('projetos')
      .select('id, nome_cliente, etapa_atual')
      .eq('email', usuarioAtual.email)
      .single();
    
    if (error) {
      mostrarErro('Erro ao carregar projeto. Entre em contato com a Guide.');
      console.error('Erro ao buscar projeto:', error);
      return;
    }
    
    clienteAtual = projeto;
    etapaAtual = projeto.etapa_atual || 1;
    
    // Personalizar saudação com nome do cliente
    if (projeto.nome_cliente) {
      const primeiroNome = projeto.nome_cliente.split(' ')[0];
      document.querySelector('.hub-saudacao').textContent = `Olá, ${primeiroNome}`;
    }
    
    // Renderizar timeline
    renderTimeline();
    
  } catch (err) {
    mostrarErro('Erro ao carregar dados.');
    console.error(err);
  }
}

function renderTimeline() {
  const timeline = document.createElement('div');
  timeline.className = 'timeline';
  
  ETAPAS.forEach((etapa, idx) => {
    const numEtapa = idx + 1;               // 1 a 5
    const liberada = numEtapa <= etapaAtual; // liberada se <= etapa atual
    const concluida = numEtapa < etapaAtual; // concluída se for anterior à atual
    const ativa = numEtapa === etapaAtual;   // ativa é a etapa atual

    const wrap = document.createElement('div');
    let classe = 'etapa-wrap';
    if (concluida) classe += ' concluida';
    else if (ativa) classe += ' ativa';
    else classe += ' bloqueada';
    wrap.className = classe;
    
    // Texto e ícone de status
    let statusTxt, statusIcon, statusClasse, btnTxt;
    if (concluida) {
      statusTxt = 'Concluído';
      statusIcon = '✓';
      statusClasse = 'concluida';
      btnTxt = 'Acessar →';
    } else if (ativa) {
      statusTxt = 'Disponível agora';
      statusIcon = '→';
      statusClasse = '';
      btnTxt = 'Acessar →';
    } else {
      statusTxt = 'Bloqueado';
      statusIcon = '🔒';
      statusClasse = 'bloqueada';
      btnTxt = 'Em breve';
    }
    
    wrap.innerHTML = `
      <div class="etapa-dot"></div>
      <div class="etapa-card ${liberada ? '' : 'bloqueada'}">
        <div class="etapa-num">Etapa ${etapa.num}</div>
        <div class="etapa-nome">${etapa.nome}</div>
        <div class="etapa-desc">${etapa.desc}</div>
        <div class="etapa-footer">
          <div class="etapa-status ${statusClasse}">
            <span class="status-icon">${statusIcon}</span>
            <span>${statusTxt}</span>
          </div>
          <button class="btn-acessar" onclick="acessarEtapa('${etapa.id}')" ${!liberada ? 'disabled' : ''}>
            ${btnTxt}
          </button>
        </div>
      </div>
    `;
    
    timeline.appendChild(wrap);
  });
  
  // Atualizar progresso (etapas concluídas = etapaAtual - 1, ou seja, as já passadas)
  const concluidas = Math.max(0, etapaAtual - 1);
  document.getElementById('hub-progresso').textContent = `${concluidas} de ${ETAPAS.length} etapas concluídas`;
  
  // Render
  document.getElementById('hub-content').innerHTML = '';
  document.getElementById('hub-content').appendChild(timeline);
}

function acessarEtapa(etapaId) {
  const idx = ETAPAS.findIndex(e => e.id === etapaId);
  const numEtapa = idx + 1;
  if (idx !== -1 && numEtapa <= etapaAtual) {
    window.location.href = ETAPAS[idx].url;
  }
}

async function fazerLogout() {
  const { error } = await sb.auth.signOut();
  if (error) {
    mostrarErro('Erro ao sair. Tente novamente.');
    return;
  }
  window.location.href = '/login';
}

function mostrarErro(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('vis');
  setTimeout(() => toast.classList.remove('vis'), 4000);
}

// Iniciar
inicializar();
</script>

</body>
</html>
