<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Projeto — Guide Arquitetura</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Sora:wght@400;500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black:#08080a;
  --dark:#111113;
  --card:#15151a;
  --card2:#1a1a20;
  --gold:#C9A227;
  --gold-light:#e2b93b;
  --gold-dim:rgba(201,162,39,0.08);
  --gold-mid:rgba(201,162,39,0.22);
  --white:#f5f4f0;
  --off:#e0ddd6;
  /* --muted subiu de #7a7870 → #969488 para dar legibilidade ao texto pequeno (item 4 da revisão) */
  --muted:#969488;
  --muted2:#4a4845;
  --border:rgba(201,162,39,0.14);
  --border2:rgba(255,255,255,0.06);
  --green:#50C878;
  --green-dim:rgba(80,200,120,0.09);
  --green-mid:rgba(80,200,120,0.30);
  --red:rgba(220,90,90,0.9);
  /* cor semântica de AÇÃO PENDENTE — distinta do dourado de marca/estado (item 9) */
  --alerta:#E8853A;
  --alerta-light:#f0a267;
  --alerta-dim:rgba(232,133,58,0.10);
  --alerta-border:rgba(232,133,58,0.34);
  --glass:rgba(255,255,255,0.055);
  --glass2:rgba(255,255,255,0.035);

  /* ── ESCALA TIPOGRÁFICA (item 3) — 8 valores viraram 6 degraus nomeados ── */
  --fs-2xs:10px;   /* eyebrows / labels uppercase */
  --fs-xs:11.5px;  /* legendas, meta, status */
  --fs-sm:12.5px;  /* corpo secundário */
  --fs-base:14px;  /* corpo */
  --fs-md:16px;    /* subtítulos */
  --fs-lg:19px;    /* títulos de card */
  --fs-xl:22px;    /* título do hero */
  --fs-2xl:26px;   /* título de modal */
  --fs-serif:16px; /* citações em serif */

  /* ── ESCALA DE RAIO (item 7) — 9 valores viraram 4 + pill ── */
  --r-sm:12px;   /* inputs, pills retangulares, thumbs */
  --r-md:16px;   /* sub-blocos, itens de lista */
  --r-lg:24px;   /* cards */
  --r-xl:28px;   /* modal, header */
  --r-pill:999px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--black);
  color: var(--off);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

.serif { font-family: 'Cormorant Garamond', serif; }
/* fonte única da verdade para todo título/heading (item 6) — antes esta regra estava morta */
h1,h2,h3,h4,
.card-titulo, .modal-titulo, .fase-nome, .quiz-pergunta, .sub-card-titulo,
.humor-historico-titulo, .conta-bloco-titulo, .convite-titulo, .marco-nome,
.flip-front, .dropdown-perfil-nome {
  font-family: 'Sora', sans-serif;
}

/* ── SISTEMA ÚNICO DE TAMANHO DE ÍCONE (item 10) ── tudo por CSS, nada inline no JS */
svg.lucide { display: inline-block; vertical-align: -3px; stroke-width: 1.8; width: 18px; height: 18px; }
/* especificidade svg.lucide.ic-* (0,2,1) para vencer a base svg.lucide (0,1,1) */
svg.lucide.ic-sm { width: 14px; height: 14px; }
svg.lucide.ic-md { width: 18px; height: 18px; }
svg.lucide.ic-lg { width: 22px; height: 22px; }
svg.lucide.ic-xl { width: 28px; height: 28px; }
.card-eyebrow svg.lucide, .modal-eyebrow svg.lucide, .card-cta svg.lucide,
.fase-prazo svg.lucide, .marco-obra-link svg.lucide, .conta-bloco-titulo svg.lucide,
.sub-card-titulo svg.lucide, .tab-btn svg.lucide, .convite-selo svg.lucide,
.toast svg.lucide, .dropdown-item svg.lucide, .mural-upload-btn svg.lucide { width: 14px; height: 14px; }

/* ───────────────────────────── FUNDO ───────────────────────────── */

.bg-gradient {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: url('/assets/bg-fluid.jpg') center/cover no-repeat;
  background-color: #0c0b09;
}
.bg-breath {
  position: fixed;
  inset: 0;
  z-index: 0;
  background: rgba(8,8,10,0.50);
}

.noise {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 200px;
}

/* ───────────────────────────── CURSOR CUSTOM ───────────────────────────── */

.cursor-dot, .cursor-ring {
  position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999;
  border-radius: 50%; transform: translate(-50%, -50%); will-change: transform;
}
.cursor-dot { width: 6px; height: 6px; background: var(--gold); }
.cursor-ring { width: 30px; height: 30px; border: 1px solid var(--gold-mid); transition: width .2s, height .2s, border-color .2s; }
.cursor-ring.on-interactive { width: 46px; height: 46px; border-color: var(--gold); }
@media (hover: none) { .cursor-dot, .cursor-ring { display: none; } }

/* ───────────────────────────── HEADER FLUTUANTE — 3 BOLHAS ───────────────────────────── */

.top-bar {
  position: fixed;
  top: 16px; left: 24px; right: 24px;
  display: flex; align-items: center;
  gap: 10px;
  z-index: 300;
}

.tb-bubble {
  background: rgba(255,255,255,0.055);
  backdrop-filter: blur(32px) saturate(160%);
  -webkit-backdrop-filter: blur(32px) saturate(160%);
  border-radius: var(--r-pill);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 12px 36px rgba(0,0,0,0.40);
  display: flex; align-items: center;
  min-height: 54px;
  transition: box-shadow .3s;
}

.tb-logo { padding: 0 20px; }
.tb-logo .logo-img { height: 34px; width: auto; display: block; }

.tb-nav {
  flex: 1;
  justify-content: space-between;
  gap: 4px;
  padding: 0 8px 0 22px;
}
.top-saudacao { font-family: 'Sora', sans-serif; font-size: var(--fs-md); font-weight: 600; color: var(--white); letter-spacing: 0.005em; margin: 0; white-space: nowrap; }
.top-saudacao .rev-word { display: inline-block; }
.tb-nav-icones { display: flex; align-items: center; gap: 4px; }

.tb-perfil { padding: 6px 8px 6px 18px; gap: 10px; }
.perfil-trigger {
  display: flex; align-items: center; gap: 10px;
  background: transparent; border: none; cursor: pointer; color: var(--off); font-family: 'Outfit', sans-serif;
}
.perfil-nome { font-size: var(--fs-sm); color: var(--off); white-space: nowrap; font-weight: 400; }
.perfil-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--gold-dim); border: 1.5px solid var(--gold-mid);
  display: flex; align-items: center; justify-content: center;
  color: var(--gold); overflow: hidden; flex-shrink: 0;
}
.perfil-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

.icon-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  width: 42px; height: 42px;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.icon-btn:hover { color: var(--gold-light); background: var(--gold-dim); border-color: var(--border); }

.dropdown-wrap { position: relative; }
.dropdown-panel {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  min-width: 240px;
  background: rgba(18,18,22,0.97);
  backdrop-filter: blur(20px);
  border: 1px solid var(--border2);
  border-radius: var(--r-md);
  padding: 8px;
  display: none;
  box-shadow: 0 18px 44px rgba(0,0,0,0.5);
}
.dropdown-panel.vis { display: block; }
.dropdown-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; text-align: left;
  background: transparent; border: none;
  color: var(--off); font-family: 'Outfit', sans-serif; font-size: var(--fs-sm);
  padding: 10px 12px; border-radius: var(--r-sm); cursor: pointer; transition: all .15s;
}
.dropdown-item:hover { background: var(--gold-dim); color: var(--gold-light); }
.dropdown-perfil-nome { font-family:'Sora',sans-serif; font-weight:600; font-size:var(--fs-base); color:var(--white); padding:8px 12px 2px; }
.dropdown-perfil-email { font-size:var(--fs-2xs); color:var(--muted); padding:0 12px 10px; }
.dropdown-sep { height:1px; background:var(--border2); margin:6px 4px; }
.dropdown-vazio { font-size: var(--fs-sm); color: var(--muted); padding: 12px; line-height: 1.6; }

/* ───────────────────────────── MAIN / GRID ───────────────────────────── */

.main { max-width: 1320px; margin: 0 auto; padding: 116px 24px 100px; position: relative; z-index: 2; }

.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: 224px 224px 210px 210px auto;
  gap: 18px;
}

.card {
  position: relative;
  background: var(--glass2);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid transparent;
  border-radius: var(--r-lg);
  padding: 22px;
  overflow: hidden;
  cursor: pointer;
  transition: background .25s, transform .25s, box-shadow .25s;
  display: flex;
  flex-direction: column;
}
.card:hover { background: rgba(255,255,255,0.07); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.25); }
.card::before {
  content: '';
  position: absolute; inset: -1px;
  background: radial-gradient(240px circle at var(--x, 50%) var(--y, 50%), rgba(201,162,39,0.13), transparent 70%);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
.card:hover::before { opacity: 1; }

/* hero se distingue dos satélites — brilho de base próprio, sem contorno */
.card-hero {
  grid-column: 1 / 3; grid-row: 1 / 3;
  background: linear-gradient(155deg, rgba(201,162,39,0.07), var(--glass2) 55%);
  box-shadow: 0 0 40px rgba(201,162,39,0.05) inset;
}
.card-hero:hover { box-shadow: 0 0 50px rgba(201,162,39,0.10) inset, 0 16px 48px rgba(0,0,0,0.30); }
/* campo de partículas douradas que fogem do mouse — fundo do card */
.card-hero .card-corpo { justify-content: flex-end; position: relative; }
.hero-particulas { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.card-hero .card-corpo > *:not(.hero-particulas) { position: relative; z-index: 1; }
.card-hero .hero-frase { line-height: 1.6; text-shadow: 0 1px 14px rgba(8,8,10,0.9); }
.card-hero .hero-frase .rev-word { display: inline-block; }
.hf-forte { font-family: 'Sora', sans-serif; font-weight: 600; font-size: var(--fs-md); color: var(--white); line-height: 1.45; }
.hf-sub { font-size: var(--fs-sm); color: var(--off); line-height: 1.6; margin-top: 10px; }

/* barras verticais de fase (capa "Meu Projeto") */
.evolucao-chart { display: flex; align-items: flex-end; gap: 8px; height: 64px; margin-bottom: 14px; }
.evolucao-barra-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.evolucao-barra { width: 60%; border-radius: 6px 6px 0 0; background: rgba(255,255,255,0.10); transition: height .8s cubic-bezier(.22,.9,.32,1); height: 0; }
.evolucao-barra.concluida { background: var(--green); }
.evolucao-barra.ativa { background: var(--gold); box-shadow: 0 0 10px rgba(201,162,39,.5); }
.evolucao-label { font-size: 8.5px; text-transform: uppercase; letter-spacing: .04em; color: rgba(245,244,240,0.55); text-shadow: 0 1px 6px rgba(8,8,10,0.8); }

/* anéis circulares de progresso (capa + modal "Sua Trajetória") */
.anel-duo { display: flex; gap: 24px; margin-bottom: 14px; }
/* usado só na capa (card fechado) para centralizar a dupla de anéis no card */
.anel-duo-centro { display: flex; justify-content: center; }
.anel-duo-centro .anel-duo { gap: 30px; margin-bottom: 0; }
.anel-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.anel-svg-wrap { position: relative; width: 60px; height: 60px; filter: drop-shadow(0 2px 10px rgba(0,0,0,0.5)); }
.anel-svg-wrap svg { position: absolute; inset: 0; }
.anel-svg-wrap svg circle:last-child { transition: stroke-dashoffset 1s cubic-bezier(.22,.9,.32,1); }
.anel-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-weight: 700; font-size: 12.5px; color: var(--white); }
/* rótulo menor e mais discreto — a leitura principal é o número dentro do anel */
.anel-label { font-size: 8.5px; color: rgba(245,244,240,0.6); text-transform: uppercase; letter-spacing: .04em; text-align: center; line-height: 1.3; max-width: 74px; text-shadow: 0 1px 6px rgba(8,8,10,0.8); }
.anel-item.anel-convite .anel-pct { color: var(--muted); }
.anel-item.anel-convite .anel-label { color: var(--muted2); }

.traj-frase { font-size: var(--fs-sm); color: var(--off); line-height: 1.6; }
.traj-frase .rev-word { display: inline-block; }

/* blocos do modal "Sua Trajetória" */
.traj-contadores { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
.traj-contador-item { background: var(--glass2); border-radius: var(--r-md); padding: 14px 16px; }
.tc-num { font-family: 'Sora', sans-serif; font-weight: 700; font-size: var(--fs-2xl); color: var(--gold-light); line-height: 1; margin-bottom: 6px; }
.tc-label { font-size: var(--fs-xs); color: var(--muted); line-height: 1.5; display: flex; align-items: flex-start; gap: 5px; }
.tc-label b { color: var(--off); font-weight: 500; }
.traj-bloco-titulo { font-family: 'Sora', sans-serif; font-weight: 600; font-size: var(--fs-sm); color: var(--white); text-transform: uppercase; letter-spacing: .04em; margin: 22px 0 12px; display: flex; align-items: center; gap: 7px; }
.traj-revisoes { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.traj-revisao-item { display: flex; align-items: center; justify-content: space-between; background: var(--glass2); border-radius: var(--r-sm); padding: 9px 14px; font-size: var(--fs-sm); color: var(--off); }
.traj-revisao-badge { font-size: var(--fs-2xs); color: var(--muted); background: rgba(255,255,255,0.05); border-radius: var(--r-pill); padding: 3px 10px; }
.traj-atalhos { display: flex; flex-direction: column; gap: 10px; }
.traj-atalho { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--glass2); border: none; border-radius: var(--r-md); padding: 13px 16px; cursor: pointer; color: var(--gold); transition: background .2s; font-family: 'Outfit', sans-serif; }
.traj-atalho:hover { background: rgba(255,255,255,0.06); }
.traj-atalho > div { flex: 1; }
.traj-atalho .ta-titulo { font-size: var(--fs-sm); color: var(--white); font-weight: 500; }
.traj-atalho .ta-sub { font-size: var(--fs-xs); color: var(--muted); margin-top: 2px; }
.traj-atalho > svg:last-child { color: var(--muted); flex-shrink: 0; }
.traj-previsao { font-size: var(--fs-base); color: var(--off); line-height: 1.7; }
.traj-previsao .rev-word { display: inline-block; }
.card-sonhou  { grid-column: 3 / 4; grid-row: 1 / 2; }
.card-ateaqui { grid-column: 3 / 4; grid-row: 2 / 3; }
/* Gui ocupa a antiga posição de "Rumo às chaves" (item 2x1, coluna 4) */
.card-gui     { grid-column: 4 / 5; grid-row: 1 / 3; }
.gui-capa { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 14px; text-align: center; min-height: 0; }
.gui-img { width: 118px; height: auto; display: block; filter: drop-shadow(0 12px 26px rgba(0,0,0,0.5)); }
.gui-titulo { font-family: 'Sora', sans-serif; font-weight: 600; font-size: var(--fs-md); color: var(--white); line-height: 1.4; }
.gui-titulo .rev-word { display: inline-block; }
.card-guiders   { grid-column: 1 / 2; grid-row: 3 / 4; }
.card-parceiros { grid-column: 2 / 3; grid-row: 3 / 4; }
.card-glossario { grid-column: 3 / 4; grid-row: 3 / 4; }
.card-diario    { grid-column: 4 / 5; grid-row: 3 / 4; }
/* "Rumo às chaves" deslocado para baixo, numa linha própria acima do mural */
.card-chaves  { grid-column: 1 / 3; grid-row: 4 / 5; }
.card-mural     { grid-column: 1 / 5; grid-row: 5 / 6; min-height: 200px; }

@media (max-width: 900px) {
  .bento { grid-template-columns: repeat(2, 1fr); grid-template-rows: none; }
  .card-hero    { grid-column: 1 / 3; grid-row: auto; }
  .card-sonhou  { grid-column: 1 / 2; grid-row: auto; }
  .card-ateaqui { grid-column: 2 / 3; grid-row: auto; }
  .card-gui     { grid-column: 1 / 2; grid-row: auto; }
  .card-guiders { grid-column: 2 / 3; grid-row: auto; }
  .card-parceiros { grid-column: 1 / 2; grid-row: auto; }
  .card-glossario { grid-column: 2 / 3; grid-row: auto; }
  .card-diario  { grid-column: 1 / 3; grid-row: auto; }
  .card-chaves  { grid-column: 1 / 3; grid-row: auto; }
  .card-mural   { grid-column: 1 / 3; grid-row: auto; }
  .card { min-height: 190px; }
  .top-bar { left: 12px; right: 12px; gap: 6px; }
  .tb-logo .logo-img { height: 26px; }
  .top-saudacao { display: none; }
  .perfil-nome { display: none; }
  .tb-bubble { min-height: 46px; }
  .tb-logo { padding: 0 14px; }
  .tb-nav { padding: 0 6px; }
  .tb-perfil { padding: 4px 6px; }
  .perfil-avatar { width: 32px; height: 32px; }
  .main { padding-top: 90px; }
}

.card-eyebrow { font-size: var(--fs-2xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; display:flex; align-items:center; gap:6px; }
.card-titulo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: var(--fs-lg); color: var(--white); margin-bottom: 8px; line-height: 1.25; }
.card-hero .card-titulo { font-size: var(--fs-xl); }
.card-corpo { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; min-height: 0; }
.card-convite { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; }
.card-convite .rev-word { display: inline-block; }
.card-cta {
  align-self: flex-start; margin-top: 10px;
  background: transparent; border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: 7px 14px; font-size: var(--fs-2xs); color: var(--gold);
  font-family: 'Outfit', sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer; transition: all .2s;
  display: inline-flex; align-items: center; gap: 6px;
}
.card-cta:hover { border-color: var(--gold); background: var(--gold-dim); }

@keyframes elastic { 0%{transform:scale(1)} 40%{transform:scale(.90)} 70%{transform:scale(1.05)} 100%{transform:scale(1)} }
.elastic-pop { animation: elastic .38s cubic-bezier(.36,.07,.19,.97); }


/* AÇÃO PENDENTE usa a cor de alerta (item 9), não o dourado de estado/marca */
.pendente-banner { margin-top: auto; display: flex; align-items: flex-start; gap: 8px; background: var(--alerta-dim); border: 1px solid var(--alerta-border); border-radius: var(--r-sm); padding: 10px 12px; font-size: var(--fs-xs); color: var(--alerta-light); line-height: 1.5; }
.pendente-banner svg { color: var(--alerta); flex-shrink: 0; margin-top: 1px; }
.pendente-banner.pulsar { animation: pulsar 2.2s ease-in-out infinite; }
@keyframes pulsar { 0%,100%{box-shadow:0 0 0 0 rgba(232,133,58,.34);} 50%{box-shadow:0 0 0 9px rgba(232,133,58,0);} }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: var(--fs-2xs); padding: 4px 10px; border-radius: var(--r-pill); background: var(--gold-dim); border: 1px solid var(--border); color: var(--off); display:inline-flex; align-items:center; gap:5px; }

.mini-timeline { display: flex; flex-direction: column; gap: 7px; }
.mini-timeline-item { display: flex; align-items: baseline; gap: 8px; font-size: var(--fs-xs); color: var(--muted); }
.mini-timeline-item .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }

/* ───────────────────────────── MODAL EXPANDIDO ───────────────────────────── */

.modal-overlay { position: fixed; inset: 0; background: rgba(8,8,10,0.35); backdrop-filter: blur(6px); z-index: 900; opacity: 0; pointer-events: none; transition: opacity .35s; }
.modal-overlay.vis { opacity: 1; pointer-events: auto; }

.modal-window {
  position: fixed; z-index: 901;
  /* mesma identidade dos cards fechados — vidro translúcido sobre o fundo fluido, sem trocar de "mundo" ao abrir */
  background: var(--glass2);
  backdrop-filter: blur(18px) saturate(140%);
  -webkit-backdrop-filter: blur(18px) saturate(140%);
  border: 1px solid transparent;
  box-shadow: 0 30px 80px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  overflow: hidden;
  transition: top .48s cubic-bezier(.22,.9,.32,1), left .48s cubic-bezier(.22,.9,.32,1),
              width .48s cubic-bezier(.22,.9,.32,1), height .48s cubic-bezier(.22,.9,.32,1),
              border-radius .48s cubic-bezier(.22,.9,.32,1);
}
.modal-inner { position: absolute; inset: 0; overflow-y: auto; padding: 34px 30px 40px 34px; opacity: 0; transition: opacity .3s .18s; scrollbar-width: thin; scrollbar-color: rgba(201,162,39,0.32) transparent; }
/* barra de rolagem glassmorfismo (item 4) — fina, translúcida, dourada, longe dos cantos arredondados */
.modal-inner::-webkit-scrollbar { width: 11px; }
.modal-inner::-webkit-scrollbar-track { background: transparent; margin: 16px 0; }
.modal-inner::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, rgba(226,185,59,0.42), rgba(201,162,39,0.28));
  border: 3px solid transparent; background-clip: padding-box; border-radius: var(--r-pill);
  box-shadow: inset 0 0 6px rgba(255,255,255,0.15);
}
.modal-inner::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(226,185,59,0.6), rgba(201,162,39,0.45)); background-clip: padding-box; }
.modal-inner.vis { opacity: 1; }
.modal-close {
  position: sticky; top: 0; float: right; z-index: 20;
  background: rgba(20,20,24,0.9); border: 1px solid var(--border2); color: var(--muted);
  width: 34px; height: 34px; border-radius: 50%; cursor: pointer; margin-left: 12px;
  transition: all .2s; display:flex; align-items:center; justify-content:center;
}
.modal-close:hover { color: var(--gold); border-color: var(--gold); }
.modal-eyebrow { font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; display:flex; align-items:center; gap:6px; }
.modal-titulo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: var(--fs-2xl); color: var(--white); margin-bottom: 20px; max-width: 80%; }

/* "Meu Projeto" expandido — UMA cápsula única (Abertura): a primeira frase fica sempre
   visível no cabeçalho/botão; o corpo revela o restante do texto com continuidade e, dentro
   dele, o botão "Instrução" com o detalhamento — tudo recolhe junto quando a cápsula fecha. */
.mp-capsula { background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 20px; }
.mp-capsula-toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  background: transparent; border: none; cursor: pointer; padding: 15px 18px;
  font-family: 'Outfit', sans-serif; color: var(--white); text-align: left; transition: background .2s;
}
.mp-capsula-toggle:hover { background: rgba(255,255,255,0.03); }
.mp-capsula-frase { font-size: var(--fs-sm); font-weight: 500; line-height: 1.5; }
.mp-capsula-toggle svg { color: var(--gold); flex-shrink: 0; transition: transform .3s; }
.mp-capsula-toggle.aberto svg { transform: rotate(180deg); }

.mp-capsula-corpo { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .45s cubic-bezier(.22,.9,.32,1), opacity .35s; }
.mp-capsula-corpo.aberto { max-height: 3200px; opacity: 1; }
.mp-capsula-corpo-inner { padding: 0 18px 18px; }
.mp-capsula-corpo-inner p { font-size: var(--fs-sm); color: var(--off); line-height: 1.7; margin-bottom: 14px; }

.mp-instr-btn {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  background: var(--card2); border: 1px solid var(--border2); border-radius: var(--r-sm);
  padding: 11px 15px; cursor: pointer; font-family: 'Outfit', sans-serif;
  color: var(--gold-light); font-size: var(--fs-sm); font-weight: 500; transition: all .2s; margin-top: 4px;
}
.mp-instr-btn:hover { border-color: var(--gold-mid); background: rgba(255,255,255,0.05); }
.mp-instr-btn-txt { display: flex; align-items: center; gap: 8px; }
.mp-instr-btn svg { color: var(--gold); transition: transform .3s; flex-shrink: 0; }
.mp-instr-btn.aberto svg { transform: rotate(180deg); }

.mp-instr-body { max-height: 0; overflow: hidden; opacity: 0; transition: max-height .45s cubic-bezier(.22,.9,.32,1), opacity .35s; }
.mp-instr-body.aberto { max-height: 2600px; opacity: 1; }
.mp-instr-body-inner { padding-top: 16px; }

.mp-instr-lista { display: flex; flex-direction: column; gap: 16px; margin-bottom: 18px; }
.mp-instr-fase { display: flex; gap: 14px; }
.mp-instr-fase-icone { width: 38px; height: 38px; border-radius: var(--r-sm); background: var(--gold-dim); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--gold); flex-shrink: 0; }
.mp-instr-fase-nome { font-family: 'Sora', sans-serif; font-weight: 600; font-size: var(--fs-base); color: var(--white); margin-bottom: 5px; }
.mp-instr-fase-texto { font-size: var(--fs-sm); color: var(--off); line-height: 1.65; }
.mp-instr-fechamento { font-size: var(--fs-sm); color: var(--muted); line-height: 1.7; padding-top: 16px; border-top: 1px solid var(--border2); }

/* fases (Meu Projeto expandido) — CARTÕES QUE EMPILHAM ao rolar (sticky + fundo opaco).
   Hierarquia de destaque: futura (neutra) < concluída (verde) < atual (dourado — a mais
   forte, "fundo amarelinho"), todas seguindo o mesmo padrão de vidro tingido usado no
   resto do painel (rgba da cor sobre --glass2), em vez de cores soltas fora do padrão. */
.fases-pilha { position: relative; }
.fase-item {
  position: sticky; top: 14px;
  display: flex; gap: 16px;
  border: 1px solid var(--border2); border-radius: var(--r-md); padding: 18px; margin-bottom: 16px;
  background: linear-gradient(155deg, var(--card2), var(--dark));
  box-shadow: 0 -10px 30px rgba(0,0,0,.45);
  will-change: transform, filter;
}
.fase-item.atual {
  border-color: var(--gold);
  background: linear-gradient(155deg, rgba(201,162,39,0.16), var(--glass2) 60%);
  box-shadow: 0 -10px 30px rgba(0,0,0,.45), 0 0 26px rgba(201,162,39,0.10);
}
.fase-item.concluida {
  border-color: var(--green-mid);
  background: linear-gradient(155deg, rgba(80,200,120,0.11), var(--glass2) 60%);
}
.fase-icone { width: 40px; height: 40px; border-radius: var(--r-sm); background: var(--card2); display:flex; align-items:center; justify-content:center; flex-shrink:0; color: var(--gold); }
.fase-item.atual .fase-icone { background: var(--gold-dim); }
.fase-item.concluida .fase-icone { background: var(--green-dim); color: var(--green); }
.fase-corpo { flex: 1; min-width: 0; }
.fase-nome-linha { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.fase-nome { font-family:'Sora',sans-serif; font-weight:600; font-size:var(--fs-md); color:var(--white); }
.fase-status-tag { font-size: var(--fs-2xs); text-transform:uppercase; letter-spacing:.06em; padding:3px 9px; border-radius:var(--r-pill); color:var(--muted); border:1px solid var(--border2); }
.fase-item.atual .fase-status-tag { color: var(--gold-light); border-color: var(--gold-mid); background: var(--gold-dim); }
.fase-item.concluida .fase-status-tag { color: var(--green); border-color: var(--green-mid); background: var(--green-dim); }
/* hierarquia (item 1): explicação da etapa é a mais destacada */
.fase-explicacao { font-size: var(--fs-base); color: var(--off); line-height: 1.65; margin: 10px 0; }
.fase-acolhimento { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; margin: 8px 0; }
.fase-prazo { display:flex; align-items:center; gap: 6px; font-size: var(--fs-xs); color: var(--muted); margin-top: 8px; }
.fase-prazo svg { color: var(--gold); }
/* prazo ainda indefinido — menos destaque */
.fase-prazo.preparando { color: var(--muted2); font-style: italic; font-size: var(--fs-2xs); }
.fase-prazo.preparando svg { color: var(--muted2); }
.fase-btn { margin-top: 12px; }

.video-wrap { margin: 20px 0; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border2); aspect-ratio: 16/9; }
.video-wrap iframe { width: 100%; height: 100%; border: 0; }

/* sub-cards do briefing */
.sub-cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 14px; margin-top: 6px; }
.sub-card { background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-md); padding: 16px; }
.sub-card-titulo { font-family:'Sora',sans-serif; font-weight:600; font-size: var(--fs-sm); color: var(--gold-light); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; display:flex; align-items:center; gap:6px; }
.paleta-swatch-row { display: flex; border-radius: var(--r-sm); overflow: hidden; height: 30px; margin-bottom: 6px; }
.paleta-swatch-row div { flex: 1; }
.paleta-nome-mini { font-size: var(--fs-xs); color: var(--off); margin-bottom: 10px; }
.foto-mural-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px,1fr)); gap: 8px; }
.foto-mural-grid img { width: 100%; height: 90px; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--border2); }
.foto-mural-legenda { font-size: var(--fs-2xs); color: var(--muted); margin-top: 8px; }

/* até aqui — gráfico */
/* tipografia dourada "clean" (sem serifa/itálico) usada nas frases dentro do card Sua Trajetória */
.timeline-item-frase { color: var(--gold-light); margin: 2px 0 12px 13px; font-family:'Outfit', sans-serif; font-weight: 400; font-style: normal; font-size: var(--fs-sm); }
.timeline-rodape { margin-top: 22px; font-family:'Outfit',sans-serif; font-weight: 500; font-style: normal; font-size: var(--fs-base); color: var(--gold-light); line-height: 1.6; }

/* rumo às chaves */
.chaves-intro { font-size: var(--fs-sm); color: var(--off); line-height: 1.7; margin-bottom: 22px; }
.marco-item { border-bottom: 1px solid var(--border2); padding: 18px 0; }
.marco-item:last-child { border-bottom: none; }
.marco-topo { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
/* toggle on/off vertical, cápsula em liquid glass — maior e mais "fun" (a sensação deve ser
   a de concluir um passo grande): reflexo de luz correndo pela borda, bolha com brilho e
   sombra internos, sobe com um leve estouro elástico ao marcar concluído. Clicar alterna o
   estado (grava a data de hoje / limpa) com squish no clique; inclina sutilmente em 3D
   seguindo o mouse (ver ativarTiltToggles). */
.marco-toggle {
  width: 28px; height: 52px; border-radius: var(--r-pill); flex-shrink: 0; padding: 4px;
  display: flex; align-items: flex-end; justify-content: center;
  background: linear-gradient(160deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02) 40%, rgba(0,0,0,0.16) 100%);
  backdrop-filter: blur(8px) saturate(160%); -webkit-backdrop-filter: blur(8px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.16);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.25), inset 0 -6px 10px rgba(0,0,0,0.25), 0 3px 8px rgba(0,0,0,0.3);
  cursor: pointer; position: relative; overflow: hidden;
  transition: transform .18s ease-out, background .35s, border-color .35s, box-shadow .35s;
  transform-style: preserve-3d; will-change: transform;
}
/* aro de luz correndo pela borda — reforça o reflexo do "vidro líquido" nas extremidades */
.marco-toggle::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(200deg, rgba(255,255,255,0.4) 0%, transparent 20%, transparent 80%, rgba(255,255,255,0.12) 100%);
}
.marco-toggle:hover { border-color: rgba(255,255,255,0.3); }
.marco-toggle.ativo {
  background: linear-gradient(160deg, rgba(226,185,59,0.34), rgba(201,162,39,0.08) 45%, rgba(0,0,0,0.18) 100%);
  border-color: rgba(226,185,59,0.42);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.3), inset 0 -6px 10px rgba(0,0,0,0.2), 0 3px 10px rgba(0,0,0,0.3), 0 0 18px rgba(201,162,39,0.28);
}
.marco-toggle-bolha {
  width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle at 30% 24%, rgba(255,255,255,0.98), rgba(245,244,240,0.6) 42%, rgba(190,190,190,0.28) 100%);
  box-shadow: 0 3px 8px rgba(0,0,0,0.4), inset 0 1px 3px rgba(255,255,255,0.9), inset 0 -3px 5px rgba(120,120,120,0.25);
  transition: transform .4s cubic-bezier(.34,1.56,.64,1), background .35s, box-shadow .35s;
}
.marco-toggle.ativo .marco-toggle-bolha {
  transform: translateY(-24px);
  background: radial-gradient(circle at 30% 24%, #fffaf0, var(--gold-light) 42%, var(--gold) 100%);
  box-shadow: 0 3px 12px rgba(201,162,39,0.6), inset 0 1px 3px rgba(255,255,255,0.95), inset 0 -3px 5px rgba(150,110,10,0.3);
}
.marco-toggle:active .marco-toggle-bolha { transform: scale(0.8); }
.marco-toggle.ativo:active .marco-toggle-bolha { transform: translateY(-24px) scale(0.8); }
@media (prefers-reduced-motion: reduce) { .marco-toggle, .marco-toggle-bolha { transition: background .3s, box-shadow .3s; } }
/* mesmo toggle na CAPA de "Rumo às chaves" — mostra de relance se todos os marcos
   visíveis já foram concluídos (só liga quando todos estão feitos) */
.chaves-capa-toggle-wrap { position: absolute; top: 18px; right: 18px; z-index: 1; }
/* na capa o toggle é um ícone do card (não um controle miúdo) — maior e com mais
   definição: borda mais presente, vidro menos diluído, aro de luz mais nítido */
.chaves-capa-toggle {
  transform-origin: center;
  width: 36px; height: 68px; padding: 5px;
  background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03) 40%, rgba(0,0,0,0.22) 100%);
  border: 1.5px solid rgba(255,255,255,0.22);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.32), inset 0 -8px 14px rgba(0,0,0,0.3), 0 6px 16px rgba(0,0,0,0.4);
}
.chaves-capa-toggle::before { background: linear-gradient(200deg, rgba(255,255,255,0.5) 0%, transparent 22%, transparent 78%, rgba(255,255,255,0.16) 100%); }
.chaves-capa-toggle.ativo {
  background: linear-gradient(160deg, rgba(226,185,59,0.4), rgba(201,162,39,0.1) 45%, rgba(0,0,0,0.22) 100%);
  border-color: rgba(226,185,59,0.5);
  box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), inset 0 -8px 14px rgba(0,0,0,0.25), 0 6px 16px rgba(0,0,0,0.4), 0 0 22px rgba(201,162,39,0.32);
}
.chaves-capa-toggle .marco-toggle-bolha { width: 26px; height: 26px; }
.chaves-capa-toggle.ativo .marco-toggle-bolha { transform: translateY(-32px); }
.chaves-capa-toggle.ativo:active .marco-toggle-bolha { transform: translateY(-32px) scale(0.8); }
.marco-nome { font-family:'Sora',sans-serif; font-weight: 600; font-size: var(--fs-base); color: var(--off); flex: 1; }
.marco-item.feito .marco-nome { color: var(--white); }
.marco-explicacao { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; margin: 6px 0 6px 38px; }
/* frase de conforto — dourado, sem serifa/itálico (mesma tipografia de .farol) */
.marco-conforto { color: var(--gold-light); font-family: 'Outfit', sans-serif; font-style: normal; font-weight: 400; font-size: var(--fs-base); margin: 0 0 10px 38px; line-height: 1.65; }
.marco-data-wrap { display: flex; align-items: center; gap: 10px; margin-left: 38px; }
.marco-data-wrap input[type=date] {
  background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-sm);
  padding: 8px 10px; color: var(--white); font-family: 'Outfit', sans-serif; font-size: var(--fs-sm);
}

/* "+" ao lado do nome — expande a instrução detalhada de cada marco (exceto Início da reforma) */
.marco-mais { background: transparent; border: 1px solid var(--border2); border-radius: 50%; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--gold); cursor: pointer; flex-shrink: 0; transition: all .2s; }
.marco-mais:hover { border-color: var(--gold-mid); background: var(--gold-dim); }
.marco-mais svg { transition: transform .3s; }
.marco-mais.aberto svg { transform: rotate(45deg); }
.marco-detalhe-body { max-height: 0; overflow: hidden; opacity: 0; margin-left: 38px; transition: max-height .4s cubic-bezier(.22,.9,.32,1), opacity .3s; }
.marco-detalhe-body.aberto { max-height: 1200px; opacity: 1; }
.marco-detalhe-inner { padding-top: 4px; }
.marco-detalhe-inner p { font-size: var(--fs-sm); color: var(--off); line-height: 1.7; margin-bottom: 12px; }
.marco-detalhe-inner p:last-child { margin-bottom: 0; }

/* CTA de destaque para o Acompanhamento de Obra (marco "Início da reforma") */
.marco-obra-cta { margin: 14px 0 0 38px; padding: 16px; border-radius: var(--r-md); background: var(--gold-dim); border: 1px solid var(--border); }
.marco-obra-intro { font-size: var(--fs-sm); color: var(--off); line-height: 1.6; margin-bottom: 12px; }
.marco-obra-btn { width: 100%; justify-content: center; animation: pulsarOuro 2.4s ease-in-out infinite; }
@keyframes pulsarOuro { 0%, 100% { box-shadow: 0 0 0 0 rgba(201,162,39,.38); } 50% { box-shadow: 0 0 0 9px rgba(201,162,39,0); } }
@media (prefers-reduced-motion: reduce) { .marco-obra-btn { animation: none; } }

/* marcos personalizados — mesmo padrão visual, campos editáveis pelo cliente */
.marco-custom-titulo { flex: 1; background: transparent; border: none; border-bottom: 1px dashed var(--border2); font-family: 'Sora', sans-serif; font-weight: 600; font-size: var(--fs-base); color: var(--off); padding: 2px 0; }
.marco-custom-titulo:focus { outline: none; border-color: var(--gold-mid); color: var(--white); }
.marco-custom-titulo::placeholder { color: var(--muted); font-weight: 400; }
.marco-custom-del { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: var(--r-sm); flex-shrink: 0; transition: color .2s; }
.marco-custom-del:hover { color: var(--red); }
.marco-custom-desc { display: block; width: calc(100% - 38px); margin: 6px 0 10px 38px; background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-sm); padding: 10px 12px; color: var(--off); font-family: 'Outfit', sans-serif; font-size: var(--fs-sm); line-height: 1.5; resize: vertical; min-height: 52px; }
.marco-custom-desc::placeholder { color: var(--muted); }
.marco-add-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--glass2); border: 1px dashed var(--border2); border-radius: var(--r-pill); padding: 12px; margin-top: 16px; color: var(--gold); font-family: 'Outfit', sans-serif; font-size: var(--fs-sm); font-weight: 500; cursor: pointer; transition: all .2s; }
.marco-add-btn:hover { border-color: var(--gold-mid); background: var(--gold-dim); border-style: solid; }

/* glossário + quiz */
.tab-switch { display: flex; gap: 8px; margin-bottom: 20px; }
.tab-btn { background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-sm); padding: 8px 16px; font-size: var(--fs-xs); color: var(--muted); cursor: pointer; text-transform: uppercase; letter-spacing: .05em; font-family:'Outfit',sans-serif; }
.tab-btn.ativa { color: var(--gold-light); border-color: var(--gold-mid); background: var(--gold-dim); }
.glossario-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 14px; }
.flip-card { perspective: 1200px; height: 130px; cursor: pointer; }
.flip-inner { position: relative; width: 100%; height: 100%; transition: transform .55s; transform-style: preserve-3d; }
.flip-card.flipped .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--r-md); border: 1px solid var(--border2); padding: 16px; display: flex; align-items: center; justify-content: center; text-align: center; }
.flip-front { background: var(--glass2); font-family: 'Sora', sans-serif; font-weight: 600; color: var(--gold-light); font-size: var(--fs-md); }
.flip-back { background: rgba(201,162,39,0.08); transform: rotateY(180deg); font-size: var(--fs-xs); color: var(--off); line-height: 1.55; }

.quiz-card { background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-md); padding: 24px; }
.quiz-pergunta { font-family:'Sora',sans-serif; font-weight:600; font-size:var(--fs-md); color:var(--white); margin-bottom: 18px; }
.quiz-opcao { display:block; width:100%; text-align:left; background:var(--card2); border:1px solid var(--border2); border-radius:var(--r-sm); padding:12px 14px; margin-bottom:10px; color:var(--off); font-family:'Outfit',sans-serif; font-size:var(--fs-base); cursor:pointer; transition: all .2s; }
.quiz-opcao:hover { border-color: var(--gold-mid); }
.quiz-opcao.correta { border-color: var(--green); background: var(--green-dim); color: var(--white); }
.quiz-opcao.errada { border-color: var(--red); background: rgba(220,90,90,0.08); color: var(--white); }
.quiz-feedback { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; margin-top: 12px; }
.quiz-progresso { font-size: var(--fs-xs); color: var(--muted); margin-bottom: 14px; text-transform: uppercase; letter-spacing: .05em; }

/* diário */
.humor-explicacao { font-size: var(--fs-sm); color: var(--muted); line-height: 1.7; margin-bottom: 10px; }
.humor-emocional { font-family:'Cormorant Garamond',serif; font-style: italic; font-size: var(--fs-serif); color: var(--gold-light); line-height: 1.65; margin-bottom: 22px; }
.humor-opcoes { display: flex; gap: 10px; margin: 6px 0 26px; }
.humor-btn { flex: 1; background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-md); padding: 16px 6px; text-align: center; cursor: pointer; transition: all .2s; color: var(--muted); display:flex; flex-direction:column; align-items:center; gap:6px; }
.humor-btn:hover, .humor-btn.sel { border-color: var(--gold); background: var(--gold-dim); color: var(--gold-light); }
.humor-btn span { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .04em; }
.humor-historico-titulo { font-family:'Sora',sans-serif; font-weight:600; font-size: var(--fs-base); color: var(--white); margin-bottom: 12px; }
.humor-hist-item { display: flex; align-items: center; gap: 10px; font-size: var(--fs-sm); color: var(--off); padding: 9px 0; border-bottom: 1px solid var(--border2); }
.humor-hist-item .hi-data { margin-left: auto; color: var(--muted); font-size: var(--fs-2xs); }

.farol { font-family: 'Outfit', sans-serif; font-style: normal; font-weight: 400; font-size: var(--fs-base); color: var(--gold-light); line-height: 1.65; margin-bottom: 20px; }

.form-input, .input-generico { width: 100%; background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-sm); padding: 11px 14px; color: var(--white); font-family: 'Outfit', sans-serif; font-size: var(--fs-base); margin-bottom: 10px; }

/* comunidade / parceiros — convite caprichado */
.convite-hero { text-align: center; padding: 30px 10px 10px; }
.convite-icone { width: 64px; height: 64px; border-radius: 50%; background: var(--gold-dim); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--gold); }
.convite-titulo { font-family:'Sora',sans-serif; font-weight: 700; font-size: var(--fs-lg); color: var(--white); margin-bottom: 14px; }
.convite-texto { font-size: var(--fs-base); color: var(--muted); line-height: 1.7; max-width: 420px; margin: 0 auto 18px; }
.convite-selo { display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-2xs); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); border:1px solid var(--border2); border-radius: var(--r-pill); padding: 5px 12px; }

/* mural */
.mural-form { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; }
.mural-form .input-generico { margin-bottom: 0; flex: 1; min-width: 180px; }
.mural-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px,1fr)); gap: 14px; }
.mural-item { border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border2); background: var(--glass2); }
.mural-item img { width: 100%; height: 130px; object-fit: cover; display: block; }
.mural-item-corpo { padding: 10px 12px; }
.mural-item-legenda { font-size: var(--fs-xs); color: var(--off); line-height: 1.4; }
.mural-item-data { font-size: var(--fs-2xs); color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .04em; }
.mural-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.mural-strip img { width: 90px; height: 70px; object-fit: cover; border-radius: var(--r-sm); border: 1px solid var(--border2); flex-shrink: 0; }
/* botão PRIMÁRIO (preenchido) — reservado à ação principal de cada tela; o .card-cta ghost é o secundário. Dois níveis, deliberado (item 8) */
.btn-primario, .mural-upload-btn { display:inline-flex; align-items:center; gap:8px; background: var(--gold); color: var(--black); border:none; border-radius: var(--r-sm); padding: 11px 18px; font-size: var(--fs-sm); font-weight: 600; cursor: pointer; font-family:'Outfit',sans-serif; transition: transform .2s, box-shadow .2s; }
.btn-primario:hover, .mural-upload-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(201,162,39,0.22); }

.conta-bloco { margin-bottom: 22px; }
.conta-bloco-titulo { font-family: 'Sora', sans-serif; font-weight: 600; font-size: var(--fs-base); color: var(--white); margin-bottom: 8px; display:flex; align-items:center; gap:8px; }
.conta-bloco-corpo { font-size: var(--fs-base); color: var(--muted); line-height: 1.7; }
.conta-bloco-corpo a { color: var(--gold-light); }

.loading-inline { text-align: center; padding: 30px; color: var(--muted); font-size: var(--fs-sm); }
.spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ═══════════════ "O QUE VOCÊ SONHOU" ═══════════════ */

/* — Capa: esteira infinita (marquee) — */
.fx-marquee { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.fx-marquee .trilho { display: flex; gap: 14px; width: max-content; animation: marquee 22s linear infinite; }
.fx-marquee:hover .trilho { animation-play-state: paused; }
@keyframes marquee { to { transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { .fx-marquee .trilho { animation: none; } }

.sonhou-capa-wrap { position: relative; margin-top: auto; }
.sonhou-marquee { border-radius: var(--r-md); }
.sonhou-marquee .sonhou-slide { flex: 0 0 auto; width: 118px; height: 92px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border2); }
.sonhou-marquee.grande { margin: 6px 0 20px; }
.sonhou-marquee.grande .sonhou-slide { width: 160px; height: 120px; }
.sonhou-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sonhou-capa-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(8,8,10,0.25), rgba(8,8,10,0.55)); border-radius: var(--r-md); }
.sonhou-capa-cta { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--gold-light); background: rgba(8,8,10,0.7); border: 1px solid var(--gold-mid); border-radius: var(--r-pill); padding: 7px 14px; text-shadow: 0 1px 6px rgba(0,0,0,0.7); }

/* mockups "ainda não preenchido" — MESMO FORMATO do conteúdo real (slide, selo, bloco de
   cor, item de textura, peça de moodboard), só que em vidro: glassmorfismo + a paleta de
   cor da própria página, com um sheen dourado sutil passando por cima. Usados nas seções
   que dependem do briefing (imagens/estilo/paleta/texturas/moodboard) enquanto ele não
   foi concluído — nunca a tela toda de uma vez, só a peça que falta. */
.skel { background: var(--glass2); backdrop-filter: blur(10px) saturate(140%); -webkit-backdrop-filter: blur(10px) saturate(140%); border: 1px solid var(--border2); position: relative; overflow: hidden; }
.skel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, var(--skel-sheen, rgba(226,185,59,0.16)) 50%, transparent 65%); background-size: 220% 100%; animation: skelSheen 2.8s ease-in-out infinite; }
@keyframes skelSheen { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel::after { animation: none; } }
.skel-icone-wrap { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: rgba(245,244,240,0.22); }
.skel-linha { position: relative; height: 9px; border-radius: var(--r-pill); overflow: hidden; background: var(--glass2); border: 1px solid var(--border2); }
.skel-linha::after { content: ''; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 35%, rgba(226,185,59,0.16) 50%, transparent 65%); background-size: 220% 100%; animation: skelSheen 2.8s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .skel-linha::after { animation: none; } }
.skel-linha-sm { width: 64px; }
.skel-linha-lg { width: 130px; margin-top: 7px; }
/* peças de moodboard flutuam sobre um fundo claro — vidro branco em vez de dourado */
.mb-peca.skel { background: rgba(255,255,255,0.12); backdrop-filter: blur(8px) saturate(140%); -webkit-backdrop-filter: blur(8px) saturate(140%); border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 10px 22px rgba(0,0,0,0.22); padding: 0; --skel-sheen: rgba(255,255,255,0.4); }
/* ajustes de tamanho/cor por contexto — o resto da forma vem da classe real (slide/selo/bloco) */
.ref-slide.skel { height: 140px; }
.textura-item.skel { height: 84px; }
.estilo-selo.skel { background: var(--glass2); border-color: var(--border2); }
.estilo-selo.skel .estilo-selo-icone { background: var(--glass2); border-color: var(--border2); color: rgba(245,244,240,0.3); }
.promessa-nota { font-size: var(--fs-xs); color: var(--muted); margin-top: 14px; display: flex; align-items: center; gap: 6px; }
.promessa-nota svg { color: var(--gold); flex-shrink: 0; }

/* — 1.1 imagens de referência: carrossel manual —
   passa o mouse sobre o carrossel e rola: a rolagem do mouse vira rolagem LATERAL das imagens,
   sem descer a página; tirando o mouse de cima, a rolagem vertical do modal volta ao normal. */
.ref-carrossel { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; }
.ref-viewport { flex: 1; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x proximity; scrollbar-width: none; border-radius: var(--r-md); }
.ref-viewport::-webkit-scrollbar { display: none; }
.ref-track { display: flex; gap: 12px; }
.ref-slide { flex: 0 0 auto; width: 190px; scroll-snap-align: start; border-radius: var(--r-md); overflow: hidden; border: 1px solid var(--border2); }
.ref-slide img { width: 100%; height: 140px; object-fit: cover; display: block; }
.ref-nav { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; background: var(--glass); border: 1px solid var(--border2); color: var(--gold); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .2s; }
.ref-nav:hover { background: var(--gold-dim); border-color: var(--gold-mid); }
.ref-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 18px; }
.ref-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted2); cursor: pointer; transition: all .2s; }
.ref-dot.ativo { background: var(--gold); transform: scale(1.3); }

/* — 1.2 estilo arquitetônico (seção nobre) — */
.estilo-selos { display: flex; flex-wrap: wrap; gap: 12px; margin: 6px 0 20px; }
.estilo-selo { display: flex; align-items: center; gap: 14px; padding: 14px 20px 14px 14px; border-radius: var(--r-md); background: linear-gradient(135deg, rgba(201,162,39,0.14), var(--glass2) 70%); border: 1px solid var(--gold-mid); box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
.estilo-selo-icone { width: 42px; height: 42px; border-radius: 50%; background: var(--gold-dim); border: 1px solid var(--gold-mid); display: flex; align-items: center; justify-content: center; color: var(--gold); flex-shrink: 0; }
.estilo-selo-rot { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .1em; color: var(--gold); }
.estilo-selo-nome { font-family: 'Sora', sans-serif; font-weight: 700; font-size: var(--fs-lg); color: var(--white); line-height: 1.1; margin-top: 2px; }

/* — 1.3 paleta poética (só cores) — */
.paleta-poetica { display: flex; flex-wrap: wrap; gap: 16px; margin: 6px 0 20px; }
.pp-grupo { flex: 1; min-width: 200px; }
.pp-linha { display: flex; gap: 4px; height: 46px; border-radius: var(--r-sm); overflow: hidden; }
.pp-bloco { border-radius: 4px; }
.pp-nome { font-family: 'Outfit', sans-serif; font-weight: 500; font-size: var(--fs-sm); color: var(--gold-light); margin-top: 8px; }

/* — 1.4 texturas (preenchimento por material, distinto da paleta) — */
.textura-legenda { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; margin: 2px 0 12px; }
.textura-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.textura-item { width: 84px; border-radius: var(--r-sm); overflow: hidden; border: 1px solid var(--border2); flex: 0 0 auto; }
.textura-item img { width: 100%; height: 84px; object-fit: cover; display: block; }
.textura-mat { display: flex; flex-direction: column; }
.textura-fill { height: 62px; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06); }
.textura-nome { font-size: var(--fs-2xs); color: var(--off); text-align: center; padding: 6px 4px; background: var(--glass2); }

/* — 2 planta baixa (demonstração) — */
.planta-demo { border-radius: var(--r-md); margin-bottom: 22px; overflow: hidden; }
.planta-demo.vazio { border: 1.5px dashed var(--gold-mid); background: repeating-linear-gradient(135deg, rgba(201,162,39,0.03) 0 10px, transparent 10px 20px), var(--glass2); padding: 30px 24px; text-align: center; }
.planta-icone { width: 56px; height: 56px; border-radius: 50%; background: var(--gold-dim); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; color: var(--gold); }
.planta-texto { font-size: var(--fs-sm); color: var(--muted); line-height: 1.65; max-width: 420px; margin: 0 auto; }
.planta-demo.tem-imagem img { width: 100%; display: block; }

/* — 3.2 moodboard — flat-lay editorial: fundo neutro liso, amostras retangulares com
   passe-partout claro, rotação mínima, cluster compacto (referência: fotografia de moodboard
   de material por cima de mesa/parede neutra). Vegetação/mobiliário entram como acentos atrás. */
.moodboard-legenda { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; margin-bottom: 14px; }
.moodboard-palco { position: relative; width: 100%; height: 380px; margin-bottom: 22px; border-radius: var(--r-md); border: 1px solid var(--border2); overflow: hidden; }
.moodboard-fundo { position: absolute; inset: 0; z-index: 0;
  background: radial-gradient(120% 90% at 50% 0%, #efe8da, #ded2ba 65%, #cabb9d 100%);
}
.mb-peca { position: absolute; background: #fbfaf6; padding: 6px; border-radius: 7px; box-shadow: 0 14px 28px rgba(0,0,0,0.28); }
.mb-peca img, .mb-peca > span { display: block; width: 100%; height: 100%; border-radius: 3px; }
.mb-foto { aspect-ratio: 4 / 5; }
.mb-foto img { object-fit: cover; }
.mb-cor, .mb-tex { aspect-ratio: 1; }
.mb-comp { background: none; padding: 0; box-shadow: none; filter: drop-shadow(0 10px 18px rgba(0,0,0,0.3)); }
.mb-comp img { border-radius: 0; }

/* — 3.3 promessas (flip + reveal escalonado) — */
.promessa-legenda { font-size: var(--fs-sm); color: var(--muted); margin-bottom: 14px; }
.promessa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 14px; }
.promessa-card { perspective: 1200px; height: 150px; cursor: pointer; opacity: 0; transform: translateY(14px); transition: opacity .55s ease, transform .55s ease; }
.promessa-card.vis { opacity: 1; transform: translateY(0); }
.promessa-inner { position: relative; width: 100%; height: 100%; transition: transform .55s; transform-style: preserve-3d; }
.promessa-card.flipped .promessa-inner { transform: rotateY(180deg); }
.promessa-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--r-md); border: 1px solid var(--gold-mid); padding: 16px; display: flex; flex-direction: column; }
.promessa-front { background: linear-gradient(155deg, rgba(201,162,39,0.10), var(--glass2) 60%); }
.promessa-icone { width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--gold-dim); display: flex; align-items: center; justify-content: center; color: var(--gold); margin-bottom: 10px; }
.promessa-texto { font-family: 'Sora', sans-serif; font-weight: 500; font-size: var(--fs-sm); color: var(--white); line-height: 1.4; flex: 1; }
.promessa-virar { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .05em; color: var(--gold); display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; }
.promessa-back { background: rgba(201,162,39,0.10); transform: rotateY(180deg); align-items: center; justify-content: center; text-align: center; }
.promessa-back-texto { font-size: var(--fs-sm); color: var(--off); line-height: 1.55; }

/* — 3.4 jogo dos palpites — */
.palpite-instrucao { font-size: var(--fs-sm); color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
.palpite-lista { display: flex; flex-direction: column; gap: 14px; margin-bottom: 6px; }
.palpite-lista.compacta { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); }
.palpite-card { background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-md); padding: 16px; }
/* balão em cápsula: extremidades em semicírculo, avatar embutido na ponta esquerda */
.palpite-topo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border2); border-radius: 999px; padding: 4px 20px 4px 4px; max-width: 100%; }
.pers-avatar { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 2px solid var(--muted2); display: flex; align-items: center; justify-content: center; color: var(--off); flex-shrink: 0; }
.pers-avatar.voce { border-color: var(--gold); color: var(--gold); background: var(--gold-dim); }
.pers-avatar.humano { border-color: #7fa8c9; color: #9dc0dc; background: rgba(127,168,201,0.10); }
.pers-avatar.pet { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.pers-nome { font-family: 'Sora', sans-serif; font-weight: 600; font-size: var(--fs-base); color: var(--white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palpite-campo { display: block; margin-bottom: 10px; }
.palpite-label { display: block; font-size: var(--fs-xs); color: var(--off); margin-bottom: 6px; line-height: 1.4; }
.palpite-input { width: 100%; background: var(--card2); border: 1px solid var(--border2); border-radius: var(--r-sm); padding: 10px 12px; color: var(--white); font-family: 'Outfit', sans-serif; font-size: var(--fs-sm); }
.palpite-input:focus { outline: none; border-color: var(--gold-mid); }
.palpite-travado { display: flex; align-items: center; gap: 7px; font-size: var(--fs-xs); color: var(--muted); background: rgba(255,255,255,0.03); border: 1px dashed var(--border2); border-radius: var(--r-sm); padding: 10px 12px; line-height: 1.4; }
.palpite-travado svg { color: var(--muted); flex-shrink: 0; }
.palpite-obs { font-size: var(--fs-xs); color: var(--green); background: var(--green-dim); border-radius: var(--r-sm); padding: 9px 12px; line-height: 1.5; margin-bottom: 10px; display: flex; align-items: flex-start; gap: 6px; }
.palpite-obs svg { flex-shrink: 0; margin-top: 1px; }
.palpite-revelacao { font-size: var(--fs-sm); color: var(--gold-light); background: var(--gold-dim); border-radius: var(--r-sm); padding: 10px 12px; line-height: 1.5; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.palpite-revelacao b { color: var(--white); font-weight: 500; }

/* — 6 cards de compartilhamento — */
.share-card { margin-bottom: 16px; padding: 20px; border-radius: var(--r-lg); background: linear-gradient(160deg, rgba(201,162,39,0.09), var(--glass2) 70%); border: 1px solid var(--gold-mid); }
.share-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.share-icone { width: 48px; height: 48px; border-radius: 50%; background: var(--gold-dim); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--gold); flex-shrink: 0; }
.share-titulo { font-family: 'Sora', sans-serif; font-weight: 700; font-size: var(--fs-md); color: var(--white); line-height: 1.2; }
.share-texto { font-size: var(--fs-sm); color: var(--muted); line-height: 1.65; margin-bottom: 16px; }
.share-motivos { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.share-motivo { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-md); padding: 13px 15px; cursor: pointer; transition: all .2s; font-family: 'Outfit', sans-serif; }
.share-motivo:hover { border-color: var(--gold-mid); background: rgba(255,255,255,0.05); }
.share-motivo-txt { flex: 1; font-size: var(--fs-sm); color: var(--off); line-height: 1.5; }
.share-motivo > svg { color: var(--gold); flex-shrink: 0; }
.share-rodape { font-size: var(--fs-sm); color: var(--gold-light); line-height: 1.6; display: flex; align-items: flex-start; gap: 7px; padding-top: 4px; }
.share-rodape svg { color: var(--gold); flex-shrink: 0; margin-top: 2px; }
.share-rodape b { color: var(--white); font-weight: 600; }

/* — 6.2 Instagram builder — */
.insta-builder { display: flex; gap: 18px; margin: 6px 0 18px; flex-wrap: wrap; }
.insta-coluna { flex: 1; min-width: 200px; }
.insta-sub { font-size: var(--fs-2xs); text-transform: uppercase; letter-spacing: .08em; color: var(--gold); margin: 14px 0 8px; }
.insta-sub:first-child { margin-top: 0; }
.insta-chips, .insta-frases { display: flex; flex-wrap: wrap; gap: 8px; }
.insta-chip { display: inline-flex; align-items: center; gap: 5px; background: var(--glass2); border: 1px solid var(--border2); border-radius: var(--r-pill); padding: 7px 13px; font-size: var(--fs-xs); color: var(--off); cursor: pointer; font-family: 'Outfit', sans-serif; transition: all .2s; }
.insta-chip.ativo { background: var(--gold-dim); border-color: var(--gold-mid); color: var(--gold-light); }
.insta-chip:hover { border-color: var(--gold-mid); }

async function tentar(promessa, fallback) {
  try {
    const { data, error } = await promessa;
    if (error) { console.warn('Aviso Supabase:', error.message || error); return fallback; }
    return data !== undefined && data !== null ? data : fallback;
  } catch (err) {
    console.warn('Tabela ainda não existe ou falhou (rode a migração):', err.message || err);
    return fallback;
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = ic('info') + `<span>${msg}</span>`;
  icons();
  t.classList.add('vis');
  setTimeout(() => t.classList.remove('vis'), 4000);
}

function formatarData(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' }).replace('.', '');
}
function paraInputDate(iso) {
  if (!iso) return '';
  return new Date(iso).toISOString().slice(0,10);
}

function primeiroNome(nomeCompleto) { return (nomeCompleto || '').split(' ')[0] || 'você'; }

function marcarPalavras(texto) {
  return texto.split(' ').map((p, i) => `<span class="rev-word" style="transition-delay:${i * 45}ms">${p}</span>`).join(' ');
}
function revelarPalavras(container) {
  const spans = container.querySelectorAll('.rev-word');
  spans.forEach(s => { s.style.opacity = '0'; s.style.transform = 'translateY(6px)'; s.style.transition = s.style.transition || 'opacity .5s ease, transform .5s ease'; });
  requestAnimationFrame(() => requestAnimationFrame(() => { spans.forEach(s => { s.style.opacity = '1'; s.style.transform = 'translateY(0)'; }); }));
}

// "ímã" na bolha do toggle da capa — ao passar o mouse, a bolha é puxada para cima,
// nunca para os lados nem para baixo, sempre dentro do curso da própria cápsula
// (adaptado do efeito "ímã no cursor": aqui só o eixo Y importa, e só o sentido de subir)
function ativarImaBolhaVertical(toggleEl) {
  if (!toggleEl || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const bolha = toggleEl.querySelector('.marco-toggle-bolha');
  if (!bolha) return;
  const limite = 10; // px extras de atração, além do deslocamento do estado ligado/desligado
  toggleEl.addEventListener('mousemove', (ev) => {
    const r = toggleEl.getBoundingClientRect();
    const cy = r.top + r.height / 2;
    const dy = (ev.clientY - cy) / (r.height / 2); // -1 no topo … 1 na base
    const forca = Math.max(0, -dy); // só atrai quando o mouse está acima do centro da cápsula
    const base = toggleEl.classList.contains('ativo') ? -32 : 0;
    bolha.style.transform = `translateY(${base - forca * limite}px)`;
  });
  toggleEl.addEventListener('mouseleave', () => { bolha.style.transform = ''; });
}

// PARTÍCULAS QUE FOGEM DO MOUSE — fundo do card "Meu Projeto".
// Grade de pontos dourados; ao aproximar o mouse eles são empurrados e voltam devagar.
let pararParticulas = null;
function iniciarParticulasHero() {
  if (pararParticulas) { pararParticulas(); pararParticulas = null; }
  const card = document.querySelector('.card-hero');
  const zona = card && card.querySelector('.card-corpo');
  const cv = zona && zona.querySelector('.hero-particulas');
  if (!cv || !zona) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ctx = cv.getContext('2d');
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));
  let pts = [], mouse = { x: -999, y: -999 }, raf = null, rodando = false;

  function medir() {
    cv.width = zona.clientWidth; cv.height = zona.clientHeight;
    pts = [];
    for (let y = 16; y < cv.height; y += 24)
      for (let x = 16; x < cv.width; x += 24)
        pts.push({ ox: x, oy: y, x, y });
  }
  medir();
  const onResize = () => medir();
  const onMove = (ev) => { const r = cv.getBoundingClientRect(); mouse.x = ev.clientX - r.left; mouse.y = ev.clientY - r.top; };
  const onLeave = () => { mouse.x = mouse.y = -999; };
  window.addEventListener('resize', onResize);
  card.addEventListener('mousemove', onMove);
  card.addEventListener('mouseleave', onLeave);

  function passo() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of pts) {
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < 80 && d > 0) { const f = (80 - d) / 80; p.x += (dx / d) * f * 6; p.y += (dy / d) * f * 6; }
      p.x = lerp(p.x, p.ox, 0.08); p.y = lerp(p.y, p.oy, 0.08);
      const desloc = Math.hypot(p.x - p.ox, p.y - p.oy);
      const brilho = clamp(1 - desloc / 34, 0.12, 0.8);
      const cor = desloc > 6 ? '226,185,59' : '201,162,39';
      ctx.fillStyle = `rgba(${cor},${brilho})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 1.6, 0, 6.2832); ctx.fill();
    }
    raf = requestAnimationFrame(passo);
  }
  function ligar() { if (!rodando) { rodando = true; passo(); } }
  function desligar() { if (rodando) { rodando = false; cancelAnimationFrame(raf); } }
  const obs = new IntersectionObserver(e => { e[0].isIntersecting ? ligar() : desligar(); }, { threshold: 0 });
  obs.observe(card);
  ligar();

  pararParticulas = () => {
    desligar(); obs.disconnect();
    window.removeEventListener('resize', onResize);
    card.removeEventListener('mousemove', onMove);
    card.removeEventListener('mouseleave', onLeave);
  };
}

// desenha um anel de progresso (SVG puro, sem libs) — usado na capa de "Meu Projeto"
function anelSVG(pct, cor, tamanho, esp) {
  tamanho = tamanho || 60; esp = esp || 6;
  const raio = (tamanho - esp) / 2;
  const c = 2 * Math.PI * raio;
  const p = Math.max(0, Math.min(100, pct));
  const off = c * (1 - p / 100);
  return `<svg width="${tamanho}" height="${tamanho}" viewBox="0 0 ${tamanho} ${tamanho}">
    <circle cx="${tamanho/2}" cy="${tamanho/2}" r="${raio}" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="${esp}"/>
    <circle cx="${tamanho/2}" cy="${tamanho/2}" r="${raio}" fill="none" stroke="${cor}" stroke-width="${esp}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${tamanho/2} ${tamanho/2})"/>
  </svg>`;
}

// barras verticais por fase — gráfico da capa "Meu Projeto"
function graficoBarrasFases(num) {
  const barras = FASES.map(f => {
    const concluida = f.num < num, ativa = f.num === num;
    const altura = concluida ? 100 : (ativa ? 55 : 12);
    return `<div class="evolucao-barra-wrap"><div class="evolucao-barra ${concluida ? 'concluida' : ativa ? 'ativa' : ''}" style="height:${altura}%"></div><div class="evolucao-label">${f.nome}</div></div>`;
  }).join('');
  return `<div class="evolucao-chart">${barras}</div>`;

// dupla de anéis circulares — gráfico da capa E do conteúdo expandido de "Sua Trajetória"
// `tamanho` deixa o modal exibir os anéis maiores que a capa (mesma função, dois contextos)
function aneisProgresso(num, tamanho) {
  tamanho = tamanho || 60;
  const fontePct = Math.max(11, Math.round(tamanho * 0.22));
  const designPct = Math.round(Math.min(num - 1, 4) / 4 * 100);
  const obraIniciada = num >= 5;
  const obraPct = obraIniciada ? Math.max(0, Math.min(100, projeto.obra_progresso_pct || 0)) : 0;

  const anelDesign = `
    <div class="anel-item">
      <div class="anel-svg-wrap" style="width:${tamanho}px;height:${tamanho}px;">${anelSVG(designPct, 'var(--gold)', tamanho)}<div class="anel-pct" style="font-size:${fontePct}px">${designPct}%</div></div>
      <div class="anel-label">Design do projeto</div>
    </div>`;
  const anelObra = obraIniciada
    ? `<div class="anel-item">
        <div class="anel-svg-wrap" style="width:${tamanho}px;height:${tamanho}px;">${anelSVG(obraPct, 'var(--green)', tamanho)}<div class="anel-pct" style="font-size:${fontePct}px">${obraPct}%</div></div>
        <div class="anel-label">Obra</div>
      </div>`
    : `<div class="anel-item anel-convite" title="Disponível quando a obra começar">
        <div class="anel-svg-wrap" style="width:${tamanho}px;height:${tamanho}px;">${anelSVG(0, 'rgba(255,255,255,0.16)', tamanho)}<div class="anel-pct" style="font-size:${fontePct}px">${ic('lock','ic-sm')}</div></div>
        <div class="anel-label">Obra</div>
      </div>`;

  return `<div class="anel-duo">${anelDesign}${anelObra}</div>`;
}

// heurística de "decisões tomadas": cada aprovação/entrega concreta ao longo da jornada conta uma
function contarDecisoes() {
  let n = 0;
  if (briefing && briefing.status === 'enviado') n++;
  n += Math.max(0, (projeto.etapa_atual || 1) - 1);
  n += Object.values(statusAmbientes || {}).filter(s => s === 'aprovado').length;
  if (marcos) n += marcosVisiveis().filter(m => marcos[m.campo]).length;
  return n;
}

    const dias = Math.ceil((new Date(prazo) - new Date()) / 86400000);
    if (dias >= 0 && dias <= 7) {
      return `O prazo previsto da fase ${fase.nome} está próximo: ${formatarData(prazo)}. Fique de olho nas novidades por aqui.`;
    }
  }
  return `Nos próximos 7 dias, nossa equipe segue avançando na fase de ${fase.nome}, com todo o cuidado. Qualquer novidade, você é a primeira pessoa a saber.`;

function calcularPendencia() {
  const { fase } = infoFaseAtiva();
  if (fase.id === 'briefing') {

  if (fase.id === 'layout' || fase.id === 'imagens') {

let cardOrigemAtual = null;

function abrirCard(key, origemEl) {
  const overlay = document.getElementById('modal-overlay');
  const win = document.getElementById('modal-window');
  const inner = document.getElementById('modal-inner');

  cardOrigemAtual = origemEl;
  const r = origemEl.getBoundingClientRect();

  win.style.display = 'block';
  win.style.top = r.top + 'px';
  win.style.left = r.left + 'px';
  win.style.width = r.width + 'px';
  win.style.height = r.height + 'px';
  win.style.borderRadius = '24px';
  inner.classList.remove('vis');
  inner.innerHTML = '';

  requestAnimationFrame(() => {
    overlay.classList.add('vis');
    const alvo = alvoExpandido();
    void win.offsetWidth;
    win.style.top = alvo.top + 'px';
    win.style.left = alvo.left + 'px';
    win.style.width = alvo.width + 'px';
    win.style.height = alvo.height + 'px';
    win.style.borderRadius = '28px';
  });

  setTimeout(() => {
    inner.innerHTML = conteudoExpandido(key);
    inner.classList.add('vis');
    ligarEventosExpandido(key);
    revelarPalavras(inner);
    icons();
  }, 480);

  document.addEventListener('keydown', escFecha);
  overlay.onclick = fecharExpandido;
}

function alvoExpandido() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.min(780, vw - 48);
  const h = Math.min(vh - 80, 660);
  return { top: (vh - h) / 2, left: (vw - w) / 2, width: w, height: h };
}

function escFecha(e) { if (e.key === 'Escape') fecharExpandido(); }

function fecharExpandido() {
  const overlay = document.getElementById('modal-overlay');
  const win = document.getElementById('modal-window');
  const inner = document.getElementById('modal-inner');
  inner.classList.remove('vis');
  overlay.classList.remove('vis');

  const origem = cardOrigemAtual;
  setTimeout(() => {
    if (origem) {
      const r = origem.getBoundingClientRect();
      win.style.top = r.top + 'px'; win.style.left = r.left + 'px';
      win.style.width = r.width + 'px'; win.style.height = r.height + 'px';
      win.style.borderRadius = '24px';
    }
  }, 20);

  setTimeout(() => { win.style.display = 'none'; inner.innerHTML = ''; }, 520);
  document.removeEventListener('keydown', escFecha);
}

// ── "O que você sonhou" — flip das promessas, reveal escalonado, compartilhar, 1º acesso ──
function ligarSonhou() {
  // vira o cartão de promessa ao toque
  document.querySelectorAll('#modal-inner .promessa-card').forEach(c =>
    c.addEventListener('click', () => c.classList.toggle('flipped')));

  // reveal escalonado conforme rola — baseado no scroll do modal (robusto em qualquer navegador)
  const root = document.getElementById('modal-inner');
  const alvos = [...document.querySelectorAll('#modal-inner .reveal')];
  if (alvos.length) {
    const revelarVisiveis = () => {
      const rr = root.getBoundingClientRect();
      alvos.forEach(a => {
        if (a.classList.contains('vis')) return;
        const r = a.getBoundingClientRect();
        if (r.top < rr.bottom - 20) a.classList.add('vis');
      });
    };
    root.addEventListener('scroll', revelarVisiveis, { passive: true });
    requestAnimationFrame(revelarVisiveis);
    // rede de segurança: nada fica invisível para sempre se o scroll não disparar
    setTimeout(() => alvos.forEach(a => a.classList.add('vis')), 2500);
  }

  // carrossel manual das imagens de referência (setas + dots + arrastar + mouse sobre = rola de lado)
  const carr = document.querySelector('#modal-inner .ref-carrossel');
  if (carr) {
    const vp = carr.querySelector('.ref-viewport');
    const slides = [...carr.querySelectorAll('.ref-slide')];
    const dots = [...document.querySelectorAll('#modal-inner .ref-dot')];
    const irPara = (i) => { const s = slides[i]; if (s) vp.scrollTo({ left: s.offsetLeft - vp.offsetLeft, behavior: 'smooth' }); };
    carr.querySelector('.ref-prev').addEventListener('click', () => vp.scrollBy({ left: -vp.clientWidth * 0.8, behavior: 'smooth' }));
    carr.querySelector('.ref-next').addEventListener('click', () => vp.scrollBy({ left: vp.clientWidth * 0.8, behavior: 'smooth' }));
    dots.forEach(d => d.addEventListener('click', () => irPara(+d.dataset.i)));
    vp.addEventListener('scroll', () => {
      const idx = Math.round(vp.scrollLeft / (vp.clientWidth * 0.8 || 1));
      dots.forEach((d, i) => d.classList.toggle('ativo', i === Math.min(idx, dots.length - 1)));
    }, { passive: true });
    // com o mouse sobre o carrossel, a rolagem do mouse vira rolagem lateral (sem descer a página);
    // ao tirar o mouse de cima, a rolagem vertical do modal volta a funcionar normalmente
    vp.addEventListener('wheel', (e) => {
      if (Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
        vp.scrollLeft += e.deltaY;
        e.preventDefault();
      }
    }, { passive: false });
  }

  // jogo dos palpites — salva palpite/confirmação (por personagem) ao sair do campo
  document.querySelectorAll('#modal-inner .palpite-input').forEach(inp =>
    inp.addEventListener('change', () => salvarPalpite(inp)));

  // botões de compartilhar → placeholder "em desenvolvimento"
  document.querySelectorAll('#modal-inner [data-share]').forEach(b =>
    b.addEventListener('click', () => mostrarEmDesenvolvimento(b.dataset.share)));

  // primeiro acesso → leva ao card "Meu Projeto" para iniciar o briefing
  const iniciar = document.getElementById('sonhou-iniciar');
  if (iniciar) iniciar.addEventListener('click', () => { fecharExpandido(); setTimeout(() => abrirCard('hero', document.querySelector('.card-hero')), 550); });
}

// salva um palpite/confirmação do jogo (upsert por projeto+personagem)
async function salvarPalpite(inp) {
  const key = inp.dataset.key, campo = inp.dataset.campo, valor = inp.value.trim();
  let reg = palpites.find(p => p.personagem_key === key);
  if (!reg) { reg = { personagem_key: key, personagem_nome: inp.dataset.nome, personagem_tipo: inp.dataset.tipo }; palpites.push(reg); }
  reg[campo] = valor;
  if (usuarioAtual && usuarioAtual.email === 'demo@demo.com') { toast('Palpite guardado.'); return; }
  const payload = {
    projeto_id: projeto.id, personagem_key: key,
    personagem_nome: inp.dataset.nome, personagem_tipo: inp.dataset.tipo,
    [campo]: valor || null, atualizado_em: new Date().toISOString(),
  };
  const { error } = await sb.from('palpites_ambiente').upsert(payload, { onConflict: 'projeto_id,personagem_key' });
  if (error) { toast('Não foi possível guardar o palpite agora.'); console.error(error); return; }
  toast('Palpite guardado.');
}

// EFEITO "CARTÕES QUE EMPILHAM" — cada fase gruda no topo (sticky) e a seguinte sobe
// por cima; as de baixo encolhem e escurecem. Roda no scroll do modal (#modal-inner).
function ativarPilhaFases() {
  const caixa = document.getElementById('modal-inner');
  const folhas = [...document.querySelectorAll('#fases-pilha .fase-item')];
  if (!caixa || !folhas.length) return;
  const TOPO = 14;
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  // posição natural de cada folha, relativa ao topo REAL do conteúdo rolável de #modal-inner
  // (não ao offsetParent — se houver algo acima de .fases-pilha, como o accordion de
  // Abertura/Instrução, o offsetTop sozinho mentiria sobre a origem)
  const naturais = folhas.map(f => {
    const antes = f.style.position;
    f.style.position = 'static';
    const rf = f.getBoundingClientRect();
    const rc = caixa.getBoundingClientRect();
    const y = (rf.top - rc.top) + caixa.scrollTop;
    f.style.position = antes;
    return y;
  });

  function passo() {
    folhas.forEach((f, i) => {
      const vao = f.offsetHeight + 16;
      const preso = clamp((caixa.scrollTop + TOPO - naturais[i]) / vao, 0, 1);
      f.style.transform = 'scale(' + (1 - preso * 0.06) + ')';
      f.style.filter = 'brightness(' + (1 - preso * 0.4) + ')';
      f.style.zIndex = i;
    });
  }
  passo();
  caixa.addEventListener('scroll', passo, { passive: true });
}

function ligarAccordionsGenericos() {
  document.querySelectorAll('#modal-inner [data-acc-toggle]').forEach(trigger => {
    trigger.addEventListener('click', () => {
      const id = trigger.dataset.accToggle;
      const body = document.getElementById('acc-body-' + id);

      const abrindo = !body.classList.contains('aberto');
      body.classList.toggle('aberto', abrindo);
