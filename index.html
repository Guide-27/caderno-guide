<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guide Arquitetura — Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --black: #0a0a0a; --dark: #111111; --card: #161616; --card2: #1c1c1c;
    --gold: #C9A227; --gold-light: #e2b93b; --gold-dim: rgba(201,162,39,0.10);
    --white: #f5f4f0; --off: #e8e6df; --muted: #7a7870; --muted2: #555450;
    --border: rgba(201,162,39,0.15); --border2: rgba(201,162,39,0.08);
    --green: #4CAF50; --red: #e53935;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--black); color:var(--white); font-family:'Outfit',sans-serif; font-weight:300; min-height:100vh; }

  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse 80% 60% at 15% 10%, rgba(201,162,39,0.055) 0%, transparent 60%),
                radial-gradient(ellipse 60% 80% at 85% 90%, rgba(201,162,39,0.04) 0%, transparent 55%);
  }

  .top-bar {
    position:fixed; top:0; left:0; right:0; height:60px;
    background:rgba(10,10,10,0.95); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 48px; z-index:200;
  }
  .top-bar-logo { font-family:'Cormorant Garamond',serif; font-size:22px; color:var(--gold); font-weight:600; letter-spacing:0.05em; }
  .top-bar-label { font-size:11px; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; }

  .main { max-width:1000px; margin:0 auto; padding:100px 40px 80px; position:relative; z-index:1; }

  h1 { font-family:'Cormorant Garamond',serif; font-size:48px; font-weight:300; color:var(--white); margin-bottom:8px; }
  h1 span { color:var(--gold); font-style:italic; }
  .subtitulo { font-size:14px; color:var(--muted); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:48px; }

  /* FORM NOVO PROJETO */
  .form-card {
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:36px; margin-bottom:48px;
  }
  .form-title { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); margin-bottom:24px; font-weight:500; }
  .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
  .form-group { display:flex; flex-direction:column; gap:8px; }
  .form-group label { font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--muted2); font-weight:500; }
  .form-group input, .form-group select {
    background:var(--dark); border:1px solid var(--border2); border-radius:8px;
    padding:12px 16px; color:var(--white); font-family:'Outfit',sans-serif;
    font-size:14px; font-weight:300; outline:none; transition:border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color:var(--gold); }
  .form-group input::placeholder { color:var(--muted2); }
  .form-group select option { background:var(--dark); }

  .btn-criar {
    background:var(--gold); color:var(--black); border:none; border-radius:8px;
    padding:14px 32px; font-family:'Outfit',sans-serif; font-size:13px;
    font-weight:500; letter-spacing:0.08em; text-transform:uppercase;
    cursor:pointer; transition:all 0.2s;
  }
  .btn-criar:hover { background:var(--gold-light); transform:translateY(-1px); }
  .btn-criar:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

  /* LISTA DE PROJETOS */
  .projetos-label { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); margin-bottom:20px; font-weight:500; display:flex; align-items:center; gap:12px; }
  .projetos-label::before { content:''; display:block; width:20px; height:1px; background:var(--gold); }

  .projeto-card {
    background:var(--card); border:1px solid var(--border2); border-radius:12px;
    padding:24px 28px; margin-bottom:12px; display:flex;
    align-items:center; justify-content:space-between; gap:20px;
    transition:border-color 0.2s, transform 0.2s; cursor:default;
  }
  .projeto-card:hover { border-color:var(--border); transform:translateY(-1px); }
  .projeto-info { flex:1; }
  .projeto-nome { font-size:18px; font-weight:400; color:var(--white); margin-bottom:4px; }
  .projeto-meta { font-size:12px; color:var(--muted); letter-spacing:0.04em; }
  .projeto-plano {
    font-size:10px; padding:4px 12px; border-radius:20px; letter-spacing:0.1em;
    text-transform:uppercase; font-weight:500; border:1px solid var(--border);
    color:var(--gold); background:var(--gold-dim); white-space:nowrap;
  }
  .projeto-acoes { display:flex; gap:8px; align-items:center; }
  .btn-link {
    background:transparent; border:1px solid var(--border); border-radius:8px;
    padding:8px 16px; color:var(--muted); font-family:'Outfit',sans-serif;
    font-size:12px; cursor:pointer; transition:all 0.2s; text-decoration:none;
    display:flex; align-items:center; gap:6px;
  }
  .btn-link:hover { border-color:var(--gold); color:var(--gold); }
  .btn-abrir {
    background:var(--gold); color:var(--black); border:none; border-radius:8px;
    padding:8px 20px; font-family:'Outfit',sans-serif; font-size:12px;
    font-weight:500; cursor:pointer; transition:all 0.2s; text-decoration:none;
    letter-spacing:0.06em; text-transform:uppercase;
  }
  .btn-abrir:hover { background:var(--gold-light); }

  .empty-state { text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state p { font-size:14px; margin-top:12px; }

  .toast {
    position:fixed; bottom:32px; right:32px; z-index:999;
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:14px 20px; font-size:13px; color:var(--white);
    transform:translateY(20px); opacity:0; transition:all 0.3s;
    max-width:320px;
  }
  .toast.show { transform:translateY(0); opacity:1; }
  .toast.ok { border-color:rgba(76,175,80,0.4); }
  .toast.erro { border-color:rgba(229,57,53,0.4); }

  .loading { text-align:center; padding:40px; color:var(--muted); font-size:14px; }

  @media(max-width:600px) {
    .form-grid { grid-template-columns:1fr; }
    .main { padding:90px 20px 60px; }
    .top-bar { padding:0 20px; }
    .projeto-card { flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <span class="top-bar-logo">Guide</span>
  <span class="top-bar-label">Painel do Arquiteto</span>
</div>

<main class="main">
  <h1>Cadernos de <span>Projeto</span></h1>
  <p class="subtitulo">Gerencie os cadernos dos seus clientes</p>

  <!-- FORM NOVO PROJETO -->
  <div class="form-card">
    <div class="form-title">Novo projeto</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Nome do cliente</label>
        <input type="text" id="inp-nome" placeholder="Ex: Ana Silva">
      </div>
      <div class="form-group">
        <label>Endereço / Imóvel</label>
        <input type="text" id="inp-endereco" placeholder="Ex: Apto 72, Vila Madalena">
      </div>
      <div class="form-group">
        <label>Arquiteto responsável</label>
        <input type="text" id="inp-arquiteto" placeholder="Ex: Mariana Guide">
      </div>
      <div class="form-group">
        <label>Plano</label>
        <select id="inp-plano">
          <option value="Self Made">Self Made</option>
          <option value="Standard">Standard</option>
          <option value="Signature">Signature</option>
        </select>
      </div>
    </div>
    <button class="btn-criar" id="btn-criar" onclick="criarProjeto()">Criar caderno</button>
  </div>

  <!-- LISTA -->
  <div class="projetos-label">Projetos ativos</div>
  <div id="lista-projetos"><div class="loading">Carregando projetos...</div></div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://fkbvwcppbjlodtnjrmbw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0IUgFI-iKEfi_w0uuLFjzA_OiFsQoQ2';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

function toast(msg, tipo='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast show ${tipo}`;
  setTimeout(() => el.className = 'toast', 3000);
}

async function carregarProjetos() {
  const lista = document.getElementById('lista-projetos');
  const { data, error } = await db.from('projetos').select('*').order('criado_em', { ascending: false });
  if (error) { lista.innerHTML = '<div class="loading">Erro ao carregar projetos.</div>'; return; }
  if (!data.length) {
    lista.innerHTML = '<div class="empty-state"><div style="font-size:32px;">📋</div><p>Nenhum projeto ainda. Crie o primeiro acima.</p></div>';
    return;
  }
  lista.innerHTML = data.map(p => {
    const data_fmt = new Date(p.criado_em).toLocaleDateString('pt-BR');
    const link = `${location.origin}/caderno.html?id=${p.id}`;
    return `
      <div class="projeto-card">
        <div class="projeto-info">
          <div class="projeto-nome">${p.nome_cliente}</div>
          <div class="projeto-meta">${p.endereco || '—'} · ${p.arquiteto || '—'} · Criado em ${data_fmt}</div>
        </div>
        <span class="projeto-plano">${p.plano}</span>
        <div class="projeto-acoes">
          <button class="btn-link" onclick="copiarLink('${link}')">📋 Copiar link</button>
          <a class="btn-abrir" href="caderno.html?id=${p.id}" target="_blank">Abrir caderno</a>
        </div>
      </div>
    `;
  }).join('');
}

async function criarProjeto() {
  const nome = document.getElementById('inp-nome').value.trim();
  const endereco = document.getElementById('inp-endereco').value.trim();
  const arquiteto = document.getElementById('inp-arquiteto').value.trim();
  const plano = document.getElementById('inp-plano').value;

  if (!nome) { toast('Informe o nome do cliente.', 'erro'); return; }

  const btn = document.getElementById('btn-criar');
  btn.disabled = true; btn.textContent = 'Criando...';

  const { data, error } = await db.from('projetos').insert([{ nome_cliente: nome, endereco, arquiteto, plano }]).select().single();

  btn.disabled = false; btn.textContent = 'Criar caderno';

  if (error) { toast('Erro ao criar projeto. Tente novamente.', 'erro'); return; }

  // Criar ambientes padrão
  const ambientesDefault = [
    'Cozinha + Área de Serviço', 'Sala de Estar + Jantar', 'Suíte Master', 'Banheiro', 'Varanda'
  ];
  await db.from('ambientes').insert(ambientesDefault.map((nome, i) => ({ projeto_id: data.id, nome, ordem: i })));

  toast(`Caderno de ${nome} criado com sucesso!`);
  document.getElementById('inp-nome').value = '';
  document.getElementById('inp-endereco').value = '';
  document.getElementById('inp-arquiteto').value = '';
  carregarProjetos();
}

function copiarLink(link) {
  navigator.clipboard.writeText(link).then(() => toast('Link copiado!')).catch(() => toast('Erro ao copiar.', 'erro'));
}

carregarProjetos();
</script>
</body>
</html>
