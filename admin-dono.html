<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração — Painel Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black:#08080a; --dark:#111113; --card:#15151a; --card2:#1a1a20;
  --gold:#C9A227; --gold-light:#e2b93b; --gold-dim:rgba(201,162,39,0.08); --gold-mid:rgba(201,162,39,0.22);
  --white:#f5f4f0; --off:#e0ddd6; --muted:#9a968d; --muted2:#6a665e;
  --border:rgba(201,162,39,0.14); --border2:rgba(255,255,255,0.06);
  --green:#50C878; --green-dim:rgba(80,200,120,0.09); --blue:#5a8cdc; --blue-dim:rgba(90,140,220,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--black); color: var(--off); font-family: 'Outfit', sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
#bg-canvas { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; }
.noise { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); background-size: 200px; }
.top-bar { position: fixed; top: 24px; left: 28px; right: 28px; height: 60px; background: rgba(255,255,255,0.06); backdrop-filter: blur(32px) saturate(160%); -webkit-backdrop-filter: blur(32px) saturate(160%); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; box-shadow: 0 1px 0 rgba(255,255,255,0.07) inset, 0 18px 44px rgba(0,0,0,0.45), 0 0 24px rgba(201,162,39,0.04); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 300; }
.top-left { display: flex; align-items: center; gap: 12px; }
.top-logo-img { height: 28px; width: auto; display: block; }
.top-painel-badge { font-size: 9px; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--gold-dim); }
.top-right { display: flex; align-items: center; gap: 14px; }
.top-arquiteto { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.btn-logout { background: transparent; border: 1px solid var(--border2); border-radius: 10px; padding: 6px 14px; font-size: 11px; color: var(--muted); cursor: pointer; font-family: 'Outfit', sans-serif; transition: all 0.2s; letter-spacing: 0.06em; text-transform: uppercase; }
.btn-logout:hover { color: var(--gold); border-color: var(--border); }
.main { max-width: 1180px; margin: 0 auto; padding: 130px 28px 80px; position: relative; z-index: 2; }
.page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 26px; flex-wrap: wrap; gap: 16px; }
.page-saudacao { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.page-titulo { font-family: 'Quicksand', sans-serif; font-size: 30px; font-weight: 700; color: var(--white); letter-spacing: -0.01em; margin-top: 6px; }
.periodo-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.periodo-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

/* KPIs */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 30px; }
.kpi { background: rgba(255,255,255,0.035); border: 1px solid var(--border2); border-radius: 16px; padding: 20px 22px; position: relative; overflow: hidden; }
.kpi::after { content:''; position:absolute; top:0; left:0; width:3px; height:100%; background: linear-gradient(180deg, var(--gold), transparent); opacity:.5; }
.kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; }
.kpi-valor { font-family: 'Quicksand', sans-serif; font-size: 28px; font-weight: 700; color: var(--white); line-height: 1; }
.kpi-sub { font-size: 12px; color: var(--muted); margin-top: 9px; }
.kpi-sub strong { color: var(--gold-light); font-weight: 600; }

.sec-titulo { font-family: 'Quicksand', sans-serif; font-size: 15px; font-weight: 600; color: var(--white); margin: 6px 0 14px; letter-spacing: 0.02em; }

/* por plano */
.plano-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 30px; }
.plano-card { background: rgba(255,255,255,0.035); border: 1px solid var(--border2); border-radius: 14px; padding: 16px 18px; }
.plano-card-top { display: flex; align-items: baseline; justify-content: space-between; }
.plano-card-nome { font-size: 13px; font-weight: 600; color: var(--gold-light); }
.plano-card-preco { font-size: 11px; color: var(--muted); }
.plano-card-n { font-family: 'Quicksand', sans-serif; font-size: 24px; font-weight: 700; color: var(--white); margin-top: 8px; }
.plano-card-rec { font-size: 12px; color: var(--muted); margin-top: 3px; }
.plano-bar { height: 5px; background: rgba(255,255,255,0.06); border-radius: 3px; margin-top: 12px; overflow: hidden; }
.plano-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 3px; transition: width .6s ease; }

/* filtros + tabela */
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.filtro-sel, .busca-input { background: rgba(255,255,255,0.035); border: 1px solid var(--border2); border-radius: 10px; padding: 9px 13px; font-family: 'Outfit', sans-serif; font-size: 12px; color: var(--white); outline: none; transition: border-color .2s; }
.filtro-sel:focus, .busca-input:focus { border-color: var(--gold-mid); }
.busca-input { min-width: 200px; }
.busca-input::placeholder { color: var(--muted2); }
.btn-export { margin-left: auto; background: transparent; border: 1px solid var(--border2); border-radius: 10px; padding: 9px 14px; font-size: 12px; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 7px; font-family: 'Outfit', sans-serif; transition: all .2s; }
.btn-export:hover { color: var(--gold); border-color: var(--border); }
.tabela-wrap { overflow-x: auto; border: 1px solid var(--border2); border-radius: 14px; }
table.contratacoes { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 860px; }
table.contratacoes th { text-align: left; padding: 12px 14px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--border2); background: rgba(255,255,255,0.02); font-weight: 600; white-space: nowrap; }
table.contratacoes td { padding: 12px 14px; border-bottom: 1px solid var(--border2); color: var(--off); }
table.contratacoes tr:last-child td { border-bottom: none; }
table.contratacoes tbody tr:hover td { background: rgba(255,255,255,0.02); }
.cel-cliente { font-weight: 500; color: var(--white); }
.cel-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.cel-valor { font-weight: 600; color: var(--white); white-space: nowrap; }
.tag-plano { font-size: 10px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--gold-dim); color: var(--gold-light); white-space: nowrap; }
.tag-conv { font-size: 10px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.tag-conv.sim { background: var(--green-dim); color: var(--green); border: 1px solid rgba(80,200,120,0.3); }
.tag-conv.nao { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--border2); }
.tabela-vazia { padding: 40px; text-align: center; color: var(--muted); font-size: 13px; }

/* comparativo mês a mês */
.comp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-bottom: 30px; }
.comp-card { background: rgba(255,255,255,0.035); border: 1px solid var(--border2); border-radius: 14px; padding: 16px 18px; }
.comp-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.comp-valor { font-family: 'Quicksand', sans-serif; font-size: 22px; font-weight: 700; color: var(--white); }
.comp-delta { font-size: 12px; margin-top: 6px; font-weight: 600; }
.comp-delta.up { color: var(--green); } .comp-delta.down { color: #e06b6b; } .comp-delta.flat { color: var(--muted); }
.comp-delta .comp-prev { color: var(--muted); font-weight: 400; margin-left: 5px; }

/* situação (status) */
.status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 10px; }
.status-card { background: rgba(255,255,255,0.035); border: 1px solid var(--border2); border-left: 3px solid var(--muted2); border-radius: 14px; padding: 14px 16px; }
.status-card.ativa { border-left-color: var(--gold); }
.status-card.concluida { border-left-color: var(--green); }
.status-card.pausada { border-left-color: var(--blue); }
.status-card.cancelada { border-left-color: #e06b6b; }
.status-nome { font-size: 12px; color: var(--off); margin-bottom: 6px; }
.status-n { font-family: 'Quicksand', sans-serif; font-size: 22px; font-weight: 700; color: var(--white); }
.status-rec { font-size: 11px; color: var(--muted); margin-top: 3px; }
.status-churn { font-size: 12px; color: var(--muted); margin-bottom: 28px; }
.status-churn strong { color: #e06b6b; }

/* gráfico de evolução */
.chart-wrap { background: rgba(255,255,255,0.025); border: 1px solid var(--border2); border-radius: 14px; padding: 18px 16px 10px; margin-bottom: 30px; }
.chart-bars { display: flex; align-items: flex-end; gap: 5px; height: 150px; }
.chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 5px; min-width: 0; }
.chart-val { font-size: 10px; color: var(--muted); }
.chart-bar { width: 100%; max-width: 34px; background: linear-gradient(180deg, var(--gold-light), var(--gold)); border-radius: 5px 5px 0 0; min-height: 2px; transition: height .5s ease; }
.chart-xlbl { font-size: 9px; color: var(--muted2); text-transform: uppercase; }

/* selects editáveis na tabela */
.sel-inline { background: rgba(255,255,255,0.04); border: 1px solid var(--border2); border-radius: 8px; padding: 5px 8px; font-size: 11px; color: var(--white); font-family: 'Outfit', sans-serif; cursor: pointer; outline: none; }
.sel-inline:focus { border-color: var(--gold-mid); }
.sel-inline.st-ativa { color: var(--gold-light); } .sel-inline.st-concluida { color: var(--green); } .sel-inline.st-pausada { color: var(--blue); } .sel-inline.st-cancelada { color: #e06b6b; }
.sel-inline.pg-pago { color: var(--green); } .sel-inline.pg-pendente { color: var(--muted); }

.loading { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 13px; }
.spinner { display: inline-block; width: 26px; height: 26px; border: 2px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.aviso { background: var(--blue-dim); border: 1px solid rgba(90,140,220,0.3); border-radius: 12px; padding: 14px 16px; font-size: 12.5px; color: var(--off); line-height: 1.6; margin-bottom: 24px; }
.aviso strong { color: var(--white); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(20,20,24,0.96); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 11px; padding: 13px 22px; font-size: 12px; color: var(--off); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.toast.vis { opacity: 1; }
@media (max-width: 600px){ .top-bar{left:12px;right:12px;padding:0 16px;} .main{padding:116px 16px 80px;} }

/* ── Central de notificações (pedidos de cancelamento / troca) ── */
.notif-sec { margin-bottom: 34px; }
.notif-sec-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.notif-sec-top .sec-titulo { margin: 0; }
.notif-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 7px; background: #e06b6b; color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; }
.notif-card { background: rgba(224,107,107,0.06); border: 1px solid rgba(224,107,107,0.3); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
.notif-card.troca { background: var(--gold-dim); border-color: var(--gold-mid); }
.notif-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.notif-tt { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; color: var(--white); }
.notif-cliente { font-size: 12px; color: var(--muted); margin-top: 3px; }
.notif-corpo { font-size: 13px; color: var(--off); line-height: 1.6; margin: 11px 0 0; }
.notif-corpo strong { color: var(--gold-light); }
.notif-valor-wrap { display: flex; align-items: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.notif-valor-pre { font-size: 13px; color: var(--muted); }
.notif-valor-input { width: 150px; background: rgba(255,255,255,0.04); border: 1px solid var(--border2); border-radius: 9px; padding: 9px 12px; color: var(--white); font-family: 'Outfit', sans-serif; font-size: 13px; outline: none; }
.notif-valor-input:focus { border-color: var(--gold-mid); }
.notif-conta { background: rgba(255,255,255,0.03); border: 1px solid var(--border2); border-radius: 10px; padding: 11px 13px; font-size: 12px; color: var(--off); margin-top: 12px; line-height: 1.7; }
.notif-conta strong { color: var(--white); }
.notif-badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
.notif-badge.aguardando { color: var(--gold-light); background: var(--gold-dim); border: 1px solid var(--gold-mid); }
.notif-badge.confirmado { color: var(--green); background: var(--green-dim); border: 1px solid rgba(80,200,120,0.35); }
.notif-badge.revisao { color: #e2b93b; background: rgba(224,107,107,0.1); border: 1px solid rgba(224,107,107,0.4); }
.notif-acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.notif-btn { background: transparent; border: 1px solid var(--border2); border-radius: 9px; padding: 9px 15px; font-size: 12px; color: var(--off); cursor: pointer; font-family: 'Outfit', sans-serif; transition: all .2s; }
.notif-btn:hover { border-color: var(--gold); color: var(--gold); }
.notif-btn.ok { background: linear-gradient(135deg, var(--gold), var(--gold-light)); color: #12100a; border: none; font-weight: 600; }
.notif-btn.danger:hover { border-color: #e06b6b; color: #e06b6b; }
.notif-vazia { font-size: 13px; color: var(--muted); background: rgba(255,255,255,0.02); border: 1px dashed var(--border2); border-radius: 14px; padding: 18px 20px; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="noise"></div>
<div class="top-bar">
  <div class="top-left">
    <img class="top-logo-img" src="/assets/logo-guide.svg" alt="Guide">
    <span class="top-painel-badge">Administração</span>
  </div>
  <div class="top-right">
    <span class="top-arquiteto" id="top-arquiteto"></span>
    <button class="btn-logout" onclick="window.location.href='/admin-projetos'">Projetos</button>
    <button class="btn-logout" id="btn-atendimento" onclick="window.location.href='/admin-atendimento'">Atendimento</button>
    <button class="btn-logout" onclick="fazerLogout()">Sair</button>
  </div>
</div>
<div class="main">
  <div class="page-header">
    <div>
      <div class="page-saudacao" id="saudacao">Visão da plataforma</div>
      <h1 class="page-titulo">Administração</h1>
    </div>
    <div class="periodo-wrap">
      <span class="periodo-lbl">Período</span>
      <select class="filtro-sel" id="f-periodo" onchange="onPeriodoChange()">
        <option value="todos">Todo o período</option>
        <option value="mes">Este mês</option>
        <option value="mes-passado">Mês passado</option>
        <option value="ano">Este ano</option>
        <option value="30">Últimos 30 dias</option>
        <option value="90">Últimos 90 dias</option>
        <option value="custom">Personalizado…</option>
      </select>
      <input type="date" class="filtro-sel" id="f-ini" style="display:none" onchange="atualizar()">
      <input type="date" class="filtro-sel" id="f-fim" style="display:none" onchange="atualizar()">
    </div>
  </div>
  <div id="conteudo">
    <div class="loading"><div class="spinner"></div><p>Carregando dados...</p></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://fkbvwcppbjlodtnjrmbw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrYnZ3Y3BwYmpsb2R0bmpybWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MDk2OTAsImV4cCI6MjA5NTM4NTY5MH0.yjO-PxGPgQrV6dVYK8OjkaaKQWfaVbTrpnl_1qCSjB8';
let sb = null;
if (window.supabase && window.supabase.createClient) { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }
else { console.error('Biblioteca Supabase não carregou.'); }

// ── DONOS da plataforma (acesso a esta sessão) — ajuste a lista aqui ──
const DONOS = ['lucas_montre@hotmail.com', 'lucas.2002louenco@gmail.com'];

// ── Planos e preços (espelham o contratar.html) ──
const PLANOS = {
  essencial: { nome: 'Essencial', preco: 20 },
  visual:    { nome: 'Visual',    preco: 40 },
  completo:  { nome: 'Completo',  preco: 60 },
};
const FORMA_PAG = { cartao: 'Cartão', pix: 'Pix', boleto: 'Boleto', transferencia: 'Transferência' };
// Situação (ciclo de vida) da contratação — manual. 'concluida' = projeto entregue (NÃO é churn); 'cancelada' = churn.
const STATUS = { ativa:{nome:'Ativa'}, concluida:{nome:'Concluída'}, pausada:{nome:'Pausada'}, cancelada:{nome:'Cancelada'} };
const PAG = { pendente:'Pendente', pago:'Pago' };
const val = c => Number(c.valor_total) || 0;

let contratacoes = [];
let emailsProjetos = new Set();
let totalProjetos = 0;
let solicitacoesList = [];        // pedidos de cancelamento / troca
let projetosById = {};            // id -> { nome_cliente, email }
let contratacaoPorEmail = {};     // email (lower) -> contratação mais recente

// fundo animado (mesmo do painel)
(function(){
  const c = document.getElementById('bg-canvas'); const ctx = c.getContext('2d'); let W, H, t = 0;
  const orbs = [ { x: 0.15, y: 0.2, r: 0.42, c: [201,162,39], a: 0.045 }, { x: 0.85, y: 0.8, r: 0.36, c: [201,162,39], a: 0.03 }, { x: 0.5, y: 0.5, r: 0.28, c: [80,100,200], a: 0.02 } ];
  function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
  function draw() { ctx.clearRect(0,0,W,H); t += 0.0025; orbs.forEach((o,i) => { const dx = Math.sin(t*0.7+i*1.3)*0.05; const dy = Math.cos(t*0.5+i*0.9)*0.04; const x=(o.x+dx)*W, y=(o.y+dy)*H; const r=o.r*Math.min(W,H); const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${o.c}, ${o.a})`); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }); requestAnimationFrame(draw); }
  window.addEventListener('resize', resize); resize(); draw();
})();

const fmtBRL = (n) => (n||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits: 0 });
const fmtData = (iso) => { if(!iso) return '—'; const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleDateString('pt-BR'); };
const dataContratacao = (c) => c.aceite_data || c.created_at || c.criado_em || null;
const esc = (t) => String(t==null?'':t).replace(/[&<>"]/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));

async function inicializar() {
  if (!sb) { document.getElementById('conteudo').innerHTML = '<div class="tabela-vazia">Erro de conexão. Recarregue a página.</div>'; return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = '/admin'; return; }
  const email = (data.session.user.email || '').toLowerCase();

  // trava: só donos da plataforma
  if (!DONOS.includes(email)) {
    document.getElementById('conteudo').innerHTML = '<div class="tabela-vazia">Esta área é exclusiva da administração da plataforma.</div>';
    setTimeout(() => window.location.href = '/admin-projetos', 1800);
    return;
  }

  // nome (se for arquiteto cadastrado) — opcional
  try {
    const { data: arq } = await sb.from('arquitetos').select('nome').eq('email', email).maybeSingle();
    if (arq && arq.nome) { document.getElementById('top-arquiteto').textContent = arq.nome; document.getElementById('saudacao').textContent = `Olá, ${arq.nome.split(' ')[0]}`; }
    else { document.getElementById('top-arquiteto').textContent = email; }
  } catch(_) {}

  // destaque no botão Atendimento quando há conversas pedindo atendimento
  try {
    const { count } = await sb.from('chat_conversas').select('id', { count: 'exact', head: true }).eq('status', 'pendente');
    const b = document.getElementById('btn-atendimento');
    if (b && count && count > 0) {
      b.innerHTML = 'Atendimento <span style="display:inline-block;min-width:16px;padding:0 5px;margin-left:6px;background:#e06b6b;color:#fff;border-radius:999px;font-size:10px;line-height:16px;text-align:center;font-weight:700;">' + count + '</span>';
      b.style.borderColor = 'rgba(224,107,107,0.55)'; b.style.color = '#e06b6b';
    }
  } catch(_) {}

  carregarDados();
}

async function carregarDados() {
  const [cRes, pRes, sRes] = await Promise.all([
    sb.from('contratacoes').select('*').order('aceite_data', { ascending: false }),
    sb.from('projetos').select('id, nome_cliente, email'),
    sb.from('solicitacoes').select('*').order('criado_em', { ascending: false }),
  ]);
  if (cRes.error) {
    document.getElementById('conteudo').innerHTML = `<div class="aviso"><strong>Não foi possível ler as contratações.</strong> Provavelmente falta liberar a leitura para a administração no Supabase. Rode a migração <code>supabase-migration-admin-dono.sql</code> e recarregue.</div>`;
    console.error(cRes.error); return;
  }
  contratacoes = (cRes.data || []).map(c => ({ ...c, status: c.status || 'ativa', pagamento_status: c.pagamento_status || 'pendente' }));
  const projs = pRes.data || [];
  totalProjetos = projs.length;
  emailsProjetos = new Set(projs.map(p => (p.email||'').toLowerCase()).filter(Boolean));
  projetosById = {};
  projs.forEach(p => { projetosById[p.id] = p; });
  // contratação mais recente por email (já vêm ordenadas desc por aceite_data)
  contratacaoPorEmail = {};
  contratacoes.forEach(c => { const k = (c.email||'').toLowerCase(); if (k && !contratacaoPorEmail[k]) contratacaoPorEmail[k] = c; });
  // solicitações (tabela pode ainda não existir — silencioso)
  solicitacoesList = (sRes && !sRes.error) ? (sRes.data || []) : [];
  render();
}

function convertida(c) { return !!(c.email && emailsProjetos.has(c.email.toLowerCase())); }
function noMes(c) { const d = dataContratacao(c); if(!d) return false; const dt = new Date(d); const now = new Date(); return dt.getMonth()===now.getMonth() && dt.getFullYear()===now.getFullYear(); }

// ── período GLOBAL (controla KPIs, planos e tabela) ──
function periodoRange() {
  const v = (document.getElementById('f-periodo')||{}).value || 'todos';
  const now = new Date(); let ini = null, fim = null;
  if (v === 'mes') { ini = new Date(now.getFullYear(), now.getMonth(), 1); fim = new Date(now.getFullYear(), now.getMonth()+1, 1); }
  else if (v === 'mes-passado') { ini = new Date(now.getFullYear(), now.getMonth()-1, 1); fim = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if (v === 'ano') { ini = new Date(now.getFullYear(), 0, 1); fim = new Date(now.getFullYear()+1, 0, 1); }
  else if (v === '30') { ini = new Date(Date.now() - 30*864e5); }
  else if (v === '90') { ini = new Date(Date.now() - 90*864e5); }
  else if (v === 'custom') {
    const a = (document.getElementById('f-ini')||{}).value, b = (document.getElementById('f-fim')||{}).value;
    if (a) ini = new Date(a + 'T00:00:00');
    if (b) fim = new Date(new Date(b + 'T00:00:00').getTime() + 864e5);
  }
  return { ini, fim };
}
function dentroPeriodo(c) {
  const d = dataContratacao(c); if (!d) return false;
  const dt = new Date(d); const { ini, fim } = periodoRange();
  if (ini && dt < ini) return false;
  if (fim && dt >= fim) return false;
  return true;
}
function rotuloPeriodo() {
  const sel = document.getElementById('f-periodo'); if (!sel) return '';
  if (sel.value === 'custom') {
    const a = (document.getElementById('f-ini')||{}).value, b = (document.getElementById('f-fim')||{}).value;
    return (a || b) ? `${a||'…'} a ${b||'…'}` : 'personalizado';
  }
  return sel.options[sel.selectedIndex].text.toLowerCase();
}
function onPeriodoChange() {
  const custom = (document.getElementById('f-periodo').value === 'custom');
  document.getElementById('f-ini').style.display = custom ? '' : 'none';
  document.getElementById('f-fim').style.display = custom ? '' : 'none';
  atualizar();
}

function render() {
  document.getElementById('conteudo').innerHTML = `
    <span id="notificacoes"></span>
    <div class="notif-sec" id="central-notif"></div>
    <div class="kpi-grid" id="kpis"></div>
    <div class="sec-titulo">Este mês vs. mês passado</div><div class="comp-grid" id="comparativo"></div>

    <div class="filtros">
      <select class="filtro-sel" id="f-plano" onchange="atualizar()"><option value="todos">Todos os planos</option><option value="essencial">Essencial</option><option value="visual">Visual</option><option value="completo">Completo</option></select>
      <select class="filtro-sel" id="f-status" onchange="atualizar()"><option value="todos">Todas as situações</option><option value="ativa">Ativas</option><option value="concluida">Concluídas</option><option value="pausada">Pausadas</option><option value="cancelada">Canceladas</option></select>
      <select class="filtro-sel" id="f-pag" onchange="atualizar()"><option value="todos">Pago e pendente</option><option value="pago">Só pagos</option><option value="pendente">Só pendentes</option></select>

// ── Central de notificações (cancelamento / troca de plano) ──
const PLANO_NOMES = { essencial: 'Essencial', visual: 'Visual', completo: 'Completo' };
const STATUS_ATIVOS = ['aberta','em_avaliacao','reembolso_proposto','reembolso_confirmado','reembolso_revisao'];
function reembStatus(s) { return s && s.valor_reembolso != null ? fmtBRL(Number(s.valor_reembolso)) : '—'; }

function renderNotificacoes() {
  const alvo = document.getElementById('central-notif'); if (!alvo) return;
  const abertas = (solicitacoesList || []).filter(s => STATUS_ATIVOS.includes(s.status));
  const cabecalho = `<div class="notif-sec-top"><div class="sec-titulo">Central de notificações</div>${abertas.length ? `<span class="notif-count">${abertas.length}</span>` : ''}</div>`;
  if (!abertas.length) { alvo.innerHTML = cabecalho + `<div class="notif-vazia">Nenhum pedido pendente no momento. Pedidos de cancelamento e troca de plano aparecem aqui.</div>`; return; }
  alvo.innerHTML = cabecalho + abertas.map(cardNotificacao).join('');
}

function cardNotificacao(s) {
  const proj = projetosById[s.projeto_id] || {};
  const nome = proj.nome_cliente || 'Cliente';
  const email = proj.email || '';
  const abrir = `<button class="notif-btn" onclick="abrirProjetoSolic('${s.projeto_id}')">Abrir projeto</button>`;

  if (s.tipo === 'alteracao_plano') {
    const corpo = `De <strong>${PLANO_NOMES[s.plano_atual] || s.plano_atual || '—'}</strong> para <strong>${PLANO_NOMES[s.plano_novo] || s.plano_novo}</strong> · diferença ${s.valor_diferenca != null ? fmtBRL(Number(s.valor_diferenca)) : '—'}`;
    return `<div class="notif-card troca">
      <div class="notif-top"><div><div class="notif-tt">↺ Pedido de troca de plano</div><div class="notif-cliente">${esc(nome)}${email ? ' · ' + esc(email) : ''}</div></div></div>
      <div class="notif-corpo">${corpo}</div>
      <div class="notif-acoes">
        <button class="notif-btn ok" onclick="resolverSolic('${s.id}','concluida')">Aprovar troca</button>
        <button class="notif-btn danger" onclick="resolverSolic('${s.id}','recusada')">Recusar</button>
        ${abrir}
      </div>
    </div>`;
  }

  // cancelamento
  const motivo = s.justificativa ? esc(s.justificativa) : '— (não informado)';
  const ct = contratacaoPorEmail[(email||'').toLowerCase()];
  const forma = ct ? (FORMA_PAG[ct.forma_pagamento] || ct.forma_pagamento || '—') : '—';
  const contaBox = `<div class="notif-conta">Reembolsar na <strong>mesma forma do pagamento</strong>: ${esc(forma)}<br>Cliente: <strong>${esc(nome)}</strong>${email ? ' · ' + esc(email) : ''}</div>`;

  let titulo = '⚠ Pedido de cancelamento', corpo = `Motivo: ${motivo}<br>Avalie o reembolso conforme o material já entregue.`, meio = '', acoes = '';

  if (s.status === 'aberta') {
    meio = `<div class="notif-valor-wrap"><span class="notif-valor-pre">Reembolso possível: R$</span><input class="notif-valor-input" id="valor-${s.id}" type="text" inputmode="numeric" placeholder="0"></div>`;
    acoes = `<button class="notif-btn ok" onclick="proporReembolso('${s.id}')">Enviar ao cliente</button>
             <button class="notif-btn danger" onclick="resolverSolic('${s.id}','recusada')">Cliente desistiu</button>${abrir}`;
  } else if (s.status === 'reembolso_proposto') {
    titulo = '⏳ Reembolso enviado ao cliente';
    corpo = `Valor proposto: <strong>${reembStatus(s)}</strong>. Aguardando o cliente seguir ou revisar.`;
    meio = `<span class="notif-badge aguardando">Aguardando confirmação</span>`;
    acoes = abrir;
  } else if (s.status === 'reembolso_confirmado') {
    titulo = '✓ Reembolso confirmado pelo cliente';
    corpo = `O cliente confirmou o reembolso de <strong>${reembStatus(s)}</strong>. Faça o reembolso e marque como resolvido.`;
    meio = `<span class="notif-badge confirmado">Cliente confirmou</span>` + contaBox;
    acoes = `<button class="notif-btn ok" onclick="resolverSolic('${s.id}','concluida')">Marcar reembolso resolvido</button>${abrir}`;
  } else if (s.status === 'reembolso_revisao') {
    titulo = '↺ Cliente pediu revisão do reembolso';
    corpo = `Valor proposto: <strong>${reembStatus(s)}</strong>. O cliente quer conversar antes de seguir.`;
    meio = `<span class="notif-badge revisao">Em revisão</span><div class="notif-valor-wrap"><span class="notif-valor-pre">Novo valor: R$</span><input class="notif-valor-input" id="valor-${s.id}" type="text" inputmode="numeric" placeholder="${s.valor_reembolso != null ? Number(s.valor_reembolso) : '0'}"></div>`;
    acoes = `<button class="notif-btn ok" onclick="proporReembolso('${s.id}')">Reenviar valor</button>
             <button class="notif-btn" onclick="window.location.href='/admin-atendimento'">Ir ao atendimento</button>${abrir}`;
  }

  return `<div class="notif-card">
    <div class="notif-top"><div><div class="notif-tt">${titulo}</div><div class="notif-cliente">${esc(nome)}${email ? ' · ' + esc(email) : ''}</div></div></div>
    <div class="notif-corpo">${corpo}</div>
    ${meio}
    <div class="notif-acoes">${acoes}</div>
  </div>`;
}

function parseValor(raw) {
  const limpo = String(raw || '').replace(/[^\d.,-]/g, '').replace(/\./g, '').replace(',', '.');
  const v = parseFloat(limpo);
  return isNaN(v) ? null : v;
}

async function proporReembolso(id) {
  const input = document.getElementById('valor-' + id);
  const v = parseValor(input && input.value);
  if (v == null || v < 0) { mostrarToast('Informe um valor de reembolso válido.'); return; }
  const { error } = await sb.from('solicitacoes').update({ status: 'reembolso_proposto', valor_reembolso: v, atualizado_em: new Date().toISOString() }).eq('id', id);
  if (error) { mostrarToast('Não foi possível enviar.'); console.error(error); return; }
  mostrarToast('Reembolso de ' + fmtBRL(v) + ' enviado ao cliente.');
  await recarregarSolic();
}

async function resolverSolic(id, status) {
  const { error } = await sb.from('solicitacoes').update({ status, atualizado_em: new Date().toISOString() }).eq('id', id);
  if (error) { mostrarToast('Não foi possível atualizar.'); console.error(error); return; }
  mostrarToast('Solicitação atualizada.');
  await recarregarSolic();
}

async function recarregarSolic() {
  const { data, error } = await sb.from('solicitacoes').select('*').order('criado_em', { ascending: false });
  if (!error) solicitacoesList = data || [];
  renderNotificacoes();
}

function abrirProjetoSolic(projetoId) { window.location.href = '/admin-projeto?id=' + projetoId; }

function doMes(c, offset) {
  const d = dataContratacao(c); if (!d) return false;
  const dt = new Date(d); const now = new Date();
  const ini = new Date(now.getFullYear(), now.getMonth()+offset, 1);
  const fim = new Date(now.getFullYear(), now.getMonth()+offset+1, 1);
  return dt >= ini && dt < fim;
}
function dadosMensais() {
  const arr = []; const now = new Date();
  for (let i=11; i>=0; i--) {
    const m = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const rows = contratacoes.filter(c => { const d = dataContratacao(c); if(!d) return false; const dt = new Date(d); return dt.getFullYear()===m.getFullYear() && dt.getMonth()===m.getMonth(); });
    arr.push({ label: m.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''), n: rows.length, rec: rows.reduce((s,c)=>s+val(c),0) });
  }
  return arr;
}
function cardComparativo(label, atual, anterior, moeda) {
  const v = moeda ? fmtBRL(atual) : atual;
  let delta, cls, seta;
  if (anterior === 0) { delta = atual>0 ? '+100%' : '—'; cls = atual>0?'up':'flat'; seta = atual>0?'↑':'→'; }
  else { const p = Math.round(((atual-anterior)/anterior)*100); cls = p>0?'up':(p<0?'down':'flat'); seta = p>0?'↑':(p<0?'↓':'→'); delta = (p>0?'+':'')+p+'%'; }
  const prev = moeda ? fmtBRL(anterior) : anterior;
  return `<div class="comp-card"><div class="comp-label">${label} — este mês</div><div class="comp-valor">${v}</div><div class="comp-delta ${cls}">${seta} ${delta}<span class="comp-prev">vs ${prev} mês passado</span></div></div>`;
}

function atualizar() {
  const base = contratacoes.filter(dentroPeriodo);
  const total = base.length;
  const receita = base.reduce((s,c)=> s + val(c), 0);
  const ticket = total ? receita/total : 0;
  const recebido = base.filter(c=> c.pagamento_status==='pago').reduce((s,c)=> s + val(c), 0);
  const aReceber = base.filter(c=> c.status!=='cancelada' && c.pagamento_status!=='pago').reduce((s,c)=> s + val(c), 0);
  const pctReceb = receita ? Math.round((recebido/receita)*100) : 0;

  const st = {}; for (const k in STATUS) st[k] = { n:0, rec:0 };
  base.forEach(c => { const k = STATUS[c.status] ? c.status : 'ativa'; st[k].n++; st[k].rec += val(c); });
  const churn = total ? Math.round((st.cancelada.n/total)*100) : 0;
  const canceladoRec = st.cancelada.rec;

  const kpis = document.getElementById('kpis');
  if (kpis) kpis.innerHTML = `
    <div class="kpi"><div class="kpi-label">Contratações</div><div class="kpi-valor">${total}</div><div class="kpi-sub">${rotuloPeriodo()}</div></div>
    <div class="kpi"><div class="kpi-label">Receita contratada</div><div class="kpi-valor">${fmtBRL(receita)}</div><div class="kpi-sub">ticket médio <strong>${fmtBRL(ticket)}</strong></div></div>
    <div class="kpi"><div class="kpi-label">Recebido</div><div class="kpi-valor">${fmtBRL(recebido)}</div><div class="kpi-sub"><strong>${pctReceb}%</strong> do contratado</div></div>
    <div class="kpi"><div class="kpi-label">A receber</div><div class="kpi-valor">${fmtBRL(aReceber)}</div><div class="kpi-sub">cancelado: ${fmtBRL(canceladoRec)}</div></div>`;

  const cm = contratacoes.filter(c=>doMes(c,0)), cp = contratacoes.filter(c=>doMes(c,-1));
  const recM = cm.reduce((s,c)=>s+val(c),0), recP = cp.reduce((s,c)=>s+val(c),0);
  const comp = document.getElementById('comparativo');
  if (comp) comp.innerHTML = cardComparativo('Contratações', cm.length, cp.length, false) + cardComparativo('Receita', recM, recP, true);

  const elSt = document.getElementById('status');
  if (elSt) elSt.innerHTML = Object.keys(STATUS).map(k => `<div class="status-card ${k}"><div class="status-nome">${STATUS[k].nome}</div><div class="status-n">${st[k].n}</div><div class="status-rec">${fmtBRL(st[k].rec)}</div></div>`).join('');
  const elChurn = document.getElementById('churn');
  if (elChurn) elChurn.innerHTML = `Churn (canceladas): <strong>${churn}%</strong> · receita perdida ${fmtBRL(canceladoRec)}`;

  const dm = dadosMensais(); const max = Math.max(1, ...dm.map(x=>x.rec));
  const chart = document.getElementById('chart');
  if (chart) chart.innerHTML = `<div class="chart-bars">` + dm.map(x => `<div class="chart-col"><div class="chart-val">${x.n||''}</div><div class="chart-bar" style="height:${Math.round((x.rec/max)*100)}%" title="${x.label}: ${fmtBRL(x.rec)} · ${x.n} contratações"></div><div class="chart-xlbl">${x.label}</div></div>`).join('') + `</div>`;

  const porPlano = {};
  for (const k in PLANOS) porPlano[k] = { n:0, rec:0 };
  base.forEach(c => { const k = c.plano; if (porPlano[k]) { porPlano[k].n++; porPlano[k].rec += val(c); } });
  const planos = document.getElementById('planos');
  if (planos) planos.innerHTML = Object.keys(PLANOS).map(k => {
    const p = PLANOS[k]; const d = porPlano[k]; const pct = total ? Math.round((d.n/total)*100) : 0;
    return `<div class="plano-card"><div class="plano-card-top"><span class="plano-card-nome">${p.nome}</span><span class="plano-card-preco">R$ ${p.preco}/m²</span></div><div class="plano-card-n">${d.n}</div><div class="plano-card-rec">${fmtBRL(d.rec)} · ${pct}% das vendas</div><div class="plano-bar"><div class="plano-bar-fill" style="width:${pct}%"></div></div></div>`;
  }).join('');

  renderTabela();
}

function contratacoesFiltradas() {
  const plano = (document.getElementById('f-plano')||{}).value || 'todos';
  const status = (document.getElementById('f-status')||{}).value || 'todos';
  const pag = (document.getElementById('f-pag')||{}).value || 'todos';
  const busca = ((document.getElementById('f-busca')||{}).value || '').toLowerCase().trim();
  return contratacoes.filter(c => {
    if (!dentroPeriodo(c)) return false;
    if (plano !== 'todos' && c.plano !== plano) return false;
    if (status !== 'todos' && c.status !== status) return false;
    if (pag !== 'todos' && c.pagamento_status !== pag) return false;
    if (busca) {
      const alvo = `${c.nome||''} ${c.email||''} ${c.empreendimento||''}`.toLowerCase();
      if (!alvo.includes(busca)) return false;
    }
    return true;
  });
}

function renderTabela() {
  const wrap = document.getElementById('tabela-wrap'); if (!wrap) return;
  const linhas = contratacoesFiltradas();
  if (!linhas.length) { wrap.innerHTML = '<div class="tabela-vazia">Nenhuma contratação para os filtros selecionados.</div>'; return; }
  const corpo = linhas.map(c => {
    const plano = PLANOS[c.plano] ? PLANOS[c.plano].nome : (c.plano || '—');
    const forma = FORMA_PAG[c.forma_pagamento] || c.forma_pagamento || '—';
    const parc = c.parcelas ? ` ${c.parcelas}x` : '';
    const optsPag = Object.keys(PAG).map(k=>`<option value="${k}" ${c.pagamento_status===k?'selected':''}>${PAG[k]}</option>`).join('');
    const optsSt = Object.keys(STATUS).map(k=>`<option value="${k}" ${c.status===k?'selected':''}>${STATUS[k].nome}</option>`).join('');
    return `<tr>
      <td>${fmtData(dataContratacao(c))}</td>
      <td><div class="cel-cliente">${esc(c.nome)||'—'}</div><div class="cel-sub">${esc(c.email)||''}</div></td>
      <td>${esc(c.empreendimento)||'—'}</td>
      <td>${c.metragem ? esc(c.metragem)+' m²' : '—'}</td>
      <td><span class="tag-plano">${esc(plano)}</span></td>
      <td class="cel-valor">${fmtBRL(c.valor_total)}<div class="cel-sub">${esc(forma)}${parc}</div></td>
      <td><select class="sel-inline pg-${c.pagamento_status}" onchange="setPagamento('${c.id}', this.value)">${optsPag}</select></td>
      <td><select class="sel-inline st-${c.status}" onchange="setStatus('${c.id}', this.value)">${optsSt}</select></td>
    </tr>`;
  }).join('');
  wrap.innerHTML = `<table class="contratacoes"><thead><tr>
    <th>Data</th><th>Cliente</th><th>Empreendimento</th><th>Metragem</th><th>Plano</th><th>Valor</th><th>Pago?</th><th>Situação</th>
  </tr></thead><tbody>${corpo}</tbody></table>`;
}

function exportarCSV() {
  const linhas = contratacoesFiltradas();
  if (!linhas.length) { mostrarToast('Nada para exportar'); return; }
  const cab = ['Data','Nome','Email','WhatsApp','Empreendimento','Metragem','Plano','Valor','Forma','Pagamento','Parcelas','Situacao'];
  const rows = linhas.map(c => [
    fmtData(dataContratacao(c)), c.nome||'', c.email||'', c.whatsapp||'', c.empreendimento||'',
    c.metragem||'', (PLANOS[c.plano]?PLANOS[c.plano].nome:c.plano)||'', c.valor_total||'',
    FORMA_PAG[c.forma_pagamento]||c.forma_pagamento||'', PAG[c.pagamento_status]||c.pagamento_status||'', c.parcelas||'', (STATUS[c.status]?STATUS[c.status].nome:c.status)||''
  ]);
  const csv = [cab, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(';')).join('\n');
  const blob = new Blob(["﻿"+csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `contratacoes-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

async function setStatus(id, valor) {
  const c = contratacoes.find(x => String(x.id)===String(id)); if (c) c.status = valor;
  atualizar();
  if (sb && id) { const { error } = await sb.from('contratacoes').update({ status: valor }).eq('id', id); mostrarToast(error ? 'Erro ao salvar situação' : 'Situação atualizada'); }
}
async function setPagamento(id, valor) {
  const c = contratacoes.find(x => String(x.id)===String(id)); if (c) c.pagamento_status = valor;
  atualizar();
  if (sb && id) { const { error } = await sb.from('contratacoes').update({ pagamento_status: valor }).eq('id', id); mostrarToast(error ? 'Erro ao salvar pagamento' : 'Pagamento atualizado'); }
}
async function fazerLogout() { await sb.auth.signOut(); window.location.href = '/admin'; }
function mostrarToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('vis'); setTimeout(() => toast.classList.remove('vis'), 3000); }

inicializar();
</script>
