<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Projetos — Painel Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black:#08080a; --dark:#111113; --card:#15151a; --card2:#1a1a20;
  --gold:#C9A227; --gold-light:#e2b93b; --gold-dim:rgba(201,162,39,0.08); --gold-mid:rgba(201,162,39,0.22);
  --white:#f5f4f0; --off:#e0ddd6; --muted:#7a7870; --muted2:#4a4845;
  --border:rgba(201,162,39,0.14); --border2:rgba(255,255,255,0.06);
  --green:#50C878; --green-dim:rgba(80,200,120,0.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--black); color: var(--off); font-family: 'Outfit', sans-serif; font-weight: 300; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
#bg-canvas { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; }
.noise { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.025; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E"); background-size: 200px; }
.top-bar { position: fixed; top: 24px; left: 28px; right: 28px; height: 60px; background: rgba(255,255,255,0.06); backdrop-filter: blur(32px) saturate(160%); -webkit-backdrop-filter: blur(32px) saturate(160%); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; box-shadow: 0 1px 0 rgba(255,255,255,0.07) inset, 0 18px 44px rgba(0,0,0,0.45), 0 0 24px rgba(201,162,39,0.04); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 300; }
.top-left { display: flex; align-items: center; gap: 12px; }
.top-logo-img { height: 30px; width: auto; display: block; }
.top-painel-badge { font-size: 9px; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--gold-dim); }
.top-right { display: flex; align-items: center; gap: 16px; }
.top-arquiteto { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.btn-logout { background: transparent; border: 1px solid var(--border2); border-radius: 10px; padding: 6px 14px; font-size: 11px; color: var(--muted); cursor: pointer; font-family: 'Outfit', sans-serif; transition: all 0.2s; letter-spacing: 0.06em; text-transform: uppercase; }
.btn-logout:hover { color: var(--gold); border-color: var(--border); }
.main { max-width: 1100px; margin: 0 auto; padding: 130px 28px 80px; position: relative; z-index: 2; }
.page-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 16px; }
.page-titulo-wrap { display: flex; flex-direction: column; gap: 6px; }
.page-saudacao { font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.page-titulo { font-family: 'Quicksand', sans-serif; font-size: 30px; font-weight: 700; color: var(--white); letter-spacing: -0.01em; }
.btn-novo { display: flex; align-items: center; gap: 8px; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; border-radius: 12px; padding: 11px 20px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; color: var(--black); cursor: pointer; transition: all 0.3s; letter-spacing: 0.04em; }
.btn-novo:hover { transform: translateY(-2px); box-shadow: 0 12px 24px rgba(201,162,39,0.2); }
.busca-wrap { margin-bottom: 32px; }
.busca-input { width: 100%; max-width: 360px; background: rgba(255,255,255,0.035); border: 1px solid var(--border2); border-radius: 12px; padding: 11px 16px; font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--white); outline: none; transition: border-color 0.2s; }
.busca-input:focus { border-color: var(--gold-mid); }
.busca-input::placeholder { color: var(--muted2); }
.projetos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.projeto-card { background: rgba(255,255,255,0.035); backdrop-filter: blur(8px); border: 1px solid var(--border2); border-radius: 18px; padding: 24px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
.projeto-card:hover { border-color: var(--gold-mid); background: rgba(255,255,255,0.05); transform: translateY(-3px); box-shadow: 0 16px 32px rgba(0,0,0,0.3); }
.projeto-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
.projeto-nome { font-family: 'Quicksand', sans-serif; font-size: 19px; font-weight: 600; color: var(--white); margin-bottom: 4px; line-height: 1.2; }
.projeto-endereco { font-size: 12px; color: var(--muted); line-height: 1.4; }
.projeto-etapa-badge { flex-shrink: 0; font-size: 10px; color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--gold-dim); white-space: nowrap; }
.projeto-progresso { margin-top: 18px; }
.progresso-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 8px; }
.progresso-bar { height: 6px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; }
.progresso-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold-light)); border-radius: 4px; transition: width 0.6s ease; }
.projeto-pips { display: flex; gap: 5px; margin-top: 16px; }
.pip { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); }
.pip.ativa { background: var(--gold); }
.pip.concluida { background: rgba(80,200,120,0.5); }
.loading { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 13px; }
.spinner { display: inline-block; width: 26px; height: 26px; border: 2px solid var(--border2); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.vazio { text-align: center; padding: 80px 20px; }
.vazio-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
.vazio-titulo { font-family: 'Quicksand', sans-serif; font-size: 18px; color: var(--off); margin-bottom: 8px; }
.vazio-txt { font-size: 13px; color: var(--muted); line-height: 1.6; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 500; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.vis { display: flex; }
.modal { background: var(--card2); border: 1px solid var(--border); border-radius: 20px; padding: 32px; max-width: 440px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
.modal-titulo { font-family: 'Quicksand', sans-serif; font-size: 20px; font-weight: 600; color: var(--white); margin-bottom: 24px; }
.modal-field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.modal-label { font-size: 11px; font-weight: 500; color: var(--white); letter-spacing: 0.06em; text-transform: uppercase; }
.modal-input { background: rgba(255,255,255,0.04); border: 1px solid var(--border2); border-radius: 11px; padding: 12px 14px; font-family: 'Outfit', sans-serif; font-size: 14px; color: var(--white); outline: none; transition: border-color 0.2s; }
.modal-input:focus { border-color: var(--gold-mid); }
.modal-input::placeholder { color: var(--muted2); }
.modal-actions { display: flex; gap: 12px; margin-top: 24px; }
.btn-cancelar { flex: 1; background: transparent; border: 1px solid var(--border2); border-radius: 11px; padding: 12px; font-family: 'Outfit', sans-serif; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.2s; }
.btn-cancelar:hover { color: var(--off); border-color: var(--muted2); }
.btn-salvar { flex: 1; background: linear-gradient(135deg, var(--gold), var(--gold-light)); border: none; border-radius: 11px; padding: 12px; font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 500; color: var(--black); cursor: pointer; transition: all 0.3s; }
.btn-salvar:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(201,162,39,0.2); }
.btn-salvar:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: rgba(20,20,24,0.96); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 11px; padding: 13px 22px; font-size: 12px; color: var(--off); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; white-space: nowrap; }
.toast.vis { opacity: 1; }
</style>
</head>

let todosProjetos = [];
(function(){
  const c = document.getElementById('bg-canvas'); const ctx = c.getContext('2d'); let W, H, t = 0;
  const orbs = [ { x: 0.15, y: 0.2, r: 0.42, c: [201,162,39], a: 0.045 }, { x: 0.85, y: 0.8, r: 0.36, c: [201,162,39], a: 0.03 }, { x: 0.5, y: 0.5, r: 0.28, c: [80,100,200], a: 0.02 } ];
  function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
  function draw() { ctx.clearRect(0,0,W,H); t += 0.0025; orbs.forEach((o,i) => { const dx = Math.sin(t*0.7+i*1.3)*0.05; const dy = Math.cos(t*0.5+i*0.9)*0.04; const x=(o.x+dx)*W, y=(o.y+dy)*H; const r=o.r*Math.min(W,H); const g=ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${o.c}, ${o.a})`); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); }); requestAnimationFrame(draw); }

})();
let arquitetoAtual = null;
async function inicializar() {
  if (!sb) { mostrarToast('Erro de conexão. Recarregue a página.'); return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = '/admin'; return; }
  const email = data.session.user.email;
  const { data: arq, error } = await sb.from('arquitetos').select('nome').eq('email', email).single();
  if (error || !arq) { await sb.auth.signOut(); window.location.href = '/admin'; return; }
  arquitetoAtual = arq;
  document.getElementById('top-arquiteto').textContent = arq.nome;
  document.getElementById('saudacao').textContent = `Olá, ${arq.nome.split(' ')[0]}`;
  carregarProjetos();
}
async function carregarProjetos() {
  const { data: projetos, error } = await sb.from('projetos').select('id, nome_cliente, endereco, etapa_atual').order('criado_em', { ascending: false });
  if (error) {
    document.getElementById('conteudo').innerHTML = `<div class="vazio"><div class="vazio-icon">⚠</div><div class="vazio-titulo">Erro ao carregar</div><div class="vazio-txt">Não foi possível buscar os projetos.<br>Tente recarregar a página.</div></div>`;
    console.error(error); return;
  }
  todosProjetos = projetos || [];
  renderProjetos(todosProjetos);
}
function renderProjetos(projetos) {

    return;
  }
  const grid = document.createElement('div'); grid.className = 'projetos-grid';
  projetos.forEach(p => {
    const etapa = p.etapa_atual || 1; const pct = Math.round((etapa/5)*100);
    let pipsHtml = '';
    for (let i = 1; i <= 5; i++) { let cls = 'pip'; if (i < etapa) cls += ' concluida'; else if (i === etapa) cls += ' ativa'; pipsHtml += `<div class="${cls}"></div>`; }
    const card = document.createElement('div'); card.className = 'projeto-card'; card.onclick = () => abrirProjeto(p.id);
    card.innerHTML = `<div class="projeto-card-top"><div><div class="projeto-nome">${p.nome_cliente || 'Sem nome'}</div><div class="projeto-endereco">${p.endereco || 'Endereço não cadastrado'}</div></div><div class="projeto-etapa-badge">Etapa ${etapa}</div></div><div class="projeto-progresso"><div class="progresso-label"><span>${ETAPAS_NOMES[etapa-1]||''}</span><span>${pct}%</span></div><div class="progresso-bar"><div class="progresso-fill" style="width: ${pct}%"></div></div></div><div class="projeto-pips">${pipsHtml}</div>`;
    grid.appendChild(card);
  });
  conteudo.innerHTML = ''; conteudo.appendChild(grid);
}
function filtrarProjetos() {
  const termo = document.getElementById('busca').value.toLowerCase().trim();
  if (!termo) { renderProjetos(todosProjetos); return; }
  const filtrados = todosProjetos.filter(p => (p.nome_cliente||'').toLowerCase().includes(termo) || (p.endereco||'').toLowerCase().includes(termo));
  renderProjetos(filtrados);
}
function abrirProjeto(id) { window.location.href = `/admin-projeto?id=${id}`; }
function abrirModal() { document.getElementById('modal-overlay').classList.add('vis'); }
function fecharModal() { document.getElementById('modal-overlay').classList.remove('vis'); document.getElementById('novo-nome').value=''; document.getElementById('novo-email').value=''; document.getElementById('novo-endereco').value=''; }
async function salvarProjeto() {
  const nome = document.getElementById('novo-nome').value.trim();
  const email = document.getElementById('novo-email').value.trim();
  const endereco = document.getElementById('novo-endereco').value.trim();
  const btn = document.getElementById('btn-salvar');
  if (!nome) { mostrarToast('Informe o nome do cliente'); return; }
  btn.disabled = true; btn.textContent = 'Criando...';
  const { data, error } = await sb.from('projetos').insert({ nome_cliente: nome, email: email || null, endereco: endereco || null, etapa_atual: 1 }).select().single();
  btn.disabled = false; btn.textContent = 'Criar Projeto';
  if (error) { mostrarToast('Erro ao criar projeto'); console.error(error); return; }
  fecharModal(); mostrarToast('Projeto criado com sucesso!'); carregarProjetos();
}
async function fazerLogout() { await sb.auth.signOut(); window.location.href = '/admin'; }
function mostrarToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('vis'); setTimeout(() => toast.classList.remove('vis'), 3500); }
document.getElementById('modal-overlay').addEventListener('click', (e) => { if (e.target.id === 'modal-overlay') fecharModal(); });
inicializar();
</script>
