<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Guide Arquitetura</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --black:#08080a;
  --dark:#111113;
  --card:#15151a;
  --card2:#1a1a20;
  --gold:#C9A227;
  --gold-light:#e2b93b;
  --gold-dim:rgba(201,162,39,0.08);
  --gold-mid:rgba(201,162,39,0.22);
  --white:#f5f4f0;
  --off:#e0ddd6;
  --muted:#7a7870;
  --muted2:#4a4845;
  --border:rgba(201,162,39,0.14);
  --border2:rgba(255,255,255,0.06);
  --red:rgba(220,80,80,0.9);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--black);
  color: var(--off);
  font-family: 'Outfit', sans-serif;
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  height: 100%;
}

/* FUNDO ANIMADO COM BLOBS */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
}

.noise {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.025;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
  background-size: 200px;
}

/* CONTAINER */
body {
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.login-wrap {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 360px;
  padding: 20px;
}

/* CARD GLASSMORPHISM */
.login-card {
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(32px) saturate(160%);
  -webkit-backdrop-filter: blur(32px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 28px;
  padding: 48px 32px;
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.07) inset, 0 18px 44px rgba(0, 0, 0, 0.45), 0 0 24px rgba(201, 162, 39, 0.04);
}

/* LOGO */
.login-logo {
  text-align: center;
  margin-bottom: 40px;
}

.login-logo-txt {
  font-family: 'Quicksand', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}

.login-subtxt {
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* TITULO */
.login-titulo {
  font-family: 'Quicksand', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--white);
  margin-bottom: 32px;
  text-align: center;
  line-height: 1.2;
}

/* FORM */
.login-form {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-bottom: 32px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.form-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--white);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.form-input {
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 13px 16px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 300;
  color: var(--white);
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

.form-input:focus {
  border-color: var(--gold-mid);
  background: rgba(255, 255, 255, 0.05);
}

.form-input::placeholder {
  color: var(--muted2);
  font-style: italic;
}

/* ERRO */
.form-erro {
  display: none;
  font-size: 12px;
  color: var(--red);
  margin-top: 8px;
  line-height: 1.5;
}

.form-erro.vis {
  display: block;
}

/* BOTÃO */
.btn-login {
  background: linear-gradient(135deg, var(--gold), var(--gold-light));
  border: none;
  border-radius: 14px;
  padding: 13px 16px;
  font-family: 'Outfit', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--black);
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-top: 8px;
}

.btn-login:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 24px rgba(201, 162, 39, 0.2);
}

.btn-login:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* FOOTER */
.login-footer {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.login-footer a {
  color: var(--gold);
  text-decoration: none;
  transition: color 0.2s;
}

.login-footer a:hover {
  color: var(--gold-light);
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 24px;
  left: 24px;
  background: rgba(20, 20, 24, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 20px;
  font-size: 12px;
  color: var(--off);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.toast.vis {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="noise"></div>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-txt">Guide</div>
      <div class="login-subtxt">Arquitetura</div>
    </div>

    <div class="login-titulo">Seu Projeto</div>

    <form class="login-form" onsubmit="handleLogin(event)">
      <div class="form-field">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="email-input" placeholder="seu@email.com" required>
      </div>

      <div class="form-field">
        <label class="form-label">Senha</label>
        <input type="password" class="form-input" id="senha-input" placeholder="••••••••" required>
        <div class="form-erro" id="login-erro"></div>
      </div>

      <button type="submit" class="btn-login" id="btn-login">Entrar</button>
    </form>

    <div class="login-footer">
      <p>Primeira vez aqui?</p>
      <p>Você receberá um email de acesso<br>após contratar um projeto com a Guide.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- SUPABASE JS CLIENT (CDN) -->
<script async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ─────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────

const SUPABASE_URL = 'https://fkbvwcppbjlodtnjrmbw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrYnZ3Y3BwYmpsbG9kdG5qcm1idyIsInJvbGUiOiJhbm9uIiwiaWF0IjogMTczNzc0MjQxMCwiZXhwIjogMTg5NzA2NjQxMH0.UBvqHQZcxGJ8V3pYqL9kL7fXKHzfbL5xKGJt3z4cQ8E';

const { createClient } = window.supabase;
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─────────────────────────────────────────────────────────────
// FUNDO ANIMADO
// ─────────────────────────────────────────────────────────────

(function(){
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let W, H, t = 0;
  
  const orbs = [
    { x: 0.25, y: 0.3, r: 0.45, c: [201, 162, 39], a: 0.045 },
    { x: 0.75, y: 0.7, r: 0.38, c: [201, 162, 39], a: 0.032 },
    { x: 0.5, y: 0.5, r: 0.32, c: [80, 100, 200], a: 0.025 },
  ];
  
  function resize() {
    W = c.width = innerWidth;
    H = c.height = innerHeight;
  }
  
  function draw() {
    ctx.clearRect(0, 0, W, H);
    t += 0.0025;
    
    orbs.forEach((o, i) => {
      const dx = Math.sin(t * 0.7 + i * 1.3) * 0.05;
      const dy = Math.cos(t * 0.5 + i * 0.9) * 0.04;
      const x = (o.x + dx) * W;
      const y = (o.y + dy) * H;
      const r = o.r * Math.min(W, H);
      
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${o.c}, ${o.a})`);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    });
    
    requestAnimationFrame(draw);
  }
  
  window.addEventListener('resize', resize);
  resize();
  draw();
})();

// ─────────────────────────────────────────────────────────────
// LOGIN
// ─────────────────────────────────────────────────────────────

async function handleLogin(event) {
  event.preventDefault();
  
  const emailInput = document.getElementById('email-input');
  const senhaInput = document.getElementById('senha-input');
  const btnLogin = document.getElementById('btn-login');
  const erroDiv = document.getElementById('login-erro');
  
  const email = emailInput.value.trim();
  const senha = senhaInput.value;
  
  if (!email || !senha) {
    mostrarErro('Preencha email e senha', erroDiv);
    return;
  }
  
  btnLogin.disabled = true;
  btnLogin.textContent = 'Entrando...';
  
  try {
    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password: senha,
    });
    
    if (error) {
      mostrarErro(error.message || 'Erro ao fazer login', erroDiv);
      btnLogin.disabled = false;
      btnLogin.textContent = 'Entrar';
      return;
    }
    
    // Login bem-sucedido
    window.location.href = '/meu-projeto';
    
  } catch (err) {
    mostrarErro('Erro ao conectar. Tente novamente.', erroDiv);
    btnLogin.disabled = false;
    btnLogin.textContent = 'Entrar';
  }
}

function mostrarErro(msg, erroDiv) {
  erroDiv.textContent = msg;
  erroDiv.classList.add('vis');
  setTimeout(() => {
    erroDiv.classList.remove('vis');
  }, 5000);
}

// ─────────────────────────────────────────────────────────────
// CHECK SE JÁ ESTÁ LOGADO
// ─────────────────────────────────────────────────────────────

(async () => {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    window.location.href = '/meu-projeto';
  }
})();
</script>

</body>
</html>
