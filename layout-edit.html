<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Layout — Painel Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Outfit:wght@200;300;400;500&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --black:#08080a;--dark:#111113;--card:#15151a;--card2:#1a1a20;
  --gold:#C9A227;--gold-light:#e2b93b;--gold-dim:rgba(201,162,39,0.08);
  --gold-mid:rgba(201,162,39,0.22);
  --white:#f5f4f0;--off:#e0ddd6;--muted:#7a7870;--muted2:#4a4845;
  --border:rgba(201,162,39,0.14);--border2:rgba(201,162,39,0.07);
  --green:rgba(80,200,120,0.9);--green-dim:rgba(80,200,120,0.08);--green-border:rgba(80,200,120,0.28);
  --red:rgba(208,80,80,0.9);--red-dim:rgba(208,80,80,0.08);--red-border:rgba(208,80,80,0.3);
}
body{background:var(--black);color:var(--white);font-family:'Outfit',sans-serif;font-weight:300;line-height:1.7;overflow-x:hidden;}

/* TOP BAR */
.top-bar{position:fixed;top:0;left:0;right:0;height:58px;background:rgba(8,8,10,0.93);backdrop-filter:blur(24px);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:200;gap:14px;}
.top-left{display:flex;align-items:center;gap:14px;min-width:0;}
.btn-voltar{background:transparent;border:1px solid var(--border2);border-radius:9px;padding:6px 13px;font-family:'Outfit',sans-serif;font-size:11px;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-voltar:hover{color:var(--gold);border-color:var(--border);}
.top-cliente{display:flex;flex-direction:column;min-width:0;}
.top-nome{font-family:'Quicksand',sans-serif;font-size:14px;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top-sub{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.top-right{display:flex;align-items:center;gap:10px;}
.modo-tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);background:var(--gold-dim);border:1px solid var(--gold-mid);border-radius:20px;padding:5px 12px;white-space:nowrap;}
.btn-preview{background:transparent;border:1px solid var(--border2);border-radius:9px;padding:6px 13px;font-family:'Outfit',sans-serif;font-size:11px;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;}
.btn-preview:hover{color:var(--gold);border-color:var(--border);}

/* DOC */
.doc{max-width:980px;margin:0 auto;padding:96px 40px 140px;}
.doc-header{margin-bottom:44px;}
.doc-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.doc-titulo{font-family:'Cormorant Garamond',serif;font-size:44px;font-weight:300;color:var(--white);line-height:1.1;}
.doc-sub{font-size:13px;color:var(--muted);margin-top:10px;max-width:560px;line-height:1.6;}

/* RESUMO DO CLIENTE */
.resumo-cliente{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:44px;}
.resumo-item{background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:14px 16px;}
.resumo-item.alerta{border-color:var(--gold-mid);background:var(--gold-dim);}
.resumo-num{font-family:'Quicksand',sans-serif;font-size:20px;font-weight:600;color:var(--white);line-height:1.2;}
.resumo-item.alerta .resumo-num{color:var(--gold);}
.resumo-lbl{font-size:10px;color:var(--muted);letter-spacing:.04em;margin-top:3px;line-height:1.4;}

/* BADGE DE STATUS DO AMBIENTE */
.amb-badge{font-size:10px;letter-spacing:.05em;padding:4px 10px;border-radius:20px;border:1px solid var(--border2);color:var(--muted);white-space:nowrap;flex-shrink:0;}
.amb-badge.ok{border-color:var(--green-border);color:var(--green);background:var(--green-dim);}
.amb-badge.rev{border-color:var(--red-border);color:var(--red);background:var(--red-dim);}

/* AMBIENTES */
.ambiente-bloco{margin-bottom:64px;}
.ambiente-header{display:flex;align-items:center;gap:18px;margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border2);}
.ambiente-num{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:300;color:var(--gold);opacity:.35;line-height:1;min-width:56px;}
.ambiente-info{flex:1;min-width:0;}
.ambiente-titulo{font-size:19px;font-weight:400;color:var(--white);background:transparent;border:1px solid transparent;border-radius:8px;padding:3px 8px;margin-left:-8px;width:100%;font-family:'Outfit',sans-serif;transition:all .2s;}
.ambiente-titulo:hover{border-color:var(--border2);}
.ambiente-titulo:focus{outline:none;border-color:var(--gold-mid);background:var(--card);}
.ambiente-acoes{display:flex;gap:6px;flex-shrink:0;}
.btn-mini{background:transparent;border:1px solid var(--border2);border-radius:8px;width:30px;height:30px;color:var(--muted);cursor:pointer;font-size:13px;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.btn-mini:hover{color:var(--gold);border-color:var(--gold-mid);}
.btn-mini.perigo:hover{color:var(--red);border-color:var(--red-border);}
.btn-mini:disabled{opacity:.25;cursor:not-allowed;}

/* OPÇÕES */
.opcoes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:14px;}
.opcao-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:20px;transition:border-color .25s;}
.opcao-card:hover{border-color:var(--gold-mid);}
.opcao-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;}
.opcao-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:500;background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 7px;margin-left:-7px;font-family:'Outfit',sans-serif;flex:1;min-width:0;transition:all .2s;}
.opcao-tag:hover{border-color:var(--border2);}
.opcao-tag:focus{outline:none;border-color:var(--gold-mid);background:var(--card2);}

.bloco-label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted2);margin:16px 0 8px;display:flex;align-items:center;justify-content:space-between;}
.bloco-label span{color:var(--muted2);}

/* IMAGENS */
.img-tira{display:flex;flex-wrap:wrap;gap:7px;}
.img-mini{width:74px;height:56px;border-radius:7px;overflow:hidden;border:1px solid var(--border2);position:relative;background:var(--card2);flex-shrink:0;}
.img-mini img{width:100%;height:100%;object-fit:cover;display:block;}
.img-mini-del{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:50%;background:rgba(8,8,10,.85);border:1px solid var(--border2);color:var(--muted);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;}
.img-mini-del:hover{color:var(--red);border-color:var(--red-border);}
.img-add{width:74px;height:56px;border-radius:7px;border:1px dashed var(--muted2);background:transparent;color:var(--muted2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
.img-add:hover{border-color:var(--gold-mid);color:var(--gold);}

/* LISTAS (características / diferenciais) */
.lista-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
.lista-item::before{content:'–';color:var(--gold);opacity:.5;flex-shrink:0;font-size:12px;}
.lista-input{flex:1;background:transparent;border:1px solid transparent;border-radius:7px;padding:4px 8px;font-family:'Outfit',sans-serif;font-size:12px;color:var(--off);font-weight:300;transition:all .2s;min-width:0;}
.lista-input:hover{border-color:var(--border2);}
.lista-input:focus{outline:none;border-color:var(--gold-mid);background:var(--card2);}
.lista-del{background:transparent;border:none;color:var(--muted2);font-size:11px;cursor:pointer;padding:2px 5px;flex-shrink:0;line-height:1;}
.lista-del:hover{color:var(--red);}
.btn-add-item{background:transparent;border:1px dashed var(--muted2);border-radius:7px;padding:5px 11px;font-family:'Outfit',sans-serif;font-size:10px;color:var(--muted2);cursor:pointer;transition:all .2s;margin-top:5px;}
.btn-add-item:hover{border-color:var(--gold-mid);color:var(--gold);}

.opcao-rodape{display:flex;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--border2);}
.btn-del-opcao{background:transparent;border:1px solid var(--border2);border-radius:8px;padding:5px 11px;font-family:'Outfit',sans-serif;font-size:10px;color:var(--muted2);cursor:pointer;transition:all .2s;}
.btn-del-opcao:hover{color:var(--red);border-color:var(--red-border);}

/* BOTÕES GRANDES */
.btn-add-opcao{width:100%;background:transparent;border:1px dashed var(--border);border-radius:14px;padding:16px;font-family:'Outfit',sans-serif;font-size:12px;color:var(--muted);cursor:pointer;transition:all .2s;}
.btn-add-opcao:hover{border-color:var(--gold-mid);color:var(--gold);background:var(--gold-dim);}
.btn-add-ambiente{width:100%;background:transparent;border:1px dashed var(--border);border-radius:16px;padding:22px;font-family:'Quicksand',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;margin-top:20px;}
.btn-add-ambiente:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}

/* COMENTÁRIOS DO CLIENTE */
.coments{margin-top:14px;border:1px solid var(--gold-mid);border-radius:12px;background:var(--gold-dim);padding:14px 16px;}
.coments-titulo{font-family:'Quicksand',sans-serif;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}
.coment{border-top:1px solid var(--border2);padding:9px 0;font-size:12px;color:var(--off);}
.coment:first-of-type{border-top:none;}
.coment-meta{font-size:10px;color:var(--muted);margin-bottom:3px;display:flex;align-items:center;gap:7px;}
.coment-txt{line-height:1.55;}
.coment-audio{margin-top:6px;width:100%;max-width:300px;height:30px;}
.btn-resolver{background:transparent;border:1px solid var(--green-border);border-radius:7px;padding:4px 10px;font-family:'Outfit',sans-serif;font-size:10px;color:var(--green);cursor:pointer;margin-top:7px;transition:all .2s;}
.btn-resolver:hover{background:var(--green-dim);}
.coment.resolvido{opacity:.45;}

/* ESTADOS */
.vazio{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--border2);border-radius:14px;}
.carregando{padding:80px 20px;text-align:center;color:var(--muted);font-size:13px;}
.spinner{width:26px;height:26px;border:2px solid var(--border2);border-top-color:var(--gold);border-radius:50%;margin:0 auto 14px;animation:girar .8s linear infinite;}
@keyframes girar{to{transform:rotate(360deg);}}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,20,24,.96);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:11px;padding:13px 22px;font-size:12px;color:var(--off);z-index:1000;opacity:0;pointer-events:none;transition:opacity .3s;white-space:nowrap;}
.toast.vis{opacity:1;}
.toast.ok{border-color:var(--green-border);}
.toast.erro{border-color:var(--red-border);}

@media(max-width:768px){
  .doc{padding:88px 20px 100px;}
  .top-bar{padding:0 16px;}
  .opcoes-grid{grid-template-columns:1fr;}
  .doc-titulo{font-size:32px;}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-left">
    <button class="btn-voltar" onclick="voltar()">← Projeto</button>
    <div class="top-cliente">
      <span class="top-nome" id="top-nome">Carregando...</span>
      <span class="top-sub">Editor de Layout</span>
    </div>
  </div>
  <div class="top-right">
    <span class="modo-tag">Modo arquiteto</span>
    <button class="btn-preview" onclick="verComoCliente()">Ver como cliente</button>
  </div>
</div>

<div class="doc">
  <div class="doc-header">
    <div class="doc-eyebrow">Etapa 02 · Guide Arquitetura</div>
    <h1 class="doc-titulo">Estudo de Layout</h1>
    <p class="doc-sub">Monte os ambientes e as opções de layout deste projeto. O cliente verá exatamente esta estrutura, em modo de leitura, quando a etapa for liberada.</p>
  </div>

  <div id="conteudo">
    <div class="carregando"><div class="spinner"></div>Carregando projeto...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

<script>
// ── SUPABASE ──
const SUPABASE_URL = 'https://fkbvwcppbjlodtnjrmbw.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZrYnZ3Y3BwYmpsb2R0bmpybWJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MDk2OTAsImV4cCI6MjA5NTM4NTY5MH0.yjO-PxGPgQrV6dVYK8OjkaaKQWfaVbTrpnl_1qCSjB8';

let sb = null;
if (window.supabase && window.supabase.createClient) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

const BUCKET = 'projetos-imagens';
const ETAPA = 'layout';

let projetoId = null;
let ambientes = [];          // [{id, nome, ordem, opcoes:[...], }]
let comentarios = [];        // comentários do cliente nesta etapa
let rodadasUsadas = 0;       // rodadas de revisão que o cliente já gastou
let maxRodadas = 2;
let timers = {};             // debounce por campo

// ── UTIL ──
function toast(msg, tipo){
  const e = document.getElementById('toast');
  e.textContent = msg;
  e.className = 'toast vis' + (tipo ? ' ' + tipo : '');
  setTimeout(()=>{ e.className = 'toast'; }, 2600);
}
function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function doisDigitos(n){ return String(n).padStart(2,'0'); }
function voltar(){ window.location.href = '/admin-projeto?id=' + encodeURIComponent(projetoId); }
function verComoCliente(){ window.open('/layout?projeto=' + encodeURIComponent(projetoId), '_blank'); }

// Salvamento com atraso — não grava a cada tecla
function agendar(chave, fn){
  clearTimeout(timers[chave]);
  timers[chave] = setTimeout(fn, 700);
}

// ── CARGA ──
async function inicializar(){
  if(!sb){ document.getElementById('conteudo').innerHTML = '<div class="vazio">Erro de conexão. Recarregue a página.</div>'; return; }

  const { data: sessao } = await sb.auth.getSession();
  if(!sessao.session){ window.location.href = '/admin'; return; }

  // Só arquiteto entra aqui
  const { data: arq } = await sb.from('arquitetos').select('nome').eq('email', sessao.session.user.email).maybeSingle();
  if(!arq){ await sb.auth.signOut(); window.location.href = '/admin'; return; }

  projetoId = new URLSearchParams(window.location.search).get('id');
  if(!projetoId){
    document.getElementById('conteudo').innerHTML = '<div class="vazio">Nenhum projeto informado. Volte ao painel e abra um projeto.</div>';
    return;
  }

  const { data: proj, error } = await sb.from('projetos').select('nome_cliente').eq('id', projetoId).single();
  if(error || !proj){
    document.getElementById('conteudo').innerHTML = '<div class="vazio">Projeto não encontrado.</div>';
    return;
  }
  document.getElementById('top-nome').textContent = proj.nome_cliente || 'Projeto';

  await carregarTudo();
}

async function carregarTudo(){
  const { data: ambs, error } = await sb.from('ambientes')
    .select('id, nome, ordem')
    .eq('projeto_id', projetoId)
    .order('ordem', { ascending: true });

  if(error){ toast('Erro ao carregar ambientes', 'erro'); console.error(error); return; }
  ambientes = ambs || [];

  if(ambientes.length){
    const ids = ambientes.map(a=>a.id);

    const { data: ops } = await sb.from('opcoes_layout')
      .select('id, ambiente_id, titulo, caracteristicas, diferenciais, ordem')
      .in('ambiente_id', ids)
      .order('ordem', { ascending: true });

    const opIds = (ops||[]).map(o=>o.id);
    let imgs = [];
    if(opIds.length){
      const { data: im } = await sb.from('imagens')
        .select('id, opcao_id, url, nome, tipo, ordem')
        .in('opcao_id', opIds)
        .order('ordem', { ascending: true });
      imgs = im || [];
    }

    const { data: coms } = await sb.from('comentarios')
      .select('id, ambiente_id, elemento_id, elemento_tipo, texto, reacao, audio_url, status, criado_em')
      .eq('projeto_id', projetoId)
      .eq('etapa', ETAPA)
      .order('criado_em', { ascending: true });
    comentarios = coms || [];

    // Status que o cliente deu a cada ambiente + rodadas de revisão já usadas
    const { data: sts } = await sb.from('ambiente_status')
      .select('ambiente_id, status')
      .in('ambiente_id', ids)
      .eq('etapa', ETAPA);

    const { data: rev } = await sb.from('revisoes_etapa')
      .select('rodadas_usadas, max_rodadas')
      .eq('projeto_id', projetoId)
      .eq('etapa', ETAPA)
      .maybeSingle();
    rodadasUsadas = rev ? rev.rodadas_usadas : 0;
    maxRodadas = rev && rev.max_rodadas ? rev.max_rodadas : 2;

    ambientes.forEach(a=>{
      const s = (sts||[]).find(x=>x.ambiente_id === a.id);
      a.status = (s && s.status !== 'pendente') ? s.status : null;
    });

    ambientes.forEach(a=>{
      a.opcoes = (ops||[]).filter(o=>o.ambiente_id === a.id).map(o=>({
        ...o,
        caracteristicas: Array.isArray(o.caracteristicas) ? o.caracteristicas : [],
        diferenciais: Array.isArray(o.diferenciais) ? o.diferenciais : [],
        plantas: imgs.filter(i=>i.opcao_id === o.id && i.tipo === 'planta'),
        referencias: imgs.filter(i=>i.opcao_id === o.id && i.tipo === 'referencia')
      }));
    });
  }

  render();
}

// ── RENDER ──
function render(){
  const alvo = document.getElementById('conteudo');

  if(!ambientes.length){
    alvo.innerHTML = `
      <div class="vazio">Este projeto ainda não tem ambientes.<br>Comece adicionando o primeiro.</div>
      <button class="btn-add-ambiente" onclick="addAmbiente()">+ Adicionar ambiente</button>`;
    return;
  }

  alvo.innerHTML = painelResumo()
    + ambientes.map((a, i)=>blocoAmbiente(a, i)).join('')
    + `<button class="btn-add-ambiente" onclick="addAmbiente()">+ Adicionar ambiente</button>`;
}

// Resumo do que o cliente já respondeu nesta etapa
function painelResumo(){
  const pendentes = comentarios.filter(c=>c.status === 'pendente').length;
  const revisao = ambientes.filter(a=>a.status === 'revisao').length;
  const aprovados = ambientes.filter(a=>a.status === 'aprovado').length;
  const restantes = maxRodadas - rodadasUsadas;

  return `
  <div class="resumo-cliente">
    <div class="resumo-item">
      <div class="resumo-num">${aprovados}/${ambientes.length}</div>
      <div class="resumo-lbl">Aprovados pelo cliente</div>
    </div>
    <div class="resumo-item ${revisao ? 'alerta' : ''}">
      <div class="resumo-num">${revisao}</div>
      <div class="resumo-lbl">Com pedido de revisão</div>
    </div>
    <div class="resumo-item ${pendentes ? 'alerta' : ''}">
      <div class="resumo-num">${pendentes}</div>
      <div class="resumo-lbl">Comentários pendentes</div>
    </div>
    <div class="resumo-item ${restantes <= 0 ? 'alerta' : ''}">
      <div class="resumo-num">${rodadasUsadas}/${maxRodadas}</div>
      <div class="resumo-lbl">Rodadas de revisão usadas</div>
    </div>
  </div>`;
}

function badgeStatus(a){
  if(a.status === 'aprovado') return '<span class="amb-badge ok">✓ Aprovado</span>';
  if(a.status === 'revisao')  return '<span class="amb-badge rev">✎ Revisão solicitada</span>';
  return '<span class="amb-badge">Não revisado</span>';
}

function blocoAmbiente(a, i){
  const opcoes = a.opcoes || [];
  const ultimo = i === ambientes.length - 1;
  return `
  <div class="ambiente-bloco">
    <div class="ambiente-header">
      <div class="ambiente-num">${doisDigitos(i+1)}</div>
      <div class="ambiente-info">
        <input class="ambiente-titulo" value="${esc(a.nome)}"
               placeholder="Nome do ambiente"
               oninput="renomearAmbiente('${a.id}', this.value)">
      </div>
      ${badgeStatus(a)}
      <div class="ambiente-acoes">
        <button class="btn-mini" title="Subir" onclick="moverAmbiente('${a.id}',-1)" ${i===0?'disabled':''}>↑</button>
        <button class="btn-mini" title="Descer" onclick="moverAmbiente('${a.id}',1)" ${ultimo?'disabled':''}>↓</button>
        <button class="btn-mini perigo" title="Remover ambiente" onclick="removerAmbiente('${a.id}')">✕</button>
      </div>
    </div>

    ${opcoes.length
      ? `<div class="opcoes-grid">${opcoes.map((o,j)=>cardOpcao(a, o, j)).join('')}</div>`
      : `<div class="vazio" style="margin-bottom:14px">Nenhuma opção de layout ainda.</div>`}

    <button class="btn-add-opcao" onclick="addOpcao('${a.id}')">+ Adicionar opção de layout</button>
  </div>`;
}

function cardOpcao(a, o, j){
  const coms = comentarios.filter(c=>c.elemento_id === o.id);
  return `
  <div class="opcao-card">
    <div class="opcao-topo">
      <input class="opcao-tag" value="${esc(o.titulo || '')}"
             placeholder="Opção ${doisDigitos(j+1)}"
             oninput="renomearOpcao('${o.id}', this.value)">
    </div>

    <div class="bloco-label">Plantas <span>${o.plantas.length}</span></div>
    <div class="img-tira">
      ${o.plantas.map(p=>miniImg(p, o.id)).join('')}
      <button class="img-add" title="Adicionar planta" onclick="escolherArquivo('${o.id}','planta')">+</button>
    </div>

    <div class="bloco-label">Referências visuais <span>${o.referencias.length}</span></div>
    <div class="img-tira">
      ${o.referencias.map(r=>miniImg(r, o.id)).join('')}
      <button class="img-add" title="Adicionar referência" onclick="escolherArquivo('${o.id}','referencia')">+</button>
    </div>

    <div class="bloco-label">Características <span>aparecem no card</span></div>
    ${o.caracteristicas.map((c,k)=>itemLista(o.id,'caracteristicas',k,c)).join('')}
    <button class="btn-add-item" onclick="addItem('${o.id}','caracteristicas')">+ característica</button>

    <div class="bloco-label">Diferenciais <span>aparecem ao expandir</span></div>
    ${o.diferenciais.map((d,k)=>itemLista(o.id,'diferenciais',k,d)).join('')}
    <button class="btn-add-item" onclick="addItem('${o.id}','diferenciais')">+ diferencial</button>

    ${coms.length ? blocoComentarios(coms) : ''}

    <div class="opcao-rodape">
      <button class="btn-del-opcao" onclick="removerOpcao('${o.id}')">Remover opção</button>
    </div>
  </div>`;
}

function miniImg(img, opcaoId){
  return `<div class="img-mini">
    <img src="${esc(img.url)}" alt="${esc(img.nome||'')}" loading="lazy">
    <button class="img-mini-del" title="Remover" onclick="removerImagem('${img.id}','${esc(img.nome||'')}')">✕</button>
  </div>`;
}

function itemLista(opcaoId, campo, idx, valor){
  return `<div class="lista-item">
    <input class="lista-input" value="${esc(valor)}"
           placeholder="${campo === 'caracteristicas' ? 'Ex: Sofá em L voltado para a varanda' : 'Ex: Ampla circulação central entre os espaços'}"
           oninput="editarItem('${opcaoId}','${campo}',${idx}, this.value)">
    <button class="lista-del" title="Remover" onclick="removerItem('${opcaoId}','${campo}',${idx})">✕</button>
  </div>`;
}

function blocoComentarios(coms){
  const pendentes = coms.filter(c=>c.status === 'pendente').length;
  return `<div class="coments">
    <div class="coments-titulo">Comentários do cliente${pendentes ? ` · ${pendentes} pendente${pendentes>1?'s':''}` : ' · todos resolvidos'}</div>
    ${coms.map(c=>`
      <div class="coment ${c.status === 'resolvido' ? 'resolvido' : ''}">
        <div class="coment-meta">
          ${c.reacao ? `<span>${esc(c.reacao)}</span>` : ''}
          <span>${new Date(c.criado_em).toLocaleDateString('pt-BR')}</span>
          ${c.status === 'resolvido' ? '<span>· resolvido</span>' : ''}
        </div>
        ${c.texto ? `<div class="coment-txt">${esc(c.texto)}</div>` : ''}
        ${c.audio_url ? `<audio class="coment-audio" controls src="${esc(c.audio_url)}"></audio>` : ''}
        ${c.status === 'pendente' ? `<button class="btn-resolver" onclick="resolverComentario('${c.id}')">Marcar como resolvido</button>` : ''}
      </div>`).join('')}
  </div>`;
}

// ── AMBIENTES ──
async function addAmbiente(){
  const ordem = ambientes.length ? Math.max(...ambientes.map(a=>a.ordem ?? 0)) + 1 : 0;
  const { data, error } = await sb.from('ambientes')
    .insert({ projeto_id: projetoId, nome: 'Novo ambiente', ordem })
    .select('id, nome, ordem')
    .single();
  if(error){ toast('Erro ao criar ambiente', 'erro'); console.error(error); return; }
  data.opcoes = [];
  ambientes.push(data);
  render();
  toast('Ambiente adicionado', 'ok');
}

function renomearAmbiente(id, nome){
  const a = ambientes.find(x=>x.id === id);
  if(a) a.nome = nome;
  agendar('amb-'+id, async ()=>{
    const { error } = await sb.from('ambientes').update({ nome }).eq('id', id);
    if(error){ toast('Erro ao salvar nome', 'erro'); return; }
    toast('Salvo', 'ok');
  });
}

async function removerAmbiente(id){
  const a = ambientes.find(x=>x.id === id);
  const qtd = (a?.opcoes || []).length;
  const aviso = qtd
    ? `Remover "${a.nome}"? As ${qtd} opção(ões) de layout e as imagens deste ambiente também serão apagadas.`
    : `Remover "${a?.nome}"?`;
  if(!confirm(aviso)) return;

  const { error } = await sb.from('ambientes').delete().eq('id', id);
  if(error){ toast('Erro ao remover', 'erro'); console.error(error); return; }
  ambientes = ambientes.filter(x=>x.id !== id);
  await reordenar();
  render();
  toast('Ambiente removido', 'ok');
}

async function moverAmbiente(id, dir){
  const i = ambientes.findIndex(a=>a.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= ambientes.length) return;
  [ambientes[i], ambientes[j]] = [ambientes[j], ambientes[i]];
  render();
  await reordenar();
}

async function reordenar(){
  for(let i = 0; i < ambientes.length; i++){
    if(ambientes[i].ordem !== i){
      ambientes[i].ordem = i;
      await sb.from('ambientes').update({ ordem: i }).eq('id', ambientes[i].id);
    }
  }
}

// ── OPÇÕES ──
async function addOpcao(ambienteId){
  const a = ambientes.find(x=>x.id === ambienteId);
  if(!a) return;
  const ordem = a.opcoes.length;
  const { data, error } = await sb.from('opcoes_layout')
    .insert({ ambiente_id: ambienteId, titulo: 'Opção ' + doisDigitos(ordem+1), caracteristicas: [], diferenciais: [], ordem })
    .select('id, ambiente_id, titulo, caracteristicas, diferenciais, ordem')
    .single();
  if(error){ toast('Erro ao criar opção', 'erro'); console.error(error); return; }
  a.opcoes.push({ ...data, caracteristicas: [], diferenciais: [], plantas: [], referencias: [] });
  render();
  toast('Opção adicionada', 'ok');
}

function renomearOpcao(id, titulo){
  const o = acharOpcao(id);
  if(o) o.titulo = titulo;
  agendar('op-'+id, async ()=>{
    const { error } = await sb.from('opcoes_layout').update({ titulo }).eq('id', id);
    if(error){ toast('Erro ao salvar título', 'erro'); return; }
    toast('Salvo', 'ok');
  });
}

async function removerOpcao(id){
  const o = acharOpcao(id);
  if(!confirm(`Remover "${o?.titulo || 'esta opção'}"? As imagens desta opção também serão apagadas.`)) return;
  const { error } = await sb.from('opcoes_layout').delete().eq('id', id);
  if(error){ toast('Erro ao remover', 'erro'); console.error(error); return; }
  ambientes.forEach(a=>{ a.opcoes = a.opcoes.filter(x=>x.id !== id); });
  render();
  toast('Opção removida', 'ok');
}

function acharOpcao(id){
  for(const a of ambientes){
    const o = (a.opcoes||[]).find(x=>x.id === id);
    if(o) return o;
  }
  return null;
}

// ── LISTAS (características / diferenciais) ──
function addItem(opcaoId, campo){
  const o = acharOpcao(opcaoId);
  if(!o) return;
  o[campo] = [...o[campo], ''];
  render();
  // foca o campo recém-criado
  const inputs = document.querySelectorAll(`[oninput*="editarItem('${opcaoId}','${campo}'"]`);
  if(inputs.length) inputs[inputs.length-1].focus();
  salvarLista(opcaoId, campo);
}

function editarItem(opcaoId, campo, idx, valor){
  const o = acharOpcao(opcaoId);
  if(!o) return;
  o[campo][idx] = valor;
  agendar(`${campo}-${opcaoId}`, ()=>salvarLista(opcaoId, campo, true));
}

function removerItem(opcaoId, campo, idx){
  const o = acharOpcao(opcaoId);
  if(!o) return;
  o[campo] = o[campo].filter((_, k)=>k !== idx);
  render();
  salvarLista(opcaoId, campo);
}

async function salvarLista(opcaoId, campo, avisar){
  const o = acharOpcao(opcaoId);
  if(!o) return;
  const limpa = o[campo].filter(v=>String(v).trim() !== '');
  const { error } = await sb.from('opcoes_layout').update({ [campo]: limpa }).eq('id', opcaoId);
  if(error){ toast('Erro ao salvar', 'erro'); console.error(error); return; }
  if(avisar) toast('Salvo', 'ok');
}

// ── IMAGENS ──
function escolherArquivo(opcaoId, tipo){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/png,image/jpeg,image/webp';
  input.multiple = true;
  input.onchange = ()=>enviarImagens(input.files, opcaoId, tipo);
  input.click();
}

async function enviarImagens(files, opcaoId, tipo){
  const arquivos = [...files];
  if(!arquivos.length) return;
  const o = acharOpcao(opcaoId);
  if(!o) return;

  toast(`Enviando ${arquivos.length} imagem(ns)...`);
  const lista = tipo === 'planta' ? o.plantas : o.referencias;
  let ordem = lista.length;

  for(const file of arquivos){
    const seguro = file.name.replace(/[^\w.\-]/g, '_');
    const caminho = `${projetoId}/layout/${opcaoId}/${tipo}/${Date.now()}_${seguro}`;

    const { error: upErr } = await sb.storage.from(BUCKET).upload(caminho, file, { contentType: file.type });
    if(upErr){ toast(`Erro ao enviar "${file.name}"`, 'erro'); console.error(upErr); continue; }

    const { data: urlData } = sb.storage.from(BUCKET).getPublicUrl(caminho);

    const { data: reg, error: regErr } = await sb.from('imagens')
      .insert({ opcao_id: opcaoId, url: urlData.publicUrl, nome: file.name, tipo, ordem: ordem++ })
      .select('id, opcao_id, url, nome, tipo, ordem')
      .single();
    if(regErr){ toast('Erro ao registrar imagem', 'erro'); console.error(regErr); continue; }

    lista.push(reg);
  }

  render();
  toast('Imagens enviadas', 'ok');
}

async function removerImagem(id, nome){
  if(!confirm(`Remover a imagem "${nome || 'selecionada'}"?`)) return;
  const { error } = await sb.from('imagens').delete().eq('id', id);
  if(error){ toast('Erro ao remover imagem', 'erro'); console.error(error); return; }
  ambientes.forEach(a=>(a.opcoes||[]).forEach(o=>{
    o.plantas = o.plantas.filter(x=>x.id !== id);
    o.referencias = o.referencias.filter(x=>x.id !== id);
  }));
  render();
  toast('Imagem removida', 'ok');
}

// ── COMENTÁRIOS ──
async function resolverComentario(id){
  const { error } = await sb.from('comentarios')
    .update({ status: 'resolvido', resolvido_em: new Date().toISOString() })
    .eq('id', id);
  if(error){ toast('Erro ao resolver', 'erro'); console.error(error); return; }
  const c = comentarios.find(x=>x.id === id);
  if(c) c.status = 'resolvido';
  render();
  toast('Comentário resolvido', 'ok');
}

document.addEventListener('DOMContentLoaded', inicializar);
</script>
